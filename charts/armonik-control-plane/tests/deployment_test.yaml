suite: deployment defaults
templates:
  - deployments/control-plane.yaml
  - deployments/metrics-exporter.yaml
tests:
  - it: renders the control-plane deployment by default
    template: deployments/control-plane.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
  - it: keeps the selector to name, instance and static component only (immutable across upgrades)
    template: deployments/control-plane.yaml
    release:
      name: my-release
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: armonik-control-plane
            app.kubernetes.io/instance: my-release
            app.kubernetes.io/component: control-plane
  - it: renders the metrics-exporter by default
    template: deployments/metrics-exporter.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
  - it: renders no metrics-exporter when disabled
    template: deployments/metrics-exporter.yaml
    set:
      metricsExporter:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders affinity, which ships empty and so never rendered before
    set:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: role
                    operator: In
                    values: [compute]
    asserts:
      - equal:
          path: spec.template.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms[0].matchExpressions[0].key
          value: role

  - it: applies both the chart and the global imagePullSecrets, not one or the other
    set:
      imagePullSecrets:
        - name: from-chart
      global.imagePullSecrets:
        - name: from-global
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: from-chart
      - equal:
          path: spec.template.spec.imagePullSecrets[1].name
          value: from-global

  - it: takes the global imagePullSecrets alone, which the string-typed read used to mangle
    set:
      global.imagePullSecrets:
        - name: from-global
    asserts:
      - lengthEqual:
          path: spec.template.spec.imagePullSecrets
          count: 1
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: from-global

  - it: layers the metrics-exporter imagePullSecrets on the chart and global ones
    template: deployments/metrics-exporter.yaml
    set:
      metricsExporter.imagePullSecrets:
        - name: from-exporter
      imagePullSecrets:
        - name: from-chart
      global.imagePullSecrets:
        - name: from-global
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: from-exporter
            - name: from-chart
            - name: from-global
