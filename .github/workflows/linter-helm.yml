name: Helm charts linter
on:
  push:
    branches:
      - main
      - feat/revamp-helm
  pull_request:
    branches:
      - main
      - feat/revamp-helm
env:
  HELM_VERSION: v3.18.4
jobs:
  HelmChartlint:
    name: Lint Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
          check-latest: true

      # v2.8.0 floor: the bundled yamale must be >= 6 to run on Python >= 3.12
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Vendor chart dependencies
        if: steps.list-changed.outputs.changed == 'true'
        run: ./test/vendor.sh

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml --target-branch ${{ github.event.repository.default_branch }}

  # trivy matches each rendered resource against its Kubernetes checks, on
  # every chart whatever changed. The packaged archives are what
  # charts/scan-inputs.sh renders and traces back to the templates.
  chart-checks:
    name: Check the charts with trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TRIVY_VERSION: v0.76.2
      TRIVY_DISABLE_TELEMETRY: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
      TRIVY_NO_PROGRESS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Cache helm repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm/repository
          key: helm-repo-${{ hashFiles('charts/*/Chart.lock', 'charts/*/Chart.yaml', 'test/harness/*/Chart.lock') }}
          restore-keys: helm-repo-

      - name: Vendor chart dependencies
        run: ./test/vendor.sh

      - name: Package the charts
        run: ./charts/package-charts.sh -o dist

      # The runner image ships mikefarah yq v4, which the script checks.
      - name: Render the charts
        run: ./charts/scan-inputs.sh -d dist -o scan

      # Pinned by commit: see the "Set up trivy" step of publish.yml.
      - name: Set up trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Check the rendered charts
        run: |
          mkdir -p scan/reports
          trivy config --misconfig-scanners kubernetes \
            --format json --output scan/reports/charts.json scan/manifests

      # Templates link to the checked commit, the checked-out one.
      - name: Report
        run: |
          ./.github/scripts/trivy-charts-report.sh scan "$GITHUB_STEP_SUMMARY" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$(git rev-parse HEAD)"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-chart-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            scan/renders.tsv
            scan/documents.tsv
            scan/reports/misconfigurations.csv
