# ==== Global ====
global:
  # Read by no ArmoniK template: image tags resolve from global.armonik.versions
  # (armonik-common/values.yaml).
  version:
    # TODO: when null, fall back to the subchart defaults (compute-plane).
    armonikCore: "0.41.0"
    # armonikPollingagent: "0.35.0"
    # armonikGui: "0.15.3"
    # nginx: "1.27.4-alpine-slim"
  # For the third-party subcharts that read global.image (KEDA among them).
  image:
    pullPolicy: IfNotPresent
    registry: ""
  # -- Registry every image is pulled from, overriding each image's own; may carry a path prefix, so
  # one value relocates the release to a mirror. Dependencies honour it only if they implement the
  # convention themselves.
  imageRegistry: ""
  # Lets the Bitnami rabbitmq chart accept its bitnamilegacy and public.ecr.aws images.
  security:
    allowInsecureImages: true
  # ArmoniK pods (see armonik-common/values.yaml) and the Bitnami charts read it.
  # imagePullSecrets: [{"name": "secret"}]
  # Shown by the admin GUI (armonik-common/values.yaml).
  environment:
    description: "ArmoniK environment"
  # Cluster DNS domain; see armonik-common/values.yaml.
  clusterDomain: ""
  # Keys documented in armonik-common/values.yaml; only the umbrella's overrides are here.
  armonik:
    # Root dir of the conf mount Secrets in pods. Env strings and volumeMounts derive from it.
    mountPath: /mounts
    # Stated so the plane subcharts, which default it to "armonik", read this release's conf Secrets.
    source: '{{ .Release.Name }}'
    # Release of the control plane, for its URL. Set it only when the control plane is its own
    # release (e.g. --set global.armonik.controlPlane=my-cp); a top-level controlPlane.source on this
    # chart wins over it.
    controlPlane: '{{ .Release.Name }}'
    # All-in-one default: this release installs every operator through the armonik-operators subchart.
    operators:
      externalSecrets:
        deploy: true
      keda:
        deploy: true
      certManager:
        deploy: true
      mongodbOperator:
        deploy: true
      prometheusOperator:
        deploy: true
      # GCP-specific, only needed by a googleCas issuer (certManagerIssuer.provider=googleCas, for one).
      googleCasIssuer:
        deploy: false

    # monitoring.* keeps its armonik-common defaults. A layered install must set
    # monitoring.prometheusUrl, which derives only where this release installs kube-prometheus-stack.


# -- Chart name used in this chart's resource names and labels (armonik.name).
nameOverride: ""
# -- Name prefix of this chart's resources (armonik.fullname).
fullnameOverride: ""
# -- Namespace of the ArmoniK-owned resources. control-plane.namespaceOverride and
# compute-plane.namespaceOverride must equal it (templates/namespace-guard.yaml); a dependency follows
# only through its own namespace key, and those without one stay in the release namespace.
namespaceOverride: ""

# ==== ArmoniK application ====
control-plane:
  enabled: true
  defaultPartition: default
  extraPartitions:
    # default:
    #   podMax: 100
    #   podReserved: 50
    #   preemptionPercentage: 20
    #   priority: 1
  init:
    enabled: true
  rbac:
    createBuiltInRoles: true
  # priorityClassName:

compute-plane:
  # The default partitions make a plain `helm install` usable; enabled=true requires at least one.
  # enabled=false gives a base release (control plane, storage, operators, conf) whose partitions come
  # from separate armonik-compute-plane releases (see NOTES.txt).
  enabled: true
  serviceAccount:
    create: true
  # partitionCommon:
  #   priorityClassName:
  # Partitions accumulate across values files; drop one of these with
  # `--set compute-plane.partitions.htcmock=null`.
  partitions:
    default:
      worker:
        # Tag from global.armonik.versions.extCsharp.
        image:
          repository: "dockerhubaneo/armonik-dynamic-dotnet-worker"
    stream:
      worker:
        image:
          repository: "dockerhubaneo/armonik_core_stream_test_worker"
    htcmock:
      worker:
        image:
          repository: "dockerhubaneo/armonik_core_htcmock_test_worker"

# Conf layers, rendered as the <source>-conf-<layer>[-mount] Secrets. Schema at the top of
# armonik-common/templates/_conf.tpl.
conf:
  log:
    minimumLevel: Information
  # ESO sync interval of every conf ExternalSecret, env and mount alike. Defaults to 1h0m0s; 0 syncs
  # once and never refreshes. Raise it behind a metered store (Secret Manager bills per access).
  # refreshInterval: 1h0m0s
  # CreatedOnce, Periodic (the ESO default) or OnChange.
  # refreshPolicy: Periodic
  # A source reads this release's Kubernetes-provider SecretStore unless it names a store that
  # already exists (these charts create none but their own): that is how a value comes from Secret
  # Manager, Vault or any other ESO provider.
  # core:
  #   env:
  #     MongoDB__Host: cluster0.example.mongodb.net
  #   envFromSecret:
  #     MongoDB__User:
  #       storeName: gcp-secret-manager
  #       storeKind: ClusterSecretStore
  #       secret: armonik-mongodb
  #       field: user
  #     MongoDB__Password:
  #       storeName: vault-backend
  #       secret: armonik/mongodb
  #       field: password
  #       version: "3"
  #   envSecret:
  #     - secret: armonik/core-env
  #       storeName: vault-backend
  #   mountSecret:
  #     - storeName: gcp-secret-manager
  #       storeKind: ClusterSecretStore
  #       secret: armonik-gcs-service-account
  #       items:
  #         credentials.json: {}

# ==== Ingress ====
ingress:
  enabled: true
  # priorityClassName:
  # Secret templates/secrets/armonik-urls.yaml renders and the ingress reads.
  urlsSecretName: '{{ .Release.Name }}-urls'

# ==== Shared cert-manager issuer ====
# The Issuer named by global.armonik.certManager.issuer, rendered when both that issuer.enabled and
# create are true; otherwise the Issuer must already exist and nothing below is used. See
# charts/cert-manager-issuer.md.
#
# The block of the selected provider is forwarded as-is: selfSigned/ca/vault/acme/venafi become
# Issuer.spec.<provider> (https://cert-manager.io/docs/configuration/); googleCas is a separate CRD
# (cas-issuer.jetstack.io) whose block is the whole CR spec.
certManagerIssuer:
  create: false
  provider: selfSigned
  selfSigned: {}
    # crlDistributionPoints: []
  ca: {}
    # secretName: ""
  vault: {}
    # server: ""
    # path: ""
    # caBundle: ""
    # auth: {}
  acme: {}
    # server: ""
    # email: ""
    # privateKeySecretRef:
    #   name: ""
    # solvers: []
  venafi: {}
    # zone: ""
    # tpp:
    #   url: ""
    #   credentialsRef:
    #     name: ""
    #   # Already base64-encoded.
    #   caBundle: ""
    # cloud:
    #   apiTokenSecretRef:
    #     name: ""
    #     key: apikey
  googleCas: {}
    # project: ""
    # location: ""
    # caPoolId: ""
    # certificateAuthorityId: ""
    # credentials:
    #   name: ""
    #   key: credentials.json

# ==== Dependencies (armonik-dependencies, alias dependencies) ====
# Only the values ArmoniK sets; the rest is each chart's own. To bring your own backend (MongoDB,
# Redis, ActiveMQ, RabbitMQ), set dependencies.<backend>.enabled=false and supply its connection
# through conf.core.env / conf.core.envFromSecret.
dependencies:
  # == RabbitMQ ==
  rabbitmq:
    image:
      registry: bitnamilegacy
      repository: rabbitmq
      tag: 4.1.3
    enabled: false
    auth:
      username: "admin"
      password: "admin"
      # tls:
      #   enabled: false
      #   autoGenerated: false
    # resourcesPreset: nano
    persistence:
      enabled: false
    metrics:
      image:
        registry: public.ecr.aws
      enabled: true
      serviceMonitor:
        enabled: true
    # priorityClassName:

  # == Redis (valkey) ==
  redis:
    enabled: true
    image:
      registry: public.ecr.aws
    auth:
      enabled: true
      # tpl-rendered by valkey; templates/secrets/redis-users.yaml creates it under that same name.
      usersExistingSecret: '{{ .Release.Name }}-redis-users'
      aclUsers:
        default:
          permissions: "~* &* +@all"
    replica:
      enabled: false
    tls:
      enabled: false
      existingSecret: ""
      # cert-manager's default output Secret keys.
      serverPublicKey: tls.crt
      serverKey: tls.key
      caPublicKey: ca.crt
    metrics:
      enabled: true
      image:
        registry: public.ecr.aws
      serviceMonitor:
        enabled: true
        port: http-metrics
    valkeyConfig: |
      # Disable AOF persistence and RDB snapshots for performance reasons
      save ""
      appendonly no
    # priorityClassName:

  # Equivalent values for the Bitnami redis chart, kept for reference.
  # redis:
  #   enabled: true
  #   image:
  #     registry: public.ecr.aws
  #   useStatefulSet: true
  #   replica:
  #     replicaCount: 1
  #     persistence:
  #       enabled: false
  #     autoscaling:
  #       enabled: false
  #       targetCPU: "80"
  #       targetMemory: "80"
  #   fullnameOverride: "redis"
  #   tls: # Bitnami chart bug: https://github.com/bitnami/charts/issues/29616
  #     enabled: false
  #     autoGenerated: false
  #     authClients: false
  #     # existingSecret: redis-crt
  #     # certFilename: "tls-combined.pem"
  #     # certKeyFilename: "tls.key"
  #     # certCAFilename: "ca.crt"
  #   usernames:
  #     admin: admin
  #   master:
  #     resourcesPreset: nano
  #     persistence:
  #       enabled: false
  #     containerPorts:
  #       redis: 6379
  #   metrics:
  #     image:
  #         registry: public.ecr.aws
  #     enabled: true
  #     serviceMonitor:
  #       enabled: true

  # == ActiveMQ (charts/activemq) ==
  activemq:
    enabled: true
    replicas: 1
    image:
      registry: docker.io
    # Defaults to system-cluster-critical.
    # priorityClassName:

  # == MongoDB (Percona psmdb-db) ==
  # Defaults suit a development or test cluster. Sharding is not supported yet.
  # Upstream values: https://github.com/percona/percona-helm-charts/tree/main/charts/psmdb-db
  mongodb:
    enabled: true
    sharding:
      enabled: false
    backup:
      enabled: false
    # mongod already logs logv2 JSON to stdout, which fluent-bit collects: no Percona log sidecar.
    logcollector:
      enabled: false
    replsets:
      rs0:
        size: 1
        # priorityClass:
    # existingConfigmap: "mongodb-armonik-scripts"
    tls:
      mode: preferTLS
      allowInvalidCertificates: true
      # issuerConf:
      #   name: armonik-selfsigned-issuer
      #   kind: ClusterIssuer
      #   group: cert-manager.io
    # replsetSize allows the single-member rs0 above. ArmoniK reads tls=true as "TLS not required":
    # set it to false to have Core and mongodb-exporter connect over TLS with the CA mounted.
    unsafeFlags:
      replsetSize: true
      tls: true
    finalizers: []

  # == mongodb-exporter (prometheus-mongodb-exporter) ==
  # existingSecret.{name,key} is the single source of truth for the Secret holding the exporter's
  # connection URI: templates/secrets/mongodb-exporter-secret.yaml renders an ExternalSecret under
  # that name, composing the URI from the psmdb-db cluster-monitor credentials.
  mongodb-exporter:
    enabled: true
    existingSecret:
      # -- Secret the exporter reads its URI from, written by the umbrella's ExternalSecret. A fixed
      # name, since the exporter chart tpl-renders neither this nor `volumes`: two releases sharing a
      # namespace need distinct names, here and in `volumes[0].secret.secretName`.
      name: mongodb-exporter-secret
      key: mongodb-uri
    # Off: this static value cannot be gated on the prometheusOperator CRDs being available, so
    # templates/servicemonitors/mongodb-exporter.yaml renders a gated ServiceMonitor instead.
    serviceMonitor:
      enabled: false
    # The CA for the URI's tlsCAFile, when MongoDB requires TLS. The whole Secret is mounted, without
    # `items`: its ca.crt key exists only in that case, and an items entry naming an absent key blocks
    # the pod in ContainerCreating. secretName must equal existingSecret.name.
    volumes:
      - name: mongodb-ca
        secret:
          secretName: mongodb-exporter-secret
    volumeMounts:
      - name: mongodb-ca
        mountPath: /mongodb/certificate
        readOnly: true
    # priorityClassName:

  # KEDA, cert-manager, kube-prometheus-stack and external-secrets are operators, configured under
  # operators.* (see the Operators section below).

  # == Grafana ==
  grafana:
    image:
      registry: docker.io
    enabled: true
    serviceMonitor:
      enabled: true
    grafana.ini:
      server:
        # Keep root_url path-less and serve_from_sub_path false: the ingress injects Grafana's public
        # prefix itself (armonik-ingress/templates/_armonik-conf.tpl), which needs an empty appSubUrl.
        # Enforced by templates/validate.yaml.
        domain: grafana.local
        root_url: http://grafana
        serve_from_sub_path: false
      auth.anonymous:
        enabled: true
    sidecar:
      dashboards:
        enabled: true
        folderAnnotation: "grafana_dashboard_folder"
        label: "grafana_dashboard"
        # -- Namespaces the sidecar watches: this release's plus the prometheusOperator one, where
        # kube-prometheus-stack renders its Kubernetes and node dashboards (`rbac.namespaced=false`
        # already grants the cluster-wide read). Avoid `helm upgrade --reuse-values`: it replays the
        # old coalesced values, where the grafana chart's `searchNamespace: null` beats this default.
        searchNamespace:
          - '{{ include "armonik.monitoring.dashboardNamespaces.default" . }}'
      datasources:
        enabled: true
    # priorityClassName:

    # Applied once networkPolicy.enabled=true: egress to Prometheus (9090), HTTPS and the
    # Kubernetes API (443, 6443).
    networkPolicy:
      egress:
        enabled: true
        blockDNSResolution: false
        ports:
          - protocol: TCP
            port: 9090
          - protocol: TCP
            port: 443
          - protocol: TCP
            port: 6443

  # == fluent-bit (DaemonSet) ==
  fluent-bit:
    enabled: true
    # priorityClassName:
    daemonSetVolumes:
      - name: runlogjournal
        hostPath:
          path: /run/log/journal
          type: ''
      - name: dmesg
        hostPath:
          path: /var/log/dmesg
          type: ''
      - name: varlog
        hostPath:
          path: /var/log
          type: ''
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
          type: ''
    daemonSetVolumeMounts:
      - name: runlogjournal
        readOnly: true
        mountPath: /run/log/journal
      - name: dmesg
        readOnly: true
        mountPath: /var/log/dmesg
      - name: varlog
        readOnly: true
        mountPath: /var/log
      - name: varlibdockercontainers
        readOnly: true
        mountPath: /var/lib/docker/containers

    config:
            # Parsers_File  /fluent-bit/etc/parsers.conf
      service: |
        [SERVICE]
            Daemon        Off
            Flush         1
            Log_Level     info
            Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020
            Health_Check  On
      inputs: |
        [INPUT]
            Name               tail
            Tag                kube.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log, /var/log/containers/*_mongod-*.log, /var/log/containers/*_mongos-*.log
            Parser             cri
            Docker_Mode        On
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
        [INPUT]
            Name               tail
            Tag                application.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log, /var/log/containers/*ingress*.log, /var/log/containers/keda*.log
            Parser             cri
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
      filters: |
        [FILTER]
            Name                kubernetes
            Match               *
            Kube_URL            https://kubernetes.default.svc:443
            Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
            Kube_Tag_Prefix     kube.var.log.containers.
            Merge_Log           On
            Merge_Log_Trim      On
            Merge_Parser        json
            Keep_Log            Off
            Annotations         On
            Labels              On
            K8S-Logging.Parser  On
            K8S-Logging.Exclude Off
            Buffer_Size         0
        [FILTER]
            Name                    nest
            Match                   *
            Operation               lift
            Nested_under            kubernetes
            Add_prefix              kubernetes_
        # MongoDB speaks logv2, not CLEF so we have to do some mapping
        [FILTER]
            Name                    modify
            Match                   kube.var.log.containers.*_mongo*
            Condition               Key_Value_Equals s F
            Set                     @l Fatal
        [FILTER]
            Name                    modify
            Match                   kube.var.log.containers.*_mongo*
            Condition               Key_Value_Equals s E
            Set                     @l Error
        [FILTER]
            Name                    modify
            Match                   kube.var.log.containers.*_mongo*
            Condition               Key_Value_Equals s W
            Set                     @l Warning
        [FILTER]
            Name                    modify
            Match                   kube.var.log.containers.*_mongo*
            Condition               Key_Value_Matches s ^D
            Set                     @l Debug
        # t is removed because @t already carries the same instant.
        [FILTER]
            Name                    modify
            Match                   kube.var.log.containers.*_mongo*
            Set                     Application MongoDB
            Rename                  msg  @m
            Rename                  s    MongoSeverity
            Rename                  c    MongoComponent
            Rename                  ctx  MongoContext
            Rename                  id   MongoEventId
            Rename                  attr MongoAttributes
            Remove                  t
        [FILTER]
            Name                    modify
            Match                   *
            Condition               Key_exists log
            Rename                  log @m
            Add                     sourcetype renamelog
      outputs: |
        [OUTPUT]
            Name                    http
            Match                   kube.*
            # The umbrella's own Service in front of seq (templates/services/seq-ingestion.yaml).
            Host                    {{ include "armonik.seq.ingestionService" .Release.Name }}
            Port                    {{ include "armonik.seq.ingestionPort" . }}
            URI                     /api/events/raw?clef
            Header                  Content-Type application/vnd.serilog.clef
            Format                  json_lines
            json_date_key           @t
            json_date_format        iso8601
        [OUTPUT]
            Name                    stdout
            Match                   kube.*
      customParsers: |
        [PARSER]
            Name   json
            Format json
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        [PARSER]
            Name cri
            Format regex
            Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
            Time_Keep On

    # Regex ^(?:(?<time>[^\s]+)\s+(?<stream>\w+)\s+(?<logtag>\w+)\s+)?(?<log>\{.*\})$
  # fluent-bit:
  #   image:
  #       registry: public.ecr.aws
  #   enabled: true
  #   fullnameOverride: "fluent-bit"
  #   daemonset:
  #     enabled: true
  #   metrics:
  #     enabled: true
  #     serviceMonitor:
  #       enabled: true
  #   #existingConfigMap: "fluent-bit-config-armonik" # Broken in the Bitnami chart
