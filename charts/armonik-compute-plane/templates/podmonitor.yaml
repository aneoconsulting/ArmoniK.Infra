{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- if $ops.prometheusOperator.available }}
{{/* Polling-agent metrics (1080) of every partition. */}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "armonik.fullname" $ | printf "%s-compute-plane" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  labels:
    app.kubernetes.io/part-of: compute-plane
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "armonik.namespace" $ }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: compute-plane
      {{- include "armonik.selectorLabels" $ | nindent 6 }}
  {{/* Partition and release labels on every series, so a shared cluster Prometheus keeps them apart
       (armonik_fr_partition, app_kubernetes_io_instance, armonik_fr_deployment). */}}
  podTargetLabels:
    - armonik.fr/partition
    - app.kubernetes.io/instance
    - armonik.fr/deployment
  podMetricsEndpoints:
    - port: poll-agent-port
      path: /metrics
      {{/* Fixed job name the bundled Grafana dashboards query; the podTargetLabels keep series apart. */}}
      relabelings:
        - targetLabel: job
          replacement: metrics-polling-agent
{{- end }}
