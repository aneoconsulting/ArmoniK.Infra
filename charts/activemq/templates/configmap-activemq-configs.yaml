{{- if .Values.extraVolumes -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "activemq.fullname" . }}-configs
  namespace: {{ include "activemq.namespace" . | quote }}
  labels:
    {{- include "activemq.labels" . | nindent 4 }}
data:
  {{/*
  Single-file override (mounted by subPath, never the whole conf/ directory): the
  image's conf/ layout is version-specific (6.x moved the web console to a modular
  jetty-spring.xml + conf/jetty/*.xml + JAAS login.config, none of which we ship),
  so masking the directory would hide files this ActiveMQ version still needs.
  This is the image's own conf/activemq.xml with only the AMQP transport connector
  turned on; the queue policy and heap/store limits below are ArmoniK's own tuning,
  not upstream defaults.
  */}}
  activemq.xml: |
    <beans
      xmlns="http://www.springframework.org/schema/beans"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd
      http://activemq.apache.org/schema/core http://activemq.apache.org/schema/core/activemq-core.xsd">

        <!-- Allows us to use system properties as variables in this configuration file -->
        <bean class="org.springframework.beans.factory.config.PropertyPlaceholderConfigurer">
            <property name="locations">
                <value>file:${activemq.conf}/credentials.properties</value>
            </property>
        </bean>

        <!--
            The <broker> element is used to configure the ActiveMQ broker.
        -->
        <broker xmlns="http://activemq.apache.org/schema/core" brokerName="localhost" dataDirectory="${activemq.data}">

            <destinationPolicy>
                <policyMap>
                  <policyEntries>
                    <policyEntry queue=">" prioritizedMessages="true" />
                    <policyEntry topic=">" >
                        <!-- The constantPendingMessageLimitStrategy is used to prevent
                            slow topic consumers to block producers and affect other consumers
                            by limiting the number of messages that are retained
                            For more information, see:

                            http://activemq.apache.org/slow-consumer-handling.html

                        -->
                      <pendingMessageLimitStrategy>
                        <constantPendingMessageLimitStrategy limit="100000000"/>
                      </pendingMessageLimitStrategy>
                    </policyEntry>
                  </policyEntries>
                </policyMap>
            </destinationPolicy>

            <!--
                The managementContext is used to configure how ActiveMQ is exposed in
                JMX. By default, ActiveMQ uses the MBean server that is started by
                the JVM. For more information, see:

                http://activemq.apache.org/jmx.html
            -->
            <managementContext>
                <managementContext createConnector="false"/>
            </managementContext>

            <!--
                Configure message persistence for the broker. The default persistence
                mechanism is the KahaDB store (identified by the kahaDB tag).
                For more information, see:

                http://activemq.apache.org/persistence.html
            -->
            <persistenceAdapter>
                <kahaDB directory="${activemq.data}/kahadb"/>
            </persistenceAdapter>

            <!--
                The systemUsage controls the maximum amount of space the broker will
                use before disabling caching and/or slowing down producers. For more information, see:
                http://activemq.apache.org/producer-flow-control.html
            -->
            <systemUsage>
                <systemUsage sendFailIfNoSpaceAfterTimeout="60000">
                    <memoryUsage>
                        <memoryUsage percentOfJvmHeap="90" />
                    </memoryUsage>
                    <storeUsage>
                        <storeUsage limit="100 gb"/>
                    </storeUsage>
                    <tempUsage>
                        <tempUsage limit="50 gb"/>
                    </tempUsage>
                </systemUsage>
            </systemUsage>

            <!--
                The transport connectors expose ActiveMQ over a given protocol to
                clients and other brokers. For more information, see:

                http://activemq.apache.org/configuring-transports.html
            -->
            <transportConnectors>
                <!-- DOS protection, limit concurrent connections to 1000 and frame size to 100MB -->
                <!--
                <transportConnector name="openwire" uri="tcp://0.0.0.0:61616?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                <transportConnector name="amqp" uri="amqp://0.0.0.0:5672?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                <transportConnector name="amqp+ssl" uri="amqp+ssl://0.0.0.0:5672?maximumConnections=1000000&amp;wireFormat.maxFrameSize=1048576000"/>
                <transportConnector name="stomp" uri="stomp://0.0.0.0:61613?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                <transportConnector name="mqtt" uri="mqtt://0.0.0.0:1883?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                <transportConnector name="ws" uri="ws://0.0.0.0:61614?maximumConnections=1000&amp;wireFormat.maxFrameSize=104857600"/>
                -->
                <transportConnector name="amqp" uri="amqp://0.0.0.0:{{ .Values.containerPort.amqp }}?maximumConnections=1000000&amp;wireFormat.maxFrameSize=1048576000"/>
            </transportConnectors>

            <!-- destroy the spring context on shutdown to stop jetty -->
            <shutdownHooks>
                <bean xmlns="http://www.springframework.org/schema/beans" class="org.apache.activemq.hooks.SpringContextHook" />
            </shutdownHooks>

        </broker>

        <!--
            Enable web consoles, REST and Ajax APIs and demos
            The web console requires login by default; authentication and IP access control are
            configured in ${ACTIVEMQ_HOME}/conf/jetty/jetty-security.xml.

            Take a look at ${ACTIVEMQ_HOME}/conf/jetty-spring.xml and conf/jetty/ for more details
        -->
        <import resource="jetty-spring.xml"/>

    </beans>
  {{/*
  Log4j2 (the image dropped Log4j 1.x in 6.x): same loggers, levels, patterns and
  rollover policy as ArmoniK's previous log4j.properties, translated to the Log4j2
  properties format.
  */}}
  log4j2.properties: |
    #
    # This file controls most of the logging in ActiveMQ.
    #

    #
    # When debugging or reporting problems to the ActiveMQ team,
    # change rootLogger level to DEBUG.
    #
    rootLogger.level=INFO
    rootLogger.appenderRef.console.ref=Console
    rootLogger.appenderRef.console.filter.threshold.type=ThresholdFilter
    rootLogger.appenderRef.console.filter.threshold.level=INFO
    rootLogger.appenderRef.logfile.ref=RollingFile

    # Loggers configuration

    # ActiveMQ Spring
    logger.spring.name=org.apache.activemq.spring
    logger.spring.level=WARN

    # ActiveMQ web
    logger.web.name=org.apache.activemq.web.handler
    logger.web.level=WARN

    # Spring
    logger.springframework.name=org.springframework
    logger.springframework.level=WARN

    # XBean
    logger.xbean.name=org.apache.xbean
    logger.xbean.level=WARN

    # Camel
    logger.camel.name=org.apache.camel
    logger.camel.level=INFO

    # Jetty
    logger.jetty.name=org.eclipse.jetty
    logger.jetty.level=WARN

    # Jetty startup via Spring
    logger.jetty-spring.name=org.apache.activemq.spring.jetty
    logger.jetty-spring.level=INFO

    # ActiveMQ
    # Or for more fine grained debug logging uncomment one of these
    #logger.activemq.name=org.apache.activemq
    #logger.activemq.level=DEBUG

    # Appender configuration

    # Console appender
    appender.console.type=Console
    appender.console.name=Console
    appender.console.layout.type=PatternLayout
    appender.console.layout.pattern={"@t":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}{UTC}","@l":"%p","@m":"%enc{%m}{JSON}","SourceContext":"%c","thread":"%enc{%t}{JSON}"%notEmpty{,"@x":"%enc{%throwable}{JSON}"}}%n
    appender.console.layout.alwaysWriteExceptions=false

    # File appender
    appender.logfile.type=RollingRandomAccessFile
    appender.logfile.name=RollingFile
    appender.logfile.fileName=${sys:activemq.data}/activemq.log
    appender.logfile.filePattern=${sys:activemq.data}/activemq.log.%i
    appender.logfile.append=true
    appender.logfile.layout.type=PatternLayout
    appender.logfile.layout.pattern=%d | %-5p | %m | %c | %t%n%throwable{full}
    appender.logfile.policies.type=Policies
    appender.logfile.policies.size.type=SizeBasedTriggeringPolicy
    appender.logfile.policies.size.size=1MB
    appender.logfile.strategy.type=DefaultRolloverStrategy
    appender.logfile.strategy.max=5

    # you can control the rendering of exception in the pattern
    # by default, we display the full stack trace
    # if you want to display short form of the exception, you can use
    #
    # appender.logfile.layout.pattern=%d | %-5p | %m | %c | %t%n%throwable{short}
    #
    # a classic issue with filebeat/logstash is about multiline exception. The following pattern
    # allows to work smoothly with filebeat/logstash
    #
    # appender.logfile.layout.pattern=%d | %-5p | %m | %c | %t%n%replace{%throwable}{\n}{ }
    #

    # use some of the following patterns to see MDC logging data
    #
    # %X{activemq.broker}
    # %X{activemq.connector}
    # %X{activemq.destination}
    #
    # e.g.
    #
    # appender.logfile.layout.pattern=%d | %-20.20X{activemq.connector} | %-5p | %m | %c | %t%n

    ###########
    # Audit log
    ###########
    logger.audit.name=org.apache.activemq.audit
    logger.audit.additivity=false
    logger.audit.level=INFO
    logger.audit.appenderRef.auditlog.ref=AuditLog

    appender.auditlog.type=RollingRandomAccessFile
    appender.auditlog.name=AuditLog
    appender.auditlog.fileName=${sys:activemq.data}/audit.log
    appender.auditlog.filePattern=${sys:activemq.data}/audit.log.%i
    appender.auditlog.append=true
    appender.auditlog.layout.type=PatternLayout
    appender.auditlog.layout.pattern=%-5p | %m | %t%n
    appender.auditlog.policies.type=Policies
    appender.auditlog.policies.size.type=SizeBasedTriggeringPolicy
    appender.auditlog.policies.size.size=1MB
    appender.auditlog.strategy.type=DefaultRolloverStrategy
    appender.auditlog.strategy.max=5
{{- end }}
