{{/* One Secret per conf layer (built by armonik.conf.<layer>). Rendered as an ExternalSecret when the
     layer references Secrets, otherwise a plain Secret:
       env           -> literal data (stringData, or template.data under ESO)
       envFromSecret -> renamed credential refs (spec.data[], surfaced via the template)
       envSecret     -> whole-Secret imports (spec.dataFrom[].extract), with template mergePolicy Merge
                        so the imported keys pass through alongside the literals (template wins on collision)
     A source reads this release's Kubernetes-provider store unless it names a pre-existing one
     (storeName, through armonik.conf.sourceRef).
     Plane pods load these by name through their own conf.envSecret. */}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "init" -}}
{{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml -}}
{{- $name := list $layer $ | include "armonik.conf.secretName" -}}
{{- $env := $conf.env | default dict -}}
{{- range $field := list "envConfigmap" "envFromConfigmap" -}}
  {{- if index $conf $field -}}
    {{- fail (printf "conf layer %q: %s is not supported" $layer $field) -}}
  {{- end -}}
{{- end -}}
{{- $refs := $conf.envFromSecret | default dict -}}
{{- $envSecret := $conf.envSecret | default list -}}
{{- if or $refs $envSecret }}
{{- if not $ops.externalSecrets.available -}}
  {{- fail (printf "conf layer %q: envSecret and envFromSecret require ExternalSecretsOperator" $layer) -}}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: {{ list "" $ | include "armonik.conf.storeName" | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      {{- if $envSecret }}
      mergePolicy: Merge
      {{- end }}
      {{- if or $env $refs }}
      data:
        {{- with $env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- range $k, $ref := $refs }}
        {{ $k }}: {{ printf "{{ .%s }}" $k | quote }}
        {{- end }}
      {{- end }}
  {{- with $refs }}
  data:
    {{- range $k, $ref := . }}
    {{- $label := printf "conf layer %q env %q" $layer $k }}
    {{- $storeRef := list $ref $label $ | include "armonik.conf.sourceRef" }}
    {{- if not (or $ref.field $ref.storeName) }}
      {{- printf "%s: field is required unless storeName is set" $label | fail }}
    {{- end }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $ref.secret | quote }}
        {{- with $ref.field }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ toString . | quote }}
        {{- end }}
      {{- with $storeRef }}
      sourceRef:
        storeRef:
          {{- . | nindent 10 }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $envSecret }}
  dataFrom:
    {{- range $s := . }}
    {{- $item := include "armonik.conf.secretItem" $s | fromYaml }}
    {{- $storeRef := list $item (printf "conf layer %q envSecret %q" $layer $item.secret) $ | include "armonik.conf.sourceRef" }}
    - extract:
        key: {{ $item.secret | quote }}
        {{- with $item.version }}
        version: {{ toString . | quote }}
        {{- end }}
      {{- with $storeRef }}
      sourceRef:
        storeRef:
          {{- . | nindent 10 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
type: Opaque
{{- with $env }}
stringData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end -}}
