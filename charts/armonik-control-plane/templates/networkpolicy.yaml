{{- $networkPolicyEnabled := list .Values "networkPolicy" "enabled"
    | include "armonik.utils.index"
-}}

{{- if and
      $networkPolicyEnabled
      (list .Values "networkPolicy" "submitter" "enabled"
        | include "armonik.utils.index")
}}

{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "submitter"
      "image" (include "armonik.control.imageConf" . | fromYaml)
      "config" (include "armonik.netpol.submitter" . | fromYaml)
  ) }}

{{- end }}


{{- if and
      $networkPolicyEnabled
      (list .Values "networkPolicy" "metricsExporter" "enabled"
        | include "armonik.utils.index")
      (list .Values "metricsExporter" "enabled"
        | include "armonik.utils.index")
}}

{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "metrics-exporter"
      "image" (include "armonik.control.metricsExporter.imageConf" . | fromYaml)
      "config" (include "armonik.netpol.metricsExporter" . | fromYaml)
  ) }}

{{- end }}


{{- if and
      $networkPolicyEnabled
      (list .Values "networkPolicy" "podDeletionCost" "enabled"
        | include "armonik.utils.index")
      (list .Values "podDeletionCost" "enabled"
        | include "armonik.utils.index")
}}

{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "pod-deletion-cost"
      "image" (include "armonik.control.podDeletionCost.imageConf" . | fromYaml)
      "config" (include "armonik.netpol.podDeletionCost" . | fromYaml)
  ) }}

{{- end }}
