{{/* One Secret per conf layer (built by armonik.conf.<layer>): an ExternalSecret when the layer
     has credential refs (envFromSecret), else a plain Secret. Consumed by name via conf.envSecret. */}}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "init" -}}
{{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml -}}
{{- $name := list $layer $ | include "armonik.conf.secretName" -}}
{{- $env := $conf.env | default dict -}}
{{- $refs := $conf.envFromSecret | default dict -}}
{{- if $refs -}}
{{- if ne (include "armonik.conf.esoEnabled" $) "true" -}}
{{- fail (printf "conf layer %q needs backend credentials but External Secrets is disabled; enable dependencies.external-secrets, or pre-create the credential Secret" $layer) -}}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "armonik.namespace" $ }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: {{ include "armonik.conf.storeName" $ }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{- range $k, $v := $env }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- range $k, $ref := $refs }}
        {{ $k }}: {{ printf "{{ .%s }}" $k | quote }}
        {{- end }}
  data:
    {{- range $k, $ref := $refs }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        key: {{ $ref.secret | quote }}
        property: {{ $ref.field | quote }}
    {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "armonik.namespace" $ }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
type: Opaque
{{- with $env }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end -}}
