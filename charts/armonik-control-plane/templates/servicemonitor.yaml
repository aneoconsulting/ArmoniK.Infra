{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $me := .Values.metricsExporter | default dict }}
{{- $svc := $me.service | default dict }}
{{- if and $me.enabled $ops.prometheusOperator.available }}
{{/* First-party ServiceMonitor for the control-plane metrics-exporter (ArmoniK app metrics, incl.
     armonik_<partition>_tasks_queued). Rendered only when the prometheus-operator CRDs are present;
     the shared cluster Prometheus selects it across namespaces. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-metrics-exporter" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: metrics-exporter
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "armonik.namespace" . }}
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics-exporter
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  {{/* Carry the release onto the series so a shared Prometheus keeps per-release metrics distinct
       (job stays the stable role name; app_kubernetes_io_instance identifies the release). */}}
  targetLabels:
    - app.kubernetes.io/instance
    - armonik.fr/deployment
  endpoints:
    - port: {{ $svc.name }}
      path: /metrics
      {{/* Force the legacy job name so the bundled Grafana dashboards match; releases are still
           distinguishable by the namespace/pod labels the operator adds. */}}
      relabelings:
        - targetLabel: job
          replacement: metrics-exporter
{{- end }}
