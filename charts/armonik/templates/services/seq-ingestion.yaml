{{- /* Named by armonik.seq.ingestionService. seq has no namespace key, so it runs in the release namespace. */ -}}
{{- with .Subcharts.dependencies.Subcharts.seq }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "armonik.seq.ingestionService" $.Release.Name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: seq-ingestion
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "seq.selectorLabels" . | nindent 4 }}
  ports:
    - name: ingestion
      port: {{ include "armonik.seq.ingestionPort" $ }}
      targetPort: ingestion
      protocol: TCP
{{- end }}
