{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $tls := .Values.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- $globalIssuer := list $.Values "global" "armonik" "certManager" "issuer" | include "armonik.utils.index" | fromYaml }}
{{- $localEnabled := (list $certManager "existingIssuer" "enabled" | include "armonik.utils.index") | empty | not }}
{{- $useGlobal := and $globalIssuer.enabled (not $localEnabled) }}
{{- $existingIssuer := or $localEnabled $useGlobal }}
{{- if and $tls.enabled $certManager.enabled }}
{{- if not (or $ops.certManager.available $existingIssuer) }}
{{- fail "ingress TLS via cert-manager requires it: set global.armonik.operators.certManager.available=true, set tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or disable tls.certManager and supply the TLS Secret directly." }}
{{- end }}
{{- if not $existingIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  name: {{ include "armonik.fullname" . }}-issuer
  namespace: {{ include "armonik.namespace" . | quote }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  commonName: {{ include "armonik.fullname" . }}-cert
  dnsNames:
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc.{{ include "armonik.clusterDomain" . }}
  secretName: {{ include "armonik.fullname" . }}
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  {{- with $certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with $certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  issuerRef:
    {{- if $localEnabled }}
    name: {{ list $certManager "existingIssuer" "name" | include "armonik.utils.index" }}
    kind: {{ list $certManager "existingIssuer" "kind" | include "armonik.utils.index" | default "Issuer" }}
    group: {{ list $certManager "existingIssuer" "group" | include "armonik.utils.index" | default "cert-manager.io" }}
    {{- else if $useGlobal }}
    name: {{ $globalIssuer.name }}
    kind: {{ $globalIssuer.kind }}
    group: {{ $globalIssuer.group }}
    {{- else }}
    name: {{ include "armonik.fullname" . }}-issuer
    kind: Issuer
    group: cert-manager.io
    {{- end }}
{{- end }}
