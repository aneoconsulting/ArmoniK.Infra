{{- if and .Values.mtls.enabled (not .Values.tls.enabled) -}}
{{- fail "Invalid configuration: mTLS requires TLS to be enabled. Please set tls.enabled=true when enabling mTLS." -}}
{{- end -}}

{{- if and .Values.gateway.enabled (not .Values.gateway.gatewayClassName) -}}
{{- fail "Invalid configuration: gateway.enabled=true requires gateway.gatewayClassName to be set. Please specify a valid GatewayClass (e.g. gateway.gatewayClassName=traefik). Run 'kubectl get gatewayclasses.gateway.networking.k8s.io -A' to list available GatewayClasses" -}}
{{- end -}}

{{- if and (empty .Values.urlsSecretName) (empty .Values.control_plane_url) (empty .Values.grafana_url) (empty .Values.seq_url) -}}
{{- fail "Invalid configuration: specify urlsSecretName or at least one of control_plane_url, grafana_url, or seq_url." -}}
{{- end -}}

{{- /* Every sso guard lives in the resolver. */ -}}
{{- $_ := include "armonik.ingress.sso" . -}}

{{- /* Settings of the CN and fingerprint identity, which ArmoniK Core no longer reads: set, they
       would be silently ignored. */ -}}
{{- if list .Values "mtls" "trustedCommonNames" | include "armonik.utils.index" -}}
  {{- fail "mtls.trustedCommonNames is removed: ArmoniK Core reads one client certificate, written by this ingress, so a proxy cannot forward the identity of another client. A proxy authenticating callers itself uses the Proxy or Token method instead" -}}
{{- end -}}
{{- range $key := list "commonName" "fingerprint" "impersonationUsername" "impersonationId" -}}
  {{- if list $.Values "identityHeaders" $key | include "armonik.utils.index" -}}
    {{- printf "identityHeaders.%s is removed with the CN and fingerprint identity: nginx writes identityHeaders.certificate, user and groups" $key | fail -}}
  {{- end -}}
{{- end -}}
{{- $_ := include "armonik.ingress.identityHeaders" .Values -}}
