suite: partition fan-out
templates:
  - deployment.yaml
  - scaledobject.yaml
values:
  - ../ci/partitions-values.yaml
release:
  name: t
tests:
  - it: renders one deployment per partition
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Deployment
  - it: renders one scaled object per partition, targeting its deployment
    template: scaledobject.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.scaleTargetRef.name
          value: "t-armonik-compute-plane-htcmock"
        documentIndex: 1
  - it: overrides the worker image per partition
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "worker")].image
          pattern: armonik_core_htcmock_test_worker
  - it: uses unix socket addresses by default (partitionCommon)
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: /cache/armonik_agent.sock
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: /cache/armonik_worker.sock
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: /cache/armonik_agent.sock
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: /cache/armonik_worker.sock
  - it: uses tcp channel addresses when socketType is tcp
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: http://localhost:6667
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: http://localhost:6666
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: http://localhost:6667
      - contains:
          path: spec.template.spec.containers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: http://localhost:6666
  - it: runs agent and worker under one uid so each can connect to the other's socket
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 5000
  - it: drops the pod securityContext when runAsUser is nulled
    template: deployment.yaml
    set:
      partitionCommon.podSecurityContext.runAsUser: null
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
  - it: hardens agent and worker containers by default
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext
          value: &hardened
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[?(@.name == "worker")].securityContext
          value: *hardened
  - it: drops the agent and worker securityContexts when nulled
    template: deployment.yaml
    set:
      partitionCommon.agent.securityContext: null
      partitionCommon.worker.securityContext: null
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext
      - notExists:
          path: spec.template.spec.containers[?(@.name == "worker")].securityContext
  - it: replaces the default KEDA trigger with the partition override
    template: scaledobject.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 1
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "5"
      - equal:
          path: spec.triggers[0].metadata.metricName
          value: armonik_htcmock_tasks_queued

  - it: renders the agent readinessProbe, which ships empty and so never rendered before
    template: deployment.yaml
    set:
      partitionCommon.agent.readinessProbe:
        httpGet:
          path: /ready
          port: 1080
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].readinessProbe.httpGet.path
          value: /ready
