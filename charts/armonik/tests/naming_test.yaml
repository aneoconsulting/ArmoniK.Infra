suite: dependency names and namespaces come from the dependency charts
release:
  name: t
  namespace: rel
templates:
  - secrets/armonik-urls.yaml
  - secrets/redis-users.yaml
  - secrets/conf-secrets.yaml
  - secrets/mongodb-exporter-secret.yaml
  - secrets/secret-store.yaml
  - services/seq-ingestion.yaml
  - servicemonitors/mongodb-exporter.yaml
  - configmaps/grafana-datasource-armonik.yaml
  - charts/dependencies/charts/fluent-bit/templates/configmap.yaml
  - charts/compute-plane/templates/scaledobject.yaml
  - NOTES.txt
tests:
  # Every name below is set by the dependency's own naming helpers; overriding it proves the umbrella
  # reads it back rather than guessing it.
  - it: URLs Secret targets the grafana and seq Services under their own charts' names
    template: secrets/armonik-urls.yaml
    set:
      dependencies:
        grafana:
          fullnameOverride: g
        seq:
          fullnameOverride: s
    asserts:
      - equal:
          path: data.grafana
          value: aHR0cDovL2cucmVsLnN2Yy5jbHVzdGVyLmxvY2Fs # http://g.rel.svc.cluster.local
      - equal:
          path: data.seq
          value: aHR0cDovL3MucmVsLnN2Yy5jbHVzdGVyLmxvY2Fs # http://s.rel.svc.cluster.local

  - it: redis users Secret is the one valkey reads, and the one the core layer reads back
    set:
      dependencies:
        redis:
          auth:
            usersExistingSecret: '{{ .Release.Name }}-custom-users'
    asserts:
      - equal:
          path: metadata.name
          value: t-custom-users
        template: secrets/redis-users.yaml
      - contains:
          path: spec.data
          content:
            secretKey: Redis__Password
            remoteRef:
              key: t-custom-users
              property: default
        template: secrets/conf-secrets.yaml
        documentSelector:
          path: metadata.name
          value: t-conf-core

  # fluent-bit's tpl cannot see seq's values, so it targets a Service the umbrella names itself.
  - it: fluent-bit ships to the umbrella's seq ingestion Service, whatever seq's own name
    set:
      dependencies:
        seq:
          nameOverride: logs
          fullnameOverride: mylogs
    asserts:
      - matchRegex:
          path: data["fluent-bit.conf"]
          pattern: 'Host +t-seq-ingestion\n +Port +5341\n'
        template: charts/dependencies/charts/fluent-bit/templates/configmap.yaml
      - equal:
          path: metadata.name
          value: t-seq-ingestion
        template: services/seq-ingestion.yaml
      - equal:
          path: spec.selector
          value:
            app: logs
            release: t
        template: services/seq-ingestion.yaml
      - equal:
          path: spec.ports[0]
          value:
            name: ingestion
            port: 5341
            targetPort: ingestion
            protocol: TCP
        template: services/seq-ingestion.yaml

  - it: renders no seq ingestion Service without seq
    template: services/seq-ingestion.yaml
    set:
      dependencies:
        seq:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: Grafana datasource targets the Prometheus Service of the kube-prometheus-stack this release installs
    template: configmaps/grafana-datasource-armonik.yaml
    set:
      operators:
        kube-prometheus:
          fullnameOverride: kps
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: 'url: "http://kps-prometheus\.rel\.svc:9090"'

  - it: a stated prometheusUrl replaces the derivation
    template: configmaps/grafana-datasource-armonik.yaml
    set:
      global:
        armonik:
          monitoring:
            prometheusUrl: http://prom.mon.svc:9090
    asserts:
      - matchRegex:
          path: data["datasources.yaml"]
          pattern: 'url: "http://prom\.mon\.svc:9090"'

  - it: fails rather than guess the Prometheus of a kube-prometheus-stack installed by another release
    template: configmaps/grafana-datasource-armonik.yaml
    set:
      global:
        armonik:
          operators:
            prometheusOperator:
              deploy: false
              namespace: mon
    asserts:
      - failedTemplate:
          errorPattern: "global.armonik.monitoring.prometheusUrl resolved empty"

  # namespaceOverride moves ArmoniK's own resources; a dependency without a namespace key of its own
  # stays in the release namespace, and what pairs with it follows it there.
  - it: KEDA scrapes the metrics-exporter in the namespace the planes moved to
    template: charts/compute-plane/templates/scaledobject.yaml
    set:
      namespaceOverride: app
      control-plane:
        namespaceOverride: app
      compute-plane:
        namespaceOverride: app
    documentIndex: 0
    asserts:
      - equal:
          path: spec.triggers[0].metadata.url
          value: http://t-control-plane-metrics-exporter.app.svc:9419/metrics

  - it: mongodb-exporter's ExternalSecret and ServiceMonitor stay with the exporter, next to a store set of their own
    set:
      namespaceOverride: app
      control-plane:
        namespaceOverride: app
      compute-plane:
        namespaceOverride: app
    asserts:
      - equal:
          path: metadata.namespace
          value: rel
        template: secrets/mongodb-exporter-secret.yaml
      - equal:
          path: spec.secretStoreRef.name
          value: t-conf-store
        template: secrets/mongodb-exporter-secret.yaml
      # MongoDB sits next to the exporter: its base store reads it, no routing.
      - notExists:
          path: spec.data[0].sourceRef
        template: secrets/mongodb-exporter-secret.yaml
      - containsDocument:
          kind: SecretStore
          apiVersion: external-secrets.io/v1
          name: t-conf-store
          namespace: rel
          any: true
        template: secrets/secret-store.yaml
      - containsDocument:
          kind: SecretStore
          apiVersion: external-secrets.io/v1
          name: t-conf-store
          namespace: app
          any: true
        template: secrets/secret-store.yaml
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - rel
        template: servicemonitors/mongodb-exporter.yaml

  # redis disabled so that MongoDB's namespace is the only one both ServiceAccounts read.
  - it: routes mongodb-exporter through a store reading MongoDB's namespace, bound once for every reader
    set:
      namespaceOverride: app
      control-plane:
        namespaceOverride: app
      compute-plane:
        namespaceOverride: app
      dependencies:
        mongodb:
          namespaceOverride: db
        redis:
          enabled: false
    asserts:
      - equal:
          path: spec.data[0].sourceRef.storeRef.name
          value: t-conf-store-db
        template: secrets/mongodb-exporter-secret.yaml
      - containsDocument:
          kind: SecretStore
          apiVersion: external-secrets.io/v1
          name: t-conf-store-db
          namespace: rel
          any: true
        template: secrets/secret-store.yaml
      - equal:
          path: metadata.namespace
          value: db
        template: secrets/secret-store.yaml
        documentSelector:
          path: subjects
          value:
            - kind: ServiceAccount
              name: t-conf
              namespace: app
            - kind: ServiceAccount
              name: t-conf
              namespace: rel

  - it: warns that a second release in the namespace must rename mongodb-exporter's Secret
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: 'Secret mongodb-exporter-secret, a fixed name'
      - matchRegexRaw:
          pattern: 'dependencies\.mongodb-exporter\.volumes\[0\]\.secret\.secretName'

  - it: says nothing of mongodb-exporter's Secret without mongodb-exporter
    template: NOTES.txt
    set:
      dependencies:
        mongodb-exporter:
          enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: 'mongodb-exporter'
