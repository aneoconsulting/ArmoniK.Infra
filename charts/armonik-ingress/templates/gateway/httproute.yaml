{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name | default (printf "%s-route" (include "armonik.fullname" .)) }}
  namespace: {{ .Values.httpRoute.namespace | default (include "armonik.namespace" .) }}
  labels:
    app.kubernetes.io/component: ingress
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with .Values.annotations}}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  parentRefs:
  {{- if .Values.httpRoute.parentRefs }}
  {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name | default (include "armonik.fullname" $) }}
  {{- end }}
  {{- else if .Values.gateway.enabled }}
    - name: {{ include "armonik.fullname" . }}
  {{- else }}
  {{- fail "httpRoute.enabled=true requires either gateway.enabled=true or httpRoute.parentRefs to be defined." }}
  {{- end }}

  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}

  rules:
  {{- if .Values.httpRoute.rules }}
  {{- range .Values.httpRoute.rules }}
  - matches:
    {{- range .matches }}
    - path:
        type: {{ .path.type }}
        value: {{ .path.value }}
    {{- end }}

    backendRefs:
    {{- range .backendRefs }}
    - name: {{ .name }}
      port: {{ .port }}
    {{- end }}
  {{- end }}

  {{- else }}
  # Default HTTPRoute
  - matches:
    - path:
        type: PathPrefix
        value: /

    backendRefs:
    - name: {{ include "armonik.fullname" . }}
      port: 5000
  {{- end }}
{{- end }}
