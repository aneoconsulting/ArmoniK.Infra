# SSO writing preferred_username as the user, with the groups of the session. The client and cookie
# secrets come from an existing ESO store, and NetworkPolicies are on.
global:
  environment:
    name: ci
    description: ArmoniK CI environment
urlsSecretName: example-urls
networkPolicy:
  enabled: true
sso:
  enabled: true
  publicUrl: https://armonik.example.com:8443
  identityClaim: preferred_username
  oauth2Proxy:
    issuerUrl: https://idp.example.com/realms/armonik
    clientId: armonik
    existingSecret: armonik-oauth2-proxy
    externalSecret:
      storeName: vault
      storeKind: ClusterSecretStore
      clientSecret:
        key: armonik/oauth2-proxy
        property: client-secret
      cookieSecret:
        key: armonik/oauth2-proxy
        property: cookie-secret
  networkPolicy:
    idpEgressCidrs:
      - 203.0.113.0/24
