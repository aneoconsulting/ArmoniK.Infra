{{- if .Values.networkPolicy.enabled }}
{{- $ingress := .Values.networkPolicy.extraIngressRules | default list -}}
{{- $policyTypes := $ingress | empty | ternary (list "Egress") (list "Ingress" "Egress") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "armonik.fullname" . }}-network-policy
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "armonik.name" . | quote }}
      app.kubernetes.io/instance: {{ .Release.Name |  quote }}
  policyTypes:
    {{- toYaml $policyTypes | nindent 4 }}
  {{- with $ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: 
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.extraEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
