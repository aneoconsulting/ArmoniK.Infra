suite: External storage tests
release:
  name: t
templates:
  - secrets/conf-secrets.yaml
tests:
  - it: injects no external storage env by default
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - notExists:
          path: spec.target.template.data.Gcs__BucketName
      - notExists:
          path: spec.target.template.data.PubSub__ProjectId
      - notExists:
          path: spec.target.template.data.S3__BucketName
      - notExists:
          path: spec.target.template.data.SQS__ServiceURL
      - notExists:
          path: spec.target.template.data.PostgreSQL__Host
  - it: renders the GCS object storage adapter env when enabled
    values:
      - ../ci/minimal-values.yaml
    set:
      dependencies:
        gcs:
          enabled: true
          projectId: my-project
          bucketName: my-bucket
          credentialsFilePath: /var/secrets/gcs.json
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.Components__ObjectStorageAdaptorSettings__ClassName
          value: "ArmoniK.Core.Adapters.Gcs.ObjectBuilder"
      - equal:
          path: stringData.Gcs__ProjectId
          value: my-project
      - equal:
          path: stringData.Gcs__BucketName
          value: my-bucket
      - equal:
          path: stringData.Gcs__CredentialsFilePath
          value: /var/secrets/gcs.json
  - it: renders the Pub/Sub queue adapter env when enabled
    values:
      - ../ci/minimal-values.yaml
    set:
      dependencies:
        pubsub:
          enabled: true
          projectId: my-project
          prefix: "armonik-"
          kmsKeyName: my-key
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.Components__QueueAdaptorSettings__ClassName
          value: "ArmoniK.Core.Adapters.PubSub.QueueBuilder"
      - equal:
          path: stringData.PubSub__ProjectId
          value: my-project
      - equal:
          path: stringData.PubSub__Prefix
          value: "armonik-"
  - it: renders both GCS and Pub/Sub env when both are enabled
    values:
      - ../ci/minimal-values.yaml
    set:
      dependencies:
        gcs:
          enabled: true
          projectId: my-project
          bucketName: my-bucket
        pubsub:
          enabled: true
          projectId: my-project
          prefix: "armonik-"
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.Components__ObjectStorageAdaptorSettings__ClassName
          value: "ArmoniK.Core.Adapters.Gcs.ObjectBuilder"
      - equal:
          path: stringData.Components__QueueAdaptorSettings__ClassName
          value: "ArmoniK.Core.Adapters.PubSub.QueueBuilder"
      - equal:
          path: stringData.Gcs__BucketName
          value: my-bucket
      - equal:
          path: stringData.PubSub__Prefix
          value: "armonik-"
  - it: renders the S3 object storage adapter env, endpoint derived from the region
    values:
      - ../ci/minimal-values.yaml
    set:
      dependencies:
        s3:
          enabled: true
          region: eu-west-3
          bucketName: my-bucket
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - equal:
          path: stringData.Components__ObjectStorageAdaptorSettings__ClassName
          value: ArmoniK.Core.Adapters.S3.ObjectBuilder
      - equal:
          path: stringData.S3__EndpointUrl
          value: https://s3.eu-west-3.amazonaws.com
      - equal:
          path: stringData.S3__BucketName
          value: my-bucket
  - it: renders the SQS queue adapter env, endpoint derived from the region
    values:
      - ../ci/minimal-values.yaml
    set:
      dependencies:
        sqs:
          enabled: true
          region: eu-west-3
          prefix: "armonik-"
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - equal:
          path: stringData.Components__QueueAdaptorSettings__ClassName
          value: ArmoniK.Core.Adapters.SQS.QueueBuilder
      - equal:
          path: stringData.SQS__ServiceURL
          value: https://sqs.eu-west-3.amazonaws.com
      - equal:
          path: stringData.SQS__Prefix
          value: "armonik-"
  - it: renders the PostgreSQL env with credentials from an existing store
    values:
      - ../ci/minimal-values.yaml
    set:
      global:
        armonik:
          operators:
            externalSecrets:
              available: true
      dependencies:
        postgresql:
          enabled: true
          connection:
            host: pg.example
            database: armonik
            credentials:
              secret: rds-master
              storeName: aws-secrets-manager
              storeKind: ClusterSecretStore
    documentSelector:
      path: metadata.name
      value: t-conf-core
    asserts:
      - equal:
          path: spec.target.template.data.Components__TableStorage
          value: ArmoniK.Adapters.PostgreSQL.TableStorage
      - equal:
          path: spec.target.template.data.PostgreSQL__Host
          value: pg.example
      - contains:
          path: spec.data
          content:
            secretKey: PostgreSQL__Password
            remoteRef:
              key: rds-master
              property: password
            sourceRef:
              storeRef:
                kind: ClusterSecretStore
                name: aws-secrets-manager
