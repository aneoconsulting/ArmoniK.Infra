{{/* Per conf layer: an ExternalSecret aggregating the layer's mountSecret sources, else an empty
     Secret (always rendered so pods can mount it non-optionally). A source is { secret, prefix, items? }:
     with items, ESO data[] imports only those keys as "<prefix><dest>"; without, dataFrom.extract
     imports the whole Secret (+prefix rewrite). Keys are flat (no "/"). A source may also carry the
     consuming-mount fields (path/subpath/...) to mirror the plane config; they don't affect the
     aggregation, but path is checked here: it must equal the umbrella mountPath (or, with a subpath,
     be a path under it). See the mountSecret schema in armonik-common. */}}
{{- $mountPath := include "armonik.conf.mountPath" $ -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "init" -}}
{{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml -}}
{{- $name := list $layer $ | include "armonik.conf.mountSecretName" -}}
{{- if $conf.mountConfigmap -}}
  {{- fail (printf "conf layer %q: mountConfigmap is not supported" $layer) -}}
{{- end -}}
{{- if $conf.mountSecret }}
{{- if not $ops.externalSecrets.available -}}
  {{- fail (printf "conf layer %q: mountSecret requires ExternalSecretsOperator" $layer) -}}
{{- end -}}
{{- $data := list -}}
{{- $dataFrom := list -}}
{{- range $mount := $conf.mountSecret -}}
  {{- if $mount.path -}}
    {{- $p := tpl (toString $mount.path) $ -}}
    {{- if not (or (eq $p $mountPath) (and $mount.subpath (hasPrefix (printf "%s/" $mountPath) $p))) -}}
      {{- fail (printf "conf layer %q mount of %q: path %q must equal the umbrella mountPath %q (or, with a subpath, be a path under it)" $layer $mount.secret $p $mountPath) -}}
    {{- end -}}
  {{- end -}}
  {{- $prefix := $mount.prefix | default "" -}}
  {{- if $mount.items -}}
    {{- range $itemName, $item := $mount.items -}}
      {{- $data = append $data (dict "secretKey" (printf "%s%s" $prefix $itemName) "secret" $mount.secret "property" $item.field) -}}
    {{- end -}}
  {{- else -}}
    {{- $dataFrom = append $dataFrom (dict "secret" $mount.secret "prefix" $prefix) -}}
  {{- end -}}
{{- end -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* CRD-ordering hook only when THIS release installs ESO; external/absent -> no hook. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: {{ include "armonik.conf.storeName" $ | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
  {{- with $data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .secret | quote }}
        property: {{ .property | quote }}
    {{- end }}
  {{- end }}
  {{- with $dataFrom }}
  dataFrom:
    {{- range . }}
    - extract:
        key: {{ .secret | quote }}
      {{- if .prefix }}
      rewrite:
        - regexp:
            source: "^"
            target: {{ .prefix | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
type: Opaque
{{- end }}
{{- end -}}
