############################################
################## GLOBAL ##################
############################################
global:
  version:
    armonikCore: "0.37.1" ### TODO FIX VERSIONS GLOBAL IF NULL USE DEFAULT IN SUB CHARTS COMPUTE-PLANE
    #armonikPollingagent: "0.35.0"
    #armonikGui: "0.14.5"
    #nginx: "1.27.4-alpine-slim"
  image:
    pullPolicy: IfNotPresent # FOR KEDA IMAGES
    registry: "" # FOR KEDA IMAGES
  imageRegistry: "" #"public.ecr.aws" # FOR BITNAMI IMAGES AND ARMONIK IMAGES
  security:
    allowInsecureImages: true
  #imagePullSecrets: [{"name": "secret"}] # FOR BITNAMI IMAGES AND ARMONIK IMAGES
  environment:
    description: "ArmoniK environment"
  # Cluster DNS domain. Empty stops hostnames at ".svc"; callers needing an FQDN use cluster.local.
  clusterDomain: ""
  # Root dir for conf mount Secrets in pods; propagated to subcharts. env strings and volumeMounts derive from it.
  armonik:
    mountPath: /mounts
    # Operator control (semantics in armonik-common/values.yaml). All-in-one default: this release
    # installs every operator, through the armonik-operators subchart.
    operators:
      externalSecrets:
        deploy: true
      keda:
        deploy: true
      certManager:
        deploy: true
      mongodbOperator:
        deploy: true
      prometheusOperator:
        deploy: true
    # monitoring.{prometheusUrl,metricsExporterUrl} come from armonik-common (see its README); both derive
    # from the operators namespaces above, which a layered install has to state.


############################################
### ARMONIK APPLICATION CONFIGURATION #####
############################################
control-plane:
  enabled: true
  defaultPartition: default
  extraPartitions:
    # default:
    #   podMax: 100
    #   podReserved: 50
    #   preemptionPercentage: 20
    #   priority: 1
  # Point the child at the conf Secrets this umbrella renders (overrides its "armonik" default).
  conf:
    source: '{{ .Release.Name }}'
  init:
    enabled: true
  rbac:
    createBuiltInRoles: true

compute-plane:
  # Default partitions below make a plain `helm install` usable. enabled=false gives a base release
  # (control-plane + storage + operators + conf) whose partitions come from separate
  # armonik-compute-plane releases instead; see NOTES.txt. enabled=true requires at least one partition.
  enabled: true
  serviceAccount:
    create: true
  # Point the child at the conf Secrets this umbrella renders (overrides its "armonik" default).
  conf:
    source: '{{ .Release.Name }}'
  # Partitions accumulate across values files; drop one of these with
  # `--set compute-plane.partitions.htcmock=null`.
  partitions:
    default:
      worker:
        image:
          name: "armonik-dynamic-dotnet-worker"
          tag: "0.21.2"
    stream:
      worker:
        image:
          name: "armonik_core_stream_test_worker"
    htcmock:
      socketType: "tcp"
      worker:
        image:
          name: "armonik_core_htcmock_test_worker"

conf:
  # Names every <source>-conf-<layer> Secret the umbrella renders (this release).
  source: '{{ .Release.Name }}'
  log:
    minimumLevel: Information

################## INGRESS ##################
ingress:
  enabled: true

# To bring your own MongoDB, set dependencies.mongodb.enabled=false and supply the connection via the
# conf values (conf.core.env / conf.core.envFromSecret). The in-cluster psmdb-db (below) is the default.

############################################
############ CERT-MANAGER WAIT #############
############################################
# Job gating Certificate/Issuer CRs on the cert-manager webhook being Available with its CA injected.
# Rendered only when this release installs cert-manager; covers every emitter (ingress, activemq).
certManagerWait:
  image:
    repository: alpine/k8s
    tag: 1.31.0
    pullPolicy: IfNotPresent
  timeout: 300s

############################################
############### DEPENDENCIES ###############
############################################

