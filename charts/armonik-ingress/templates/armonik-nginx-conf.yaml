{{- $ops := include "armonik.operators" . | fromYaml -}}
{{- $urlsSecretKey := tpl (.Values.urlsSecretName | default "") $ -}}
{{- $useEso := and $ops.externalSecrets.available (ne $urlsSecretKey "") -}}
{{- $name := include "armonik.ingress.confName" . -}}
{{- $storeName := tpl (.Values.urlsSecretStoreName | default "") $ -}}
{{- if and $storeName .Values.urlsSecretNamespace -}}
  {{- fail "urlsSecretStoreName excludes urlsSecretNamespace, which routes the Kubernetes provider only" -}}
{{- end -}}
{{- /* No namespace key: the fallback is this chart's own store, not a conf-store clone. */ -}}
{{- $store := dict "storeName" $storeName "storeKind" (.Values.urlsSecretStoreKind | default "") "version" (.Values.urlsSecretVersion | default "") -}}
{{- if $useEso }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.externalSecrets.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    {{- with (list $store "ingress urls Secret" $ | include "armonik.conf.sourceRef") }}
    {{- . | nindent 4 }}
    {{- else }}
    kind: "SecretStore"
    name: {{ $name | quote }}
    {{- end }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        armonik.conf: |
          {{- dict "root" . "useEso" true | include "armonik.conf.render" | nindent 10 }}
  dataFrom:
    - extract:
        key: {{ $urlsSecretKey | quote }}
        {{- with .Values.urlsSecretVersion }}
        version: {{ toString . | quote }}
        {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
type: Opaque
stringData:
  armonik.conf: |
    {{- dict "root" . "useEso" false | include "armonik.conf.render" | nindent 4 }}
{{- end }}
