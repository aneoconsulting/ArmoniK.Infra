{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- if $ops.externalSecrets.available }}
{{- $sa := printf "%s-conf" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- $secretNamespace := .Values.urlsSecretNamespace | default (include "armonik.namespace" .) -}}
{{/* Dedicated read-only ServiceAccount for the Kubernetes-provider SecretStore. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $secretNamespace | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $secretNamespace | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa | quote }}
    namespace: {{ include "armonik.namespace" . | quote }}
roleRef:
  kind: Role
  name: {{ $sa | quote }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ list "" $ | include "armonik.conf.storeName" }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $secretNamespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $sa | quote }}
{{- end }}
