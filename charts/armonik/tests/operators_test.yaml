suite: operator control surface
release:
  name: t
templates:
  - operators-guard.yaml
  - secrets/conf-secrets.yaml
  - charts/operators/charts/cert-manager/templates/startupapicheck-job.yaml
tests:
  - it: rejects an operator deployed but not available
    template: operators-guard.yaml
    set:
      global:
        armonik:
          operators:
            keda:
              deploy: true
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "deploy=true but available=false"
  - it: fails secret-backed conf when the ESO operator is unavailable
    template: secrets/conf-secrets.yaml
    set:
      global:
        armonik:
          operators:
            externalSecrets:
              deploy: false
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "envSecret and envFromSecret require ExternalSecretsOperator"
  - it: pulls the built-in cert-manager startupapicheck ahead of the shared Issuer and onto upgrades too
    template: charts/operators/charts/cert-manager/templates/startupapicheck-job.yaml
    set:
      global:
        armonik:
          operators:
            certManager:
              deploy: true
              available: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,post-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - matchRegex:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          pattern: before-hook-creation
