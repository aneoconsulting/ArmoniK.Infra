suite: partition fan-out
templates:
  - deployment.yaml
  - scaledobject.yaml
values:
  - ../ci/partitions-values.yaml
release:
  name: t
tests:
  - it: renders one deployment per partition
    template: deployment.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Deployment
  - it: renders one scaled object per partition, targeting its deployment
    template: scaledobject.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.scaleTargetRef.name
          value: "t-armonik-compute-plane-htcmock"
        documentIndex: 1
  - it: overrides the worker image per partition
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "worker")].image
          pattern: armonik_core_htcmock_test_worker
  - it: uses unix socket addresses by default (partitionCommon)
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: /cache/armonik_agent.sock
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: /cache/armonik_worker.sock
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: unixdomainsocket
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: /cache/armonik_agent.sock
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: /cache/armonik_worker.sock
  - it: uses tcp channel addresses when socketType is tcp
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: http://localhost:6667
      - contains:
          path: spec.template.spec.containers[?(@.name == "agent")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: http://localhost:6666
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__SocketType
            value: tcp
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__AgentChannel__Address
            value: http://localhost:6667
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "worker")].env
          content:
            name: ComputePlane__WorkerChannel__Address
            value: http://localhost:6666
  - it: runs agent and worker under one uid and gid so each can connect to the other's socket
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsUser
          value: 5000
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsUser
          value: 5000
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsGroup
          value: 5000
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsGroup
          value: 5000
  - it: sets the uid on the agent and worker only, not on the pod or the other containers
    template: deployment.yaml
    set:
      fluentBit.isDaemonSet: false
      partitionCommon.extraContainers:
        - name: extra
          image: busybox
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - exists:
          path: spec.template.spec.initContainers[?(@.name == "fluent-bit")].image
      - notExists:
          path: spec.template.spec.initContainers[?(@.name == "fluent-bit")].securityContext
      - exists:
          path: spec.template.spec.containers[?(@.name == "extra")].image
      - notExists:
          path: spec.template.spec.containers[?(@.name == "extra")].securityContext
  - it: takes the ids from global.armonik.runAsUser and runAsGroup, in every partition
    template: deployment.yaml
    set:
      global.armonik.runAsUser: 1234
      global.armonik.runAsGroup: 4321
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsUser
          value: 1234
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsUser
          value: 1234
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsGroup
          value: 4321
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsGroup
          value: 4321
  - it: keeps a uid set on a container over the global one
    template: deployment.yaml
    set:
      global.armonik.runAsUser: 1234
      partitions.bench.worker.securityContext.runAsUser: 42
      partitions.bench.worker.securityContext.runAsGroup: 43
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsUser
          value: 42
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsGroup
          value: 43
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsUser
          value: 1234
  - it: leaves the image user and group when the globals are nulled
    template: deployment.yaml
    set:
      global.armonik.runAsUser: null
      global.armonik.runAsGroup: null
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsGroup
      - notExists:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext.runAsGroup
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext.runAsNonRoot
          value: true
  - it: lets podSecurityContext still reach the pod
    template: deployment.yaml
    set:
      partitionCommon.podSecurityContext:
        fsGroup: 2000
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 2000
  - it: hardens agent and worker containers by default
    template: deployment.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext
          value: &hardened
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            runAsUser: 5000
            runAsGroup: 5000
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext
          value: *hardened
  - it: keeps only the ids when the agent and worker securityContexts are nulled
    template: deployment.yaml
    set:
      partitionCommon.agent.securityContext: null
      partitionCommon.worker.securityContext: null
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext
          value:
            runAsUser: 5000
            runAsGroup: 5000
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext
          value:
            runAsUser: 5000
            runAsGroup: 5000
  - it: drops the agent and worker securityContexts when the global ids are nulled too
    template: deployment.yaml
    set:
      global.armonik.runAsUser: null
      global.armonik.runAsGroup: null
      partitionCommon.agent.securityContext: null
      partitionCommon.worker.securityContext: null
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "agent")].securityContext
      - notExists:
          path: spec.template.spec.initContainers[?(@.name == "worker")].securityContext
  - it: replaces the default KEDA trigger with the partition override
    template: scaledobject.yaml
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-htcmock"
    asserts:
      - lengthEqual:
          path: spec.triggers
          count: 1
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "5"
      - equal:
          path: spec.triggers[0].metadata.metricName
          value: armonik_htcmock_tasks_queued

  - it: renders the agent readinessProbe, which ships empty and so never rendered before
    template: deployment.yaml
    set:
      partitionCommon.agent.readinessProbe:
        httpGet:
          path: /ready
          port: 1080
    documentSelector:
      path: metadata.name
      value: "t-armonik-compute-plane-bench"
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "agent")].readinessProbe.httpGet.path
          value: /ready
