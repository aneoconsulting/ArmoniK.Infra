# -- Chart name used in resource names and labels.
nameOverride: ""
# -- Name prefix of every resource.
fullnameOverride: ""
# -- Namespace of every resource, the release namespace when empty. Under the umbrella it must equal the
# umbrella's own namespaceOverride.
namespaceOverride: ""
replicaCount: 1
shareProcessNamespace: false
restartPolicy: Always
imagePullSecrets: []

# global.armonik.* defaults come from armonik-common/values.yaml (import-values) and suit a standalone
# plane: external operators, KEDA trigger URL derived from conf.source.
global:
  armonik:
    # Release name of the umbrella that owns the conf Secrets.
    source: armonik

serviceAccount:
  create: false
  # -- ServiceAccount name (tpl-rendered), armonik.fullname when empty. With create=false it must exist:
  # by default, the one the conf.source umbrella creates for its own compute plane.
  name: '{{ if not .Values.serviceAccount.create }}{{ include "armonik.conf.source" . }}-compute-plane{{ end }}'
  annotations: {}
  secrets: []

service: {}

rbac:
  # Not read: this chart renders no RBAC resources.
  create: true

networkPolicy:
  enabled: false
  # Pod selector matching Prometheus, for the built-in ingress rule. Defaults to
  # app.kubernetes.io/name: prometheus (kube-prometheus-stack's own label).
  prometheusPodSelector:
  # Extra ingress rules on top of the built-in Prometheus rule.
  extraIngressRules: []
  # Egress is DNS-only by default. Examples for the storage backends:
  # extraEgressRules:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # MongoDB's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: percona-server-mongodb
  #     ports:
  #       - protocol: TCP
  #         port: 27017
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # ActiveMQ's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: activemq
  #     ports:
  #       - protocol: TCP
  #         port: 5672
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # Redis's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: redis
  #     ports:
  #       - protocol: TCP
  #         port: 6379
  extraEgressRules: []

# KEDA is gated by global.armonik.operators.keda: one ScaledObject per partition when available.

# Base conf, merged into the init Job only (agent/worker build theirs from partitionCommon).
conf:
  # Overrides the umbrella's global.armonik.mountPath for this release (default "/mounts").
  # mountPath: /mounts

init:
  enabled: true
  image:
    registry:
    repository: dockerhubaneo/armonik_control
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  affinity:
  priorityClassName:
  # -- Init Job pod securityContext. runAsUser is required by runAsNonRoot below, the ArmoniK
  # images declaring a non-numeric USER the kubelet cannot verify.
  podSecurityContext:
    runAsUser: 5000
  # -- Init container securityContext, same hardening as the agent's.
  securityContext:
    capabilities:
      drop:
        - ALL
    privileged: false
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  # -- Extra env for the init container. Shared vars go in conf.env.
  extraEnv: []
  # -- Extra envFrom for the init container.
  extraEnvFrom: []
  # -- Extra volumeMounts for the init container.
  extraVolumeMounts: []
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra init containers. There is no extraContainers on a Job: a sidecar that never
  # exits keeps it from finishing.
  extraInitContainers: []
  # containerPatch:
  #   securityContext:
  #     readOnlyRootFilesystem: true
  #
  # -- Merged over the init container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # podSpecPatch:
  #   hostAliases:
  #     - ip: "10.0.0.1"
  #       hostnames: ["legacy.internal"]
  #
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # Init Job: core, log and init layers, env and mounts.
  conf:
    envSecret:
      - '{{ list "core" . | include "armonik.conf.secretName" }}'
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "init" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "init" . | include "armonik.conf.mountSecretName" }}'
  configmaps:

partitionCommon:
  socketType: "unixdomainsocket"
  podSecurityContext:
    runAsUser: 5000
  labels:
    app: "armonik"
    service: "compute-plane"
  agent:
    name: polling-agent
    image:
      registry:
      repository: dockerhubaneo/armonik_pollingagent
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: poll-agent-port
      containerPort: 1080
    readinessProbe: {}
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    resources:
      limits:
        cpu: "1000m"
        memory: "1024Mi"
      requests:
        cpu: "500m"
        memory: "256Mi"
    securityContext:
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
    enableServiceLinks: true
    messageBatchSize: 1
    graceDelay: "00:00:15"
    # On top of partitionCommon.conf: core (credentials) and polling layers, env and mounts.
    conf:
      envSecret:
        - '{{ list "core" . | include "armonik.conf.secretName" }}'
        - '{{ list "polling" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
        - secret: '{{ list "polling" . | include "armonik.conf.mountSecretName" }}'
    # -- Extra env for the agent container. Shared vars go in conf.env.
    extraEnv: []
    # -- Extra envFrom for the agent container.
    extraEnvFrom: []
    # -- Extra volumeMounts for the agent container.
    extraVolumeMounts: []
    # -- Merged over the agent container, last. Lists the chart builds are refused: use extra*.
    containerPatch: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  imagePullSecrets: []
  terminationGracePeriodSeconds: 30
  # -- Extra containers, after agent, worker and the fluent-bit sidecar.
  extraContainers: []
  # -- Extra init containers.
  extraInitContainers: []
  # -- Extra volumes, after the conf mounts and the cache volume.
  extraVolumes: []
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # Worker defaults, overridden per partition.
  worker:
    name: "worker"
    # -- Worker image, as this object or a reference string. The repository has no default: each
    # partition brings its own, as a full path (dockerhubaneo/armonik_core_stream_test_worker).
    image:
      registry:
      repository:
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: worker-port
      containerPort: 1081
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    terminationMessagePath: "/dev/termination-log"
    terminationMessagePolicy: "File"
    imagePullPolicy: "IfNotPresent"
    resources:
      limits:
        cpu: "1000m"
        memory: "1024Mi"
      requests:
        cpu: "500m"
        memory: "512Mi"
    # -- Worker container securityContext, same hardening as the agent's. The uid shared with the
    # agent is podSecurityContext's; runAsNonRoot fails a root image if runAsUser is nulled.
    securityContext:
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
    checkRetries: 10
    checkDelay: "00:00:10"
    # On top of partitionCommon.conf: worker layer only. Never core, so user code stays credential-free.
    conf:
      envSecret:
        - '{{ list "worker" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "worker" . | include "armonik.conf.mountSecretName" }}'
    # -- Extra env for the worker container. Shared vars go in conf.env.
    extraEnv: []
    # -- Extra envFrom for the worker container.
    extraEnvFrom: []
    # -- Extra volumeMounts for the worker container.
    extraVolumeMounts: []
    # -- Merged over the worker container, last. Lists the chart builds are refused: use extra*.
    containerPatch: {}
  # KEDA ScaledObject of each partition.
  hpa:
    # Not read.
    type: "prometheus"
    # -- ScaledObject pollingInterval, in seconds.
    pollingInterval: 15
    # -- ScaledObject cooldownPeriod, in seconds.
    cooldownPeriod: 300
    # -- Replicas while no trigger is active; must be less than minReplicaCount.
    idleReplicaCount: 0
    # -- Minimum replicas while a trigger is active.
    minReplicaCount: 1
    # -- Maximum replicas.
    maxReplicaCount: 5

    # Optional fallback: replicas to hold after failureThreshold failed trigger reads. Both keys are
    # required when the block is set.
    # fallback:
    #   failureThreshold: 3
    #   replicas: 6

    # -- restoreToOriginalReplicaCount, and the HPA scale-down behavior (one policy).
    behavior:
      # -- Restore the Deployment's own replica count when the ScaledObject is deleted.
      restoreToOriginalReplicaCount: false
      # -- Scale-down stabilization window, in seconds.
      stabilizationWindowSeconds: 300
      # -- Scale-down policy type (Percent or Pods).
      type: Percent
      # -- Scale-down policy value.
      value: 100
      # -- Scale-down policy period, in seconds.
      periodSeconds: 15
    triggers:
      # Default: KEDA scrapes the metrics-exporter directly, keeping Prometheus out of the scaling path.
      # url comes from global.armonik.monitoring.metricsExporterUrl; targetValue is queued tasks per
      # replica. Assumes one always-present sample per armonik_<partition>_tasks_queued: metrics-api
      # cannot aggregate and has no absent-as-zero, so labeled metrics need the PromQL opt-in.
      - type: metrics-api
        metadata:
          url: '{{ include "armonik.monitoring.metricsExporterUrl" . }}'
          format: prometheus
          valueLocation: 'armonik_{{ .Values.partitionName }}_tasks_queued'
          targetValue: "2"
          activationTargetValue: "0"
      # PromQL opt-in, for rate, ratio or aggregation scaling: swap the trigger above for a prometheus
      # one. Unlike the default, it depends on prometheusOperator.available, and needs the namespace filter to stay
      # correct with several releases. Its URL never derives here, even under the umbrella: set
      # global.armonik.monitoring.prometheusUrl or a literal serverAddress.
      #   - type: prometheus
      #     metadata:
      #       serverAddress: '{{ include "armonik.monitoring.prometheusUrl" . }}'
      #       query: 'sum(armonik_{{ .Values.partitionName }}_tasks_queued{namespace="{{ .Release.Namespace }}"})'
      #       threshold: "2"
  # -- Fixed replica count, rendered only when set. Null leaves it to KEDA, so an upgrade never resets
  # what it scaled; set it when KEDA is not available by overriding the value.
  replicas: null
  # Shared by agent and worker (no credentials): log and compute layers, env and mounts.
  conf:
    envSecret:
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "compute" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "compute" . | include "armonik.conf.mountSecretName" }}'
# Partitions to deploy: each key is a partition name, its value merged over `partitionCommon`. At least
# one is required (templates/partitions-guard.yaml). Maps union across values files, so partitions
# accumulate: `unwanted: null` (or --set partitions.unwanted=null) drops an inherited one, while `{}`
# is a real partition inheriting partitionCommon. This chart ships none.
partitions:

fluentBit:
  isDaemonSet: true
  image:
    registry:
    repository: fluent/fluent-bit
    # Third party, so the tag is required. Keep it in step with the fluent-bit subchart (DaemonSet).
    tag: "5.1.2"
    pullPolicy: IfNotPresent
  # FIXME: the sidecar reads fluentBit.configMapName instead, so this key is ignored.
  configMapRef: "fluent-bit-config"

# The commented keys below are not read: placeholders for the shared file storage and volume options.
# checkFileStorageType: "FS"
# fileStorageType: "hostpath"

# preStop command of the worker and fluent-bit containers, meant to wait for the agent socket to go.
# FIXME: not valid sh (syntax error at "do"), so the hook fails at once and never waits.
preStopWaitScript: "<<EOF while test -e /cache/armonik_agent.sock ; do   sleep 1 done EOF"
