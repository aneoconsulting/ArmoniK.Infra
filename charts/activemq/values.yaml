global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

# -- Chart name used in resource names and labels.
nameOverride: ""
# -- Name prefix of every resource.
fullnameOverride: ""
# -- Namespace of every resource, the release namespace when empty.
namespaceOverride: ""

image:
  repository: apache/activemq
  # -- Tag. Empty takes `global.armonik.versions.activemq`, else this chart's AppVersion (the
  # ActiveMQ release it ships).
  # @default -- `.Chart.AppVersion`
  tag:
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  registry: ""

# -- Existing ServiceAccount of the broker pod (tpl-rendered), the namespace's `default` when empty.
# The broker never calls the Kubernetes API, so the chart creates none.
serviceAccountName: ""

activemqOptsMemory: "-Xms1g -Xmx1g"

extraEnv: []
  # - name: ACTIVEMQ_ENABLE_SCHEDULER
  #   value: "true"
# -- Extra envFrom for the activemq container.
extraEnvFrom: []
# -- Extra containers, after the activemq container, and extra init containers.
extraContainers: []
extraInitContainers: []
# containerPatch:
#   securityContext:
#     readOnlyRootFilesystem: true
#
# -- Merged over the activemq container, last. Patching a list the chart builds fails: use extra*.
containerPatch: {}
# podSpecPatch:
#   hostAliases:
#     - ip: "10.0.0.1"
#       hostnames: ["legacy.internal"]
#
# -- Merged over spec.template.spec, last. Patching a list the chart builds fails: use extra*.
# Pod labels are out of reach: the selector is immutable.
podSpecPatch: {}

commonLabels:
  app: storage
  service: activemq
  type: queue
podLabels: {}
podAnnotations: {}

podSecurityContext: {}

securityContext: {}

priorityClassName: system-cluster-critical

containerPort:
  amqp: 5672
  dashboard: 8161

hostNetwork:
  enabled: false

replicas: 1

revisionHistoryLimit:

updateStrategy: {}
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 0
#     maxUnavailable: 1

podDisruptionBudget:
  enabled: false
  minAvailable:
  maxUnavailable:

args: []

service:
  type: ClusterIP
  port:
    amqp: 5672
    dashboard: 8161
  annotations: {}
  labels: {}

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  # limits:
  #   cpu:
  #   memory:

# -- Mounts added after the chart's own (activemq.xml, log4j2.properties, jolokia-access.xml).
extraVolumeMounts: []
  # - mountPath: /credentials/
  #   mountPropagation: None
  #   name: activemq-storage-secret-volume
  #   readOnly: true

# -- Volumes added after the chart's own ConfigMaps.
extraVolumes: []
  # - name: activemq-tls-volume
  #   secret:
  #     defaultMode: 420
  #     optional: false
  #     secretName: <fullname>   # Certificate Secret, see certificate.yaml

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

dnsConfig: {}

# Deployment annotations.
deploymentAnnotations: {}

schedulerName: ""

tmpVolume:
  emptyDir: {}

tls:
  # Issue a cert-manager Certificate for the broker. Only tls.type "cert-manager" renders anything.
  enabled: false
  type: "cert-manager"
  clusterDomain: cluster.local
  certManager:
    addInjectorAnnotations: true
    # Issuer the Certificate references instead of a local one.
    existingIssuer:
      enabled: false
      kind: "Issuer"
      name: "my-issuer"
      group: ""
    # Setting provider, even to selfSigned, keeps a local Issuer despite an enabled global issuer.
    # Unset, the global issuer is used when enabled, else a local selfSigned one. See
    # charts/cert-manager-issuer.md.
    # provider: selfSigned
    # selfSigned: {}
    # ca: {}
    # vault: {}
    # acme: {}
    # venafi: {}
    # googleCas: {}
    # Certificate spec.duration and spec.renewBefore, cert-manager's defaults when empty. See
    # https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec
    duration: ""
    renewBefore: ""
    # Extra annotations and labels of the Certificate.
    annotations: {}
    labels: {}

networkPolicy:
  enabled: false
  extraIngressRules: []
  extraEgressRules: []
