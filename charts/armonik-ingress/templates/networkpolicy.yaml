{{- $ingressRules := list -}}
{{- if .Values.networkPolicy.ingress.healthCheck.enabled }}
  {{- $ingressRules = append $ingressRules (dict
        "from" .Values.networkPolicy.ingress.healthCheck.from
        "ports" .Values.networkPolicy.ingress.healthCheck.ports) }}
{{- end }}

{{- $egressRules := list -}}
{{- if .Values.networkPolicy.egress.dns.enabled }}
  {{- $egressRules = append $egressRules (include "armonik.netpol.dnsRule" .Values.networkPolicy.egress.dns | fromYaml) }}
{{- end }}

{{if and
      (list .Values "networkPolicy" "enabled" | include "armonik.utils.index" | default false)
      (list .Values "networkPolicy" "ingress" "enabled" | include "armonik.utils.index" | default false)
}}
{{- $cfg := dict
      "podSelector" .Values.networkPolicy.podSelector
      "policyTypes" (list "Ingress" "Egress")
      "ingress" (dict "rules" $ingressRules "extraRules" (.Values.networkPolicy.ingress.extraRules | default list))
      "egress" (dict "rules" $egressRules "extraRules" (.Values.networkPolicy.egress.extraRules | default list)) -}}

{{ include "armonik.netpol.render" (dict "context" . "config" $cfg "component" "ingress") }}
{{- end }}