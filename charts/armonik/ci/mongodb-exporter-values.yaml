# Exercises the mongodb-exporter dependency. Its ExternalSecret, ServiceMonitor and NetworkPolicy
# all need externalSecrets/prometheusOperator available, hence the operators-available shape of
# layered-operators-values.yaml. MongoDB TLS stays at the umbrella default (not required);
# mongodb-exporter-tls-values.yaml covers the other case.
global:
  armonik:
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: external-secrets
      prometheusOperator:
        deploy: false
        available: true
        namespace: monitoring
networkPolicy:
  enabled: true
dependencies:
  mongodb-exporter:
    enabled: true
