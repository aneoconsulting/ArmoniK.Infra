repos:
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 39.205.1
    hooks:
      - id: renovate-config-validator
        args: [--strict]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.80.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tflint
        args:
          - '--args=--only=terraform_deprecated_interpolation'
          - '--args=--only=terraform_deprecated_index'
          - '--args=--only=terraform_unused_declarations'
          - '--args=--only=terraform_comment_syntax'
          - '--args=--only=terraform_documented_outputs'
          - '--args=--only=terraform_documented_variables'
          - '--args=--only=terraform_typed_variables'
          - '--args=--only=terraform_module_pinned_source'
          - '--args=--only=terraform_naming_convention'
          - '--args=--only=terraform_required_version'
          - '--args=--only=terraform_required_providers'
          - '--args=--only=terraform_standard_module_structure'
          - '--args=--only=terraform_workspace_remote'
          - '--args=--only=terraform_unused_required_providers'
          - '--args=--only=terraform_empty_list_equality'
          - '--args=--only=terraform_module_version'
      #- id: terraform_tfsec
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-json
      - id: check-yaml
        args: [ --allow-multiple-documents]
        exclude: (charts|test/harness)/.*/template\.*
      - id: end-of-file-fixer
        exclude: ".*md$"
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=2"
          - "--no-sort-keys"
      - id: mixed-line-ending
        args:
          - "--fix=lf"
  - repo: local
    hooks:
      - id: forbid-generated-docs
        name: Forbid generated docs in README
        entry: .pre-commit/forbid-generated-docs.py
        language: python
        files: \.md$
