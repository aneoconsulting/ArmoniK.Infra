{{- if list .Values "networkPolicies" "mongodb" "operator" "enabled" | include "armonik.utils.index" | default false }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "armonik.fullname" . }}-mongodb-operator
  namespace: {{ .Values.namespace | default (include "armonik.namespace" .) }}
  labels:
    app.kubernetes.io/component: mongodb-operator
    {{- include "armonik.labels" . | nindent 4 }}

spec:
  podSelector:
    {{- list .Values "networkPolicies" "mongodb" "operator" "podSelector" | include "armonik.utils.index" | nindent 4 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        {{- list .Values "networkPolicies" "mongodb" "operator" "ingress" "from" | include "armonik.utils.index" | nindent 8 }}

  egress:
    - to:
        {{- list .Values "networkPolicies" "mongodb" "operator" "egress" "to" | include "armonik.utils.index" | nindent 8 }}
      ports:
        {{- list .Values "networkPolicies" "mongodb" "operator" "egress" "ports" | include "armonik.utils.index" | nindent 8 }}
{{- end }}

---
{{- if list .Values "networkPolicies" "mongodb" "server" "enabled" | include "armonik.utils.index" | default false }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "armonik.fullname" . }}-mongodb-server
  namespace: {{ .Values.namespace | default (include "armonik.namespace" .) }}
  labels:
    app.kubernetes.io/component: mongodb
    {{- include "armonik.labels" . | nindent 4 }}

spec:
  podSelector:
    {{- list .Values "networkPolicies" "mongodb" "server" "podSelector" | include "armonik.utils.index" | nindent 4 }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        {{- list .Values "networkPolicies" "mongodb" "server" "ingress" "from" | include "armonik.utils.index" | nindent 8 }}
      ports:
        {{- list .Values "networkPolicies" "mongodb" "server" "ingress" "ports" | include "armonik.utils.index" | nindent 8 }}

  egress:
    - to:
        {{- list .Values "networkPolicies" "mongodb" "server" "egress" "to" | include "armonik.utils.index" | nindent 8 }}
      ports:
        {{- list .Values "networkPolicies" "mongodb" "server" "egress" "ports" | include "armonik.utils.index" | nindent 8 }}
{{- end }}