# global.armonik.* defaults come from armonik-common/values.yaml (import-values) and suit a standalone
# plane.
global:
  armonik:
    # Release name of the umbrella that owns the conf Secrets.
    source: armonik
# -- Chart name used in resource names and labels.
nameOverride: ""
# -- Name prefix of every resource.
fullnameOverride: ""
# -- Namespace of every resource, the release namespace when empty. Under the umbrella it must equal the
# umbrella's own namespaceOverride.
namespaceOverride: ""
imagePullSecrets: []
name: control-plane
image:
  registry: ""
  repository: dockerhubaneo/armonik_control
  tag:
  pullPolicy: IfNotPresent

replicas: 1
maxErrorAllowed: 50

defaultPartition: default
extraPartitions:
  # default:
  #   parentPartitionIds: []
  #   podMax: 100
  #   podReserved: 50
  #   preemptionPercentage: 20
  #   priority: 1

rbac:
  authentication:
    required: false
  authorization:
    required: false
  createBuiltInRoles: false
  roles:
    # <roleName>: [""]
  users:
    # <username>: [""]
  userCertificates:
    # <username>:
    #   commonName: ""
    #   fingerprint: ""

serviceAccount:
  create: true
  # -- ServiceAccount name (tpl-rendered), armonik.fullname when empty. With create=false it must exist.
  name: ""
  annotations: {}
  secrets: []

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /liveness
    port: 1081
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 1

startupProbe:
  httpGet:
    path: /startup
    port: 1081
  initialDelaySeconds: 15
  periodSeconds: 3
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 20

nodeSelector: {}
tolerations: []
annotations: {}
affinity: {}
priorityClassName: ""
# -- Pod securityContext, also the metrics-exporter and init default. Empty: the images already
# run as a numeric non-root uid, which runAsNonRoot can verify.
podSecurityContext: {}
# -- Container securityContext, also the metrics-exporter and init default.
securityContext:
  capabilities:
    drop:
      - ALL
  privileged: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

# -- Extra env for the control-plane container. Shared vars go in conf.env.
extraEnv: []
# -- Extra envFrom for the control-plane container.
extraEnvFrom: []
# -- Extra volumeMounts for the control-plane container.
extraVolumeMounts: []
# -- Extra containers, after the control-plane container.
extraContainers: []
# -- Extra init containers.
extraInitContainers: []
# -- Extra volumes.
extraVolumes: []
# containerPatch:
#   securityContext:
#     readOnlyRootFilesystem: true
#
# -- Merged over the control-plane container, last. Lists the chart builds are refused: use extra*.
containerPatch: {}
# podSpecPatch:
#   hostAliases:
#     - ip: "10.0.0.1"
#       hostnames: ["legacy.internal"]
#   topologySpreadConstraints:
#     - maxSkew: 1
#       topologyKey: topology.kubernetes.io/zone
#       whenUnsatisfiable: ScheduleAnyway
#
# -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
# Pod labels are out of reach: the selector is immutable.
podSpecPatch: {}

# Base conf of every workload of this chart: core and log layers, env and mounts.
conf:
  # Overrides the umbrella's global.armonik.mountPath for this release (default "/mounts").
  # mountPath: /mounts
  envSecret:
    - '{{ list "core" . | include "armonik.conf.secretName" }}'
    - '{{ list "log" . | include "armonik.conf.secretName" }}'
  # The mount-aggregate of each layer in envSecret, all at mountPath in one projected volume. path
  # defaults to mountPath, mode to "0444".
  mountSecret:
    - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
    - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'

# On top of the base conf: control layer.
deployment:
  conf:
    envSecret:
      - '{{ list "control" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "control" . | include "armonik.conf.mountSecretName" }}'

ports:
  - name: control-port
    containerPort: 1080
    protocol: TCP
  - name: metrics-port
    containerPort: 1081
    protocol: TCP

service:
  name: control-plane
  serviceType: ClusterIP
  annotations:

  ports:
    - name: control-port
      port: 5001
      targetPort: 1080

metricsExporter:
  enabled: true
  name: metrics-exporter
  replicas: 1
  image:
    registry:
    repository: dockerhubaneo/armonik_control_metrics
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  annotations:
  affinity:
  priorityClassName:
  # -- Falls back to the chart-level podSecurityContext.
  podSecurityContext:
  # -- Falls back to the chart-level securityContext.
  securityContext:
  livenessProbe:
    httpGet:
      path: /liveness
      port: 1080
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 1
  startupProbe:
    httpGet:
      path: /startup
      port: 1080
    initialDelaySeconds: 15
    periodSeconds: 3
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 20
  ports:
    - name: metrics-port
      containerPort: 1080
      protocol: TCP
  service:
    name: metrics-exporter
    serviceType: ClusterIP
    annotations:
    ports:
      - name: metrics-port
        port: 9419
        targetPort: 1080
  # -- Extra env for the metrics-exporter container. Shared vars go in conf.env.
  extraEnv: []
  # -- Extra envFrom for the metrics-exporter container.
  extraEnvFrom: []
  # -- Extra volumeMounts for the metrics-exporter container.
  extraVolumeMounts: []
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra init containers.
  extraInitContainers: []
  # -- Extra containers, after the metrics-exporter container.
  extraContainers: []
  # -- Merged over the metrics-exporter container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # On top of the base conf: metrics layer.
  conf:
    envSecret:
      - '{{ list "metrics" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "metrics" . | include "armonik.conf.mountSecretName" }}'

init:
  enabled: false
  name: init
  image:
    registry:
    repository:
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  annotations:
  affinity:
  priorityClassName:
  # -- Falls back to the chart-level podSecurityContext.
  podSecurityContext:
  # -- Falls back to the chart-level securityContext.
  securityContext:
  # -- Extra env for the init container. Shared vars go in conf.env.
  extraEnv: []
  # -- Extra envFrom for the init container.
  extraEnvFrom: []
  # -- Extra volumeMounts for the init container.
  extraVolumeMounts: []
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra init containers. There is no extraContainers on a Job: a sidecar that never
  # exits keeps it from finishing.
  extraInitContainers: []
  # -- Merged over the init container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # On top of the base conf: init layer.
  conf:
    envSecret:
      - '{{ list "init" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "init" . | include "armonik.conf.mountSecretName" }}'

networkPolicy:
  enabled: false
  submitter:
    enabled: true
    # Pod selector matching Prometheus, for the built-in ingress rule. Defaults to
    # app.kubernetes.io/name: prometheus (kube-prometheus-stack's own label).
    prometheusPodSelector:
    extraIngressRules: []
    # Egress is DNS-only by default. Examples for the storage backends:
    # extraEgressRules:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # MongoDB's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: percona-server-mongodb
    #     ports:
    #       - protocol: TCP
    #         port: 27017
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # ActiveMQ's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: activemq
    #     ports:
    #       - protocol: TCP
    #         port: 5672
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # Redis's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: redis
    #     ports:
    #       - protocol: TCP
    #         port: 6379
    extraEgressRules: []

  metricsExporter:
    enabled: true
    # Same default as submitter.prometheusPodSelector.
    prometheusPodSelector:
    extraIngressRules: []
    # Egress is DNS-only by default. The metrics-exporter only reaches MongoDB: see the first
    # submitter.extraEgressRules example.
    extraEgressRules: []
