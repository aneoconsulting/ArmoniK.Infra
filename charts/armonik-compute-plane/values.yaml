nameOverride: ""
fullnameOverride: ""
replicaCount: 1
shareProcessNamespace: false
restartPolicy: Always
repository: dockerhubaneo
registry: ""
imagePullSecrets: []

global:
  imageRegistry: "public.ecr.aws"
  # Cross-chart operator control (see charts/armonik-operators). A standalone plane never installs
  # operators (deploy:false) and assumes the cluster provides them (available:true = "external").
  # Under the umbrella these are overridden by the umbrella's global.armonik.operators.*.
  armonik:
    operators:
      externalSecrets: { deploy: false, available: true }
      keda: { deploy: false, available: true }
      certManager: { deploy: false, available: true }
      mongodbOperator: { deploy: false, available: true }
      prometheusOperator: { deploy: false, available: true }
    monitoring:
      # -- Control-plane metrics-exporter `/metrics` scraped by the KEDA trigger. Defaults to the
      # `armonik.monitoring.metricsExporterUrl` derivation off `conf.source`, so a standalone plane
      # pointed at the main release resolves that release's exporter; a literal URL replaces it.
      metricsExporterUrl: '{{ include "armonik.monitoring.metricsExporterUrl" . }}'

serviceAccount:
  create: false
  name: compute-plane
  annotations: {}
  secrets: []

service: {}

rbac:
  # Specifies whether RBAC resources should be created
  create: true

podDisruptionBudget:
  # https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  enabled: false
  minAvailable:
  maxUnavailable:

# KEDA usability is now controlled cross-chart via global.armonik.operators.keda.{deploy,available}
# (see charts/armonik-operators). A ScaledObject is rendered per partition when KEDA is available.

# Base conf, merged into the init Job only (agent/worker build theirs from partitionCommon).
conf:
  # Release name of the umbrella that owns the conf Secrets (defaults to "armonik").
  source: armonik
  # Overrides the umbrella's global.armonik.mountPath for this release (default "/mounts").
  # mountPath: /mounts

init:
  enabled: true
  image:
    registry:
    repository: dockerhubaneo
    name: armonik_control
    tag:
    pullPolicy:
  resources:
  nodeSelector:
  tolerations:
  # Init Job: core + log + jobs layers + core TLS mounts.
  conf:
    envSecret:
      - '{{ list "core" . | include "armonik.conf.secretName" }}'
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "init" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "init" . | include "armonik.conf.mountSecretName" }}'
  configmaps:

partitionCommon:
  socketType: "tcp" #TODO: things break without this, need to look into it later
  labels:
    app: "armonik"
    service: "compute-plane"
  agent:
    name: polling-agent
    image:
      registry:
      repository: dockerhubaneo
      name: armonik_pollingagent
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: poll-agent-port
      containerPort: 1080
    readinessProbe: {}
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "500m"
      memory: "256Mi"
    securityContext:
      capabilities:
        drop:
          - SYS_PTRACE
      privileged: false
      runAsNonRoot: false
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
    enableServiceLinks: true
    messageBatchSize: 1
    graceDelay: "00:00:15"
    # On top of partitionCommon: core (credentials) + polling + core TLS mounts.
    conf:
      envSecret:
        - '{{ list "core" . | include "armonik.conf.secretName" }}'
        - '{{ list "polling" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
        - secret: '{{ list "polling" . | include "armonik.conf.mountSecretName" }}'
  annotations: {}
  nodeSelector: {}
  tolerations: []
  terminationGracePeriodSeconds: 30
  # Default worker, will be overridden per partition
  worker:
    name: "worker"
    image:
      registry:
      repository: dockerhubaneo
      name:
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: worker-port
      containerPort: 1081
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    terminationMessagePath: "/dev/termination-log"
    terminationMessagePolicy: "File"
    imagePullPolicy: "IfNotPresent"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"
    checkRetries: 10
    checkDelay: "00:00:10"
    # On top of partitionCommon: worker layer only. Never core, so user code stays credential-free.
    conf:
      envSecret:
        - '{{ list "worker" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "worker" . | include "armonik.conf.mountSecretName" }}'
  hpa:
    type: "prometheus"
    # -- Polling interval in seconds
    pollingInterval: 15 # Optional. Default: 30 seconds
    # -- Cooldown period in seconds
    cooldownPeriod: 300 # Optional. Default: 300 seconds
    # -- Count of idle replicas
    idleReplicaCount: 0 # Optional. Default: ignored, must be less than minReplicaCount
    # -- Minimum count of replicas
    minReplicaCount: 1 # Optional. Default: 0
    # -- Maximum count of replicas
    maxReplicaCount: 5 # Optional. Default: 100

    # -- Fallback options
    #fallback: # Optional. Section to specify fallback options
    #  # -- Threshold of failures
    #  failureThreshold: 3 # Mandatory if fallback section is included
    #  # -- Number of replicas
    #  replicas: 6 # Mandatory if fallback section is included

    # -- Advanced options to manage the behavior of the HPA
    behavior:
      # -- Restore to the original replicas count
      restoreToOriginalReplicaCount: false # Optional. Default: false
      # -- Stabilization window in seconds
      stabilizationWindowSeconds: 300
      # -- Type of the target
      type: Percent
      # -- Value of the target
      value: 100
      # -- Period in seconds
      periodSeconds: 15
    triggers:
      # Default: KEDA scrapes the control-plane metrics-exporter /metrics directly - no Prometheus in
      # the scaling path (decoupled from the monitoring stack; per-release isolation for free). The URL
      # is injected per-render from global.armonik.monitoring.metricsExporterUrl. valueLocation is a
      # PromQL metric selector; targetValue = queued tasks per replica (the old prometheus `threshold`).
      #
      # ASSUMPTION: the exporter emits exactly ONE always-present sample per
      # armonik_<partition>_tasks_queued. If ArmoniK moves to labeled/multi-dimensional metrics that
      # break that (metrics-api cannot aggregate, and has no absent-as-zero), switch to the PromQL
      # opt-in below.
      - type: metrics-api
        metadata:
          url: "{{ .Values.metricsExporterUrl }}"
          format: prometheus
          valueLocation: 'armonik_{{ .Values.partitionName }}_tasks_queued'
          targetValue: "2"
          activationTargetValue: "0"
      # --- PromQL opt-in (advanced) ---------------------------------------------------------------
      # For rate/ratio/aggregation-based scaling, replace the metrics-api trigger above with a
      # prometheus trigger against the shared cluster Prometheus. NOTE: this reintroduces a dependency
      # on global.armonik.operators.prometheusOperator being available, and needs a namespace filter
      # for multi-release correctness:
      #   - type: prometheus
      #     metadata:
      #       serverAddress: <global.armonik.monitoring.prometheusUrl>
      #       query: 'sum(armonik_<partition>_tasks_queued{namespace="<release-namespace>"})'
      #       threshold: "2"
  replicas: 1
  # Shared by agent + worker (no credentials): log + compute layers.
  conf:
    envSecret:
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "compute" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "compute" . | include "armonik.conf.mountSecretName" }}'
# Partitions to deploy. Each key is a partition name; its value is per-partition overrides merged
# over `partitionCommon`. At least one partition is REQUIRED (see templates/partitions-guard.yaml):
# a compute-plane with none runs no workers.
#
# Helm value merge is additive for maps: partitions you set are UNIONED with any inherited from a
# lower-precedence values file (a shared base, the umbrella, etc.); adding one never removes the
# others. To drop an inherited partition, set it to null - e.g. in a values file
#   partitions:
#     unwanted: null
# or `--set partitions.unwanted=null`. The templates treat a null partition as removed (skipped),
# so this works in any layer. An empty map ({}) is a REAL partition (inherits partitionCommon);
# only null removes. This chart ships no active default partitions, so a fresh install has nothing
# to null; the note matters only when layering values files.
partitions:

fluentBit:
  isDaemonSet: true
  image:
    registry:
    repository: fluent
    name: fluent-bit
    # tag: "2.0.9"
    pullPolicy: IfNotPresent
  configMapRef: "fluent-bit-config"

