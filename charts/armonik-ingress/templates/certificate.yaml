{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $tls := .Values.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- if and $tls.enabled $certManager.enabled }}
{{- $issuerName := include "armonik.fullname" . | printf "%s-issuer" }}
{{- $issuer := list $ $certManager.existingIssuer $issuerName | include "armonik.certManager.getIssuer" | fromYaml }}
{{- if and (not $ops.certManager.available) $issuer.needsLocalIssuer }}
{{- fail "ingress TLS via cert-manager requires it: set global.armonik.operators.certManager.available=true, set tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or disable tls.certManager and supply the TLS Secret directly." }}
{{- end }}
{{- if $issuer.needsLocalIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  name: {{ $issuer.name | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  commonName: {{ include "armonik.fullname" . }}-cert
  dnsNames:
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc.{{ include "armonik.clusterDomain" . }}
  {{- range $certManager.extraDnsNames }}
  - {{ . | quote }}
  {{- end }}
  {{- with $certManager.ipAddresses }}
  ipAddresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  secretName: {{ include "armonik.fullname" . | quote }}
  {{- include "armonik.certManager.certificateSpec" (dict "certManager" $certManager "issuer" $issuer) | nindent 2 }}
{{- end }}
