suite: prometheus-operator pod monitor
templates:
  - podmonitor.yaml
set:
  partitions:
    default:
      worker:
        image:
          name: armonik-dynamic-dotnet-worker
tests:
  - it: renders a PodMonitor when the prometheus-operator CRDs are present
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges: it adds
        templates/podmonitor.yaml, gated on
        global.armonik.operators.prometheusOperator.available (default true
        via the armonik-common import-values lift).
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
  - it: renders no PodMonitor when the prometheus operator is unavailable
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges (same gate as above).
    set:
      global:
        armonik:
          operators:
            prometheusOperator:
              deploy: false
              available: false
    asserts:
      - hasDocuments:
          count: 0
