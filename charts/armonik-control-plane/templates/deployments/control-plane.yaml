{{- $init := .Values.init | default dict -}}
{{- $deployment := .Values.deployment | default dict -}}
{{- $conf := list
    (not $init.enabled | ternary (include "armonik.control.init.confHelper" .) "" | fromYaml)
    (include "armonik.control.confHelper" . | fromYaml)
    .Values.conf
    $deployment.conf
  | include "armonik.conf.merge" | fromYaml -}}
{{- $conf = list $conf $ | include "armonik.conf.resolve" | fromYaml -}}
{{- $image := list $ .Values.image | include "armonik.utils.imageConf" | fromYaml -}}
{{- $ctx := dict "root" $ "conf" $conf "image" $image -}}
{{- $podSpec := list (include "armonik.control.podSpec" $ctx) .Values.podSpecPatch "podSpecPatch" | include "armonik.utils.patch" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    app.kubernetes.io/component: control-plane
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with .Values.annotations}}
  annotations:
  {{- range $key, $value := . }}
    {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        armonik.fr/deployment: {{ include "armonik.conf.source" . | quote }}
        {{- include "armonik.selectorLabels" . | nindent 8 }}
    spec: {{- $podSpec | nindent 6 }}
