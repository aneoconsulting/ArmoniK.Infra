# Exercises the mongodb-exporter dependency. Its ExternalSecret, ServiceMonitor and NetworkPolicy
# need externalSecrets and prometheusOperator available, hence the operators shape of
# layered-operators-values.yaml. MongoDB TLS stays at the umbrella default (unsafeFlags.tls=true,
# not required); mongodb-exporter-tls-values.yaml covers the TLS-required case.
global:
  armonik:
    # kube-prometheus-stack is installed by another release: its URL is stated.
    monitoring:
      prometheusUrl: http://ops-kube-prometheus-prometheus.monitoring.svc:9090
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: external-secrets
      prometheusOperator:
        deploy: false
        available: true
        namespace: monitoring
networkPolicy:
  enabled: true
dependencies:
  mongodb-exporter:
    enabled: true
