suite: identity headers on gRPC requests
templates:
  - armonik-nginx-conf.yaml
  - validate.yaml
values:
  - ../ci/default-values.yaml
tests:
  # A client without a certificate must not be able to assert an identity: an empty value makes
  # nginx drop the header instead of passing the client's own through.
  - it: clears the three identity headers without mTLS and passes tokens through
    template: armonik-nginx-conf.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-Client-Cert "";'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-User "";'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-Groups "";'
      # Token method: nginx verified nothing, the control plane validates the token
      - notMatchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header Authorization'

  - it: clears the identity headers on the plain Secret path too
    template: armonik-nginx-conf.yaml
    set:
      global:
        armonik:
          operators:
            externalSecrets:
              deploy: false
              available: false
      urlsSecretName: ""
      control_plane_url: control-plane.example:1080
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-Client-Cert "";'

  - it: forwards the verified certificate in the XFCC format with mTLS, and clears the other credentials
    template: armonik-nginx-conf.yaml
    values:
      - ../ci/tls-mtls-values.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-Client-Cert "Cert=\\"\$ssl_client_escaped_cert\\"";'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-User "";'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Forwarded-Groups "";'
      # ArmoniK Core refuses a request presenting a certificate and a token
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header Authorization "";'
      - notMatchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: '\$client_(cn|fingerprint)|ssl_client_s_dn'

  - it: writes renamed headers
    template: armonik-nginx-conf.yaml
    values:
      - ../ci/tls-mtls-values.yaml
    set:
      identityHeaders:
        certificate: X-Client-Cert
        user: X-User
        groups: X-Roles
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Client-Cert "Cert='
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-User "";'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'grpc_set_header X-Roles "";'
      - notMatchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'X-Forwarded-'

  - it: rejects a header name nginx cannot write
    # raised first by validate.yaml, which resolves the headers too
    template: validate.yaml
    set:
      identityHeaders:
        certificate: X_Client Cert
    asserts:
      - failedTemplate:
          errorPattern: 'identityHeaders.certificate must be a header name of letters, digits and dashes'

  - it: rejects an empty header name
    # raised first by validate.yaml, which resolves the headers too
    template: validate.yaml
    set:
      identityHeaders:
        groups: ""
    asserts:
      - failedTemplate:
          errorPattern: 'identityHeaders.groups must be a header name'

  - it: rejects two keys naming the same header, case aside
    # raised first by validate.yaml, which resolves the headers too
    template: validate.yaml
    set:
      identityHeaders:
        groups: x-forwarded-user
    asserts:
      - failedTemplate:
          errorPattern: 'identityHeaders.groups repeats identityHeaders.user'

  - it: rejects the Authorization header, which carries tokens
    # raised first by validate.yaml, which resolves the headers too
    template: validate.yaml
    set:
      identityHeaders:
        user: authorization
    asserts:
      - failedTemplate:
          errorPattern: 'identityHeaders.user cannot be Authorization'

  - it: rejects a header key of the removed CN and fingerprint identity
    template: validate.yaml
    set:
      identityHeaders:
        commonName: X-Certificate-Client-CN
    asserts:
      - failedTemplate:
          errorPattern: 'identityHeaders.commonName is removed'

  - it: rejects mtls.trustedCommonNames, which ArmoniK Core cannot honor
    template: validate.yaml
    values:
      - ../ci/tls-mtls-values.yaml
    set:
      mtls:
        trustedCommonNames:
          - proxy.armonik.local
    asserts:
      - failedTemplate:
          errorPattern: 'mtls.trustedCommonNames is removed'
