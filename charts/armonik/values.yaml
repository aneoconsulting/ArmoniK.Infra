  #   metrics:
  #     image: 
  #         registry: public.ecr.aws
  #     enabled: true
  #     serviceMonitor:
  #       enabled: true

  ################## ACTIVEMQ ##################
  activemq:
    enabled: true
    replicas: 1
    fullnameOverride: "activemq"
    image:
      registry: docker.io
    networkPolicy:
      # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: control-plane
            - podSelector:
                matchLabels:
                  app.kubernetes.io/name: compute-plane
          ports:
            - protocol: TCP
              port: 5672


  ################## MONGODB ##################
  # This default configuration is intended for a development/test cluster
  # Sharding is not supported yet
  # Please check Percona's MongoDB Helm chart documentation @ https://github.com/percona/percona-helm-charts/tree/main/charts/psmdb-db
  mongodb:
    enabled: true
    sharding:
      enabled: false
    backup:
      enabled: false
    replsets:
      rs0:
        size: 1
    #existingConfigmap: "mongodb-armonik-scripts"
    tls:
      mode: preferTLS
      allowInvalidCertificates: true
      # issuerConf:
      #   name: armonik-selfsigned-issuer
      #   kind: ClusterIssuer
      #   group: cert-manager.io
    unsafeFlags:
      replsetSize: true
      tls: true
    finalizers: []

  # KEDA moved to charts/armonik-operators, configured at operators.keda.*.

  # cert-manager moved to charts/armonik-operators, configured at operators.cert-manager.*.

  ################## GRAFANA ##################
  grafana:
    image:
        registry: docker.io
    enabled: true
    serviceMonitor:
      enabled: true
    fullnameOverride: "grafana"
    grafana.ini:
      server:
        # Keep root_url path-less and serve_from_sub_path false: the ingress publishes Grafana
        # under a prefix it injects itself (armonik-ingress templates/configmaps/nginx.yaml),
        # which needs an empty appSubUrl. Enforced by armonik/templates/validate.yaml.
        domain: grafana.local
        root_url: http://grafana
        serve_from_sub_path: false
      auth.anonymous:
        enabled: true
    sidecar:
      dashboards:
        enabled: true
        folderAnnotation: "grafana_dashboard_folder"
        label: "grafana_dashboard"
        # -- Namespaces the sidecar watches: this release's plus the prometheusOperator namespace,
        # where kps renders the standard k8s/node dashboards (the sidecar sees only its own by default;
        # `rbac.namespaced=false` already grants the cluster-wide read).
        # Beware `helm upgrade --reuse-values`: it replays the old coalesced values, where the grafana
        # chart's own `searchNamespace: null` beats this default. Pass values explicitly.
        searchNamespace:
          - '{{ include "armonik.monitoring.dashboardNamespaces.default" . }}'
      datasources:
        enabled: true
    networkPolicy:
      # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
      egress:
        enabled: true
        blockDNSResolution: false
        ports:
          - protocol: TCP
            port: 9090

        to:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus

