suite: tls and mtls
templates:
  - certificate.yaml
  - configmaps/nginx.yaml
values:
  - ../ci/tls-mtls-values.yaml
tests:
  # The wait job for a self-installed cert-manager belongs to the umbrella,
  # which renders it once for every emitter; covered by armonik/tests/operators_test.yaml.
  - it: renders the Certificate and its Issuer
    template: certificate.yaml
    asserts:
      - containsDocument:
          kind: Certificate
          apiVersion: cert-manager.io/v1
          any: true
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          any: true
  - it: references an existing issuer instead of creating one
    template: certificate.yaml
    set:
      tls:
        certManager:
          existingIssuer:
            enabled: true
            kind: ClusterIssuer
            name: my-issuer
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          any: true
        not: true
      - equal:
          path: spec.issuerRef.name
          value: my-issuer
        documentSelector:
          path: kind
          value: Certificate
  - it: turns on client certificate verification with mTLS
    template: configmaps/nginx.yaml
    asserts:
      - matchRegex:
          path: data["armonik.conf"]
          pattern: ssl_verify_client on
  - it: fails TLS via cert-manager when the operator is unavailable and no issuer exists
    template: certificate.yaml
    set:
      global:
        armonik:
          operators:
            certManager:
              deploy: false
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "ingress TLS via cert-manager requires it"
