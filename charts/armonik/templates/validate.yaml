{{- /* armonik-ingress injects Grafana's public prefix itself (armonik.grafana.locations in
       templates/_armonik-conf.tpl) and needs an empty appSubUrl. Otherwise the UI breaks with no
       error anywhere. */ -}}
{{- $grafanaEnabled := list .Values "dependencies" "grafana" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- $ingressEnabled := list .Values "ingress" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- if and $grafanaEnabled $ingressEnabled -}}
  {{- $server := list .Values "dependencies" "grafana" "grafana.ini" "server" | include "armonik.utils.index" | fromYaml | default dict -}}
  {{- $rootUrl := $server.root_url | default "" | toString -}}
  {{- /* appSubUrl is root_url's path. */ -}}
  {{- $parts := splitList "://" $rootUrl | last | splitn "/" 2 -}}
  {{- $path := $parts._1 | default "" | trimSuffix "/" -}}
  {{- if $path -}}
    {{- printf `dependencies.grafana."grafana.ini".server.root_url must not carry a path, got %q: armonik-ingress injects Grafana's public prefix itself and needs an empty appSubUrl. Drop the %q segment, or set ingress.enabled=false to proxy Grafana yourself.` $rootUrl $path | fail -}}
  {{- end -}}
  {{- if $server.serve_from_sub_path -}}
    {{- fail `dependencies.grafana."grafana.ini".server.serve_from_sub_path must stay false: armonik-ingress strips the prefix before proxying, so Grafana keeps serving at "/".` -}}
  {{- end -}}
{{- end -}}

{{- /* One backend per Core storage slot: the fragment listed last in _core.tpl would silently win the
       slot's Components__ keys while the other backend still deploys. */ -}}
{{- $slots := dict
      "table storage" (list "mongodb" "postgresql" "externalPostgresql")
      "object storage" (list "redis" "gcs" "s3")
      "queue" (list "activemq" "rabbitmq" "pubsub" "sqs") -}}
{{- range $slot, $deps := $slots -}}
  {{- $on := list -}}
  {{- range $dep := $deps -}}
    {{- if list $.Values "dependencies" $dep "enabled" | include "armonik.utils.index" -}}
      {{- $on = append $on $dep -}}
    {{- end -}}
  {{- end -}}
  {{- if gt (len $on) 1 -}}
    {{- printf "dependencies %s back the same %s slot: enable only one." (join ", " $on) $slot | fail -}}
  {{- end -}}
{{- end -}}

{{- /* The methods the control plane selects must match what this ingress writes: a method whose
       header the ingress never writes deploys cleanly and refuses every caller. Only checked with
       the ingress subchart; another proxy in front of the control plane is the operator's own. */ -}}
{{- with .Subcharts.ingress -}}
  {{- $ingress := . -}}
  {{- with index $.Subcharts "control-plane" -}}
    {{- $methods := include "armonik.control.authentication" .Values | splitList "," -}}
    {{- $sso := include "armonik.ingress.sso" $ingress | fromYaml -}}
    {{- if and (has "Xfcc" $methods) (not $ingress.Values.mtls.enabled) -}}
      {{- fail "control-plane.authorization.authentication selects Xfcc, but ingress.mtls.enabled is false: the ingress verifies no client certificate, so it forwards none. Enable ingress.tls and ingress.mtls, or remove Xfcc" -}}
    {{- end -}}
    {{- if and (has "Proxy" $methods) (not $sso.enabled) -}}
      {{- fail "control-plane.authorization.authentication selects Proxy, but ingress.sso.enabled is false: the ingress writes no SSO user. Enable ingress.sso, or remove Proxy" -}}
    {{- end -}}
    {{- if and $sso.enabled (not (has "None" $methods)) (not (has "Proxy" $methods)) -}}
      {{- fail "ingress.sso.enabled writes the SSO user and groups, but control-plane.authorization.authentication does not select Proxy: every gRPC-web call of the admin GUI would be refused. Add Proxy" -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* Keycloak is served by the ingress, under the publicUrl of its SSO, through the operator. */ -}}
{{- if (include "armonik.keycloak" . | fromYaml).enabled -}}
  {{- if not $.Subcharts.ingress -}}
    {{- fail "global.armonik.keycloak.enabled needs the ingress, which serves Keycloak under /auth: enable ingress" -}}
  {{- end -}}
  {{- if not (include "armonik.ingress.sso" .Subcharts.ingress | fromYaml).enabled -}}
    {{- fail "global.armonik.keycloak.enabled needs ingress.sso.enabled: Keycloak is the identity provider of the ingress SSO, and its publicUrl is Keycloak's" -}}
  {{- end -}}
  {{- if not (include "armonik.operators" $ | fromYaml).keycloakOperator.available -}}
    {{- fail "global.armonik.keycloak.enabled needs global.armonik.operators.keycloakOperator.available: the Keycloak CR needs the Keycloak operator CRDs" -}}
  {{- end -}}
  {{- if list .Values "networkPolicy" "enabled" | include "armonik.utils.index" -}}
    {{- fail "global.armonik.keycloak.enabled is not supported with networkPolicy.enabled yet: no rule lets nginx reach Keycloak" -}}
  {{- end -}}
  {{- if gt (len (list .Values "keycloak" "groups" | include "armonik.utils.index" | fromYamlArray)) 0 -}}
    {{- range list .Values "keycloak" "groups" | include "armonik.utils.index" | fromYamlArray -}}
      {{- if not (regexMatch "^[^,]+$" (toString .)) -}}
        {{- printf "keycloak.groups: %q holds a comma, which ArmoniK Core would read as several roles" (toString .) | fail -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* The Cluster CR has no CRD without the CloudNativePG operator: fail at render. */ -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- $postgresqlEnabled := list .Values "dependencies" "postgresql" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- if and $postgresqlEnabled (not $ops.postgresqlOperator.available) -}}
  {{- fail "dependencies.postgresql.enabled=true requires global.armonik.operators.postgresqlOperator.available=true: the Cluster CR needs the CloudNativePG CRDs." -}}
{{- end -}}
