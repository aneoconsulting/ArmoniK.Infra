{{ if (include "armonik.dependencies" $ | fromYaml).grafana }}
{{- /* Shared cluster Prometheus URL: global.armonik.monitoring.prometheusUrl (override) else the
       in-release kps Prometheus at .svc[.<clusterDomain>]. Umbrella-only, so computed inline here. */}}
{{- $promUrl := list $.Values "global" "armonik" "monitoring" "prometheusUrl" | include "armonik.utils.index" -}}
{{- if not $promUrl -}}
{{- $domain := list $.Values "global" "armonik" "clusterDomain" | include "armonik.utils.index" -}}
{{- $promUrl = printf "http://prometheus-prometheus.%s.svc%s:9090" .Release.Namespace (ternary "" (printf ".%s" $domain) (empty $domain)) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-armonik
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: {{ tpl $promUrl $ }}
        isDefault: true
        uid: "PBFA97CFB590B2093"
        jsonData:
          tlsSkipVerify: true
        version: 1
{{ end }}
