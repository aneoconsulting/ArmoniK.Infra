name: Approval freshness

# Dismisses an approval only when the pull request diff changed since it was
# given, so rebasing a stack keeps the approvals of unchanged pull requests.
# Replaces the ruleset's "Dismiss stale pull request approvals when new commits
# are pushed", which must be off, and is paired with the required status checks
# `approval-freshness` and `approval-freshness-relay` (GitHub Actions source).
# See .github/scripts/approval-freshness.js.
#
# Every pull request event reaches this workflow through the relay, so it always
# runs from the default branch: a pull request can stop it from running, which
# leaves its head without the required check, but cannot change what it does.
# A pull request job named `approval-freshness` can still forge the check: this
# guards against mistakes, not against an author with write access.
# Nothing here runs code from the pull request: its commits are only diffed.

on:
  workflow_run:
    workflows:
      - Approval freshness relay
    types:
      - completed
  # Catches pull requests whose relay did not run.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number; every open pull request when empty
        required: false

permissions: {}

# A pending run replaces the previous pending one of its group, so the group
# must not merge two pull requests: fork branch names collide.
concurrency:
  group: approval-freshness-${{ github.event.workflow_run && format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.run_id }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate approvals
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.event == 'pull_request'
      || github.event.workflow_run.event == 'pull_request_review'
    permissions:
      checks: write # to record fingerprints and report the required check
      contents: read # to fetch and diff the pull request commits
      pull-requests: write # to dismiss stale approvals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts

      - name: Evaluate approvals
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const evaluate = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/approval-freshness.js`);
            await evaluate({ github, context, core });
