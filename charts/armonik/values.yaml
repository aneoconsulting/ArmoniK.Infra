############################################
################## GLOBAL ##################
############################################
global:
  version:
    armonikCore: "0.37.1" ### TODO FIX VERSIONS GLOBAL IF NULL USE DEFAULT IN SUB CHARTS COMPUTE-PLANE
    #armonikPollingagent: "0.35.0"
    #armonikGui: "0.14.5"
    #nginx: "1.27.4-alpine-slim"
  image:
    pullPolicy: IfNotPresent # FOR KEDA IMAGES
    registry: "" # FOR KEDA IMAGES
  imageRegistry: "" #"public.ecr.aws" # FOR BITNAMI IMAGES AND ARMONIK IMAGES
  security:
    allowInsecureImages: true
  #imagePullSecrets: [{"name": "secret"}] # FOR BITNAMI IMAGES AND ARMONIK IMAGES
  environment:
    name: "local"
    description: "Armonik environment"
  # DNS domain of the cluster. Defaults to "cluster.local"
  clusterDomain: ""
  # Root dir for conf mount Secrets in pods; propagated to subcharts. env strings and volumeMounts derive from it.
  armonik:
    mountPath: /mounts
    # In-cluster service hostnames stop at ".svc" (resolves via the kubelet search domains without
    # assuming the cluster domain). Set clusterDomain to force fully-qualified names, e.g. "cluster.local".
    clusterDomain: ""
    # Cross-chart operator control (see charts/armonik-operators). Per operator:
    #   deploy    - this (umbrella) release installs the operator via the armonik-operators subchart.
    #   available - the operator's CRDs are present (installed here OR external) -> ArmoniK emits CRs.
    # All-in-one default: install and use every operator (managed).
    operators:
      externalSecrets: { deploy: true, available: true }
      keda: { deploy: true, available: true }
      certManager: { deploy: true, available: true }
      mongodbOperator: { deploy: true, available: true }
      prometheusOperator: { deploy: true, available: true }
    monitoring:
      # -- Namespace of the `armonik-operators` release (the shared kube-prometheus-stack). Empty = this
      # release's namespace. Required for layered installs: it drives both `prometheusUrl` and the Grafana
      # dashboard sidecar's search namespaces. Rendering fails when `prometheusOperator.deploy=false` and
      # neither this nor `prometheusUrl` is set, instead of emitting an unresolvable datasource.
      namespace: ""
      # -- Prometheus for the Grafana datasource and PromQL KEDA triggers. Defaults to the
      # `armonik.monitoring.prometheusUrl` derivation; a literal URL replaces it.
      prometheusUrl: '{{ include "armonik.monitoring.prometheusUrl" . }}'
      # -- Control-plane metrics-exporter `/metrics` scraped by KEDA (default scaling path). Defaults to
      # the `armonik.monitoring.metricsExporterUrl` derivation off `conf.source`; a literal URL replaces it.
      metricsExporterUrl: '{{ include "armonik.monitoring.metricsExporterUrl" . }}'


############################################
### ARMONIK APPLICATION CONFIGURATION #####
############################################
control-plane:
  enabled: true
  defaultPartition: default
  extraPartitions:
    # default:
    #   podMax: 100
    #   podReserved: 50
    #   preemptionPercentage: 20
    #   priority: 1
  # Point the child at the conf Secrets this umbrella renders (overrides its "armonik" default).
  conf:
    source: '{{ .Release.Name }}'
  init:
    enabled: true
  rbac:
    createBuiltInRoles: true

compute-plane:
  # The umbrella ships a working set of default partitions (below) and deploys them, so a plain
  # `helm install` gives a usable cluster. Set enabled=false to deploy a "base" release
  # (control-plane + storage + operators + conf) with NO compute-plane, and add partitions via
  # separate armonik-compute-plane releases (see NOTES.txt). Whenever enabled=true at least one
  # partition is required: an empty compute-plane runs no workers and is rejected by its guard.
  enabled: true
  serviceAccount:
    create: true
  # Point the child at the conf Secrets this umbrella renders (overrides its "armonik" default).
  conf:
    source: '{{ .Release.Name }}'
  # Default partitions. Partitions merge additively across values files (adding one never removes
  # the defaults below); drop one you don't want by setting it to null - e.g.
  # `--set compute-plane.partitions.htcmock=null` or, in a values file, `partitions: { htcmock: null }`.
  partitions:
    default:
      worker:
        image:
          name: "armonik-dynamic-dotnet-worker"
          tag: "0.21.2"
    stream:
      worker:
        image:
          name: "armonik_core_stream_test_worker"
    htcmock:
      socketType: "tcp"
      worker:
        image:
          name: "armonik_core_htcmock_test_worker"

conf:
  # Names every <source>-conf-<layer> Secret the umbrella renders (this release).
  source: '{{ .Release.Name }}'
  log:
    minimumLevel: Information

################## INGRESS ##################
ingress:
  enabled: true

# To bring your own MongoDB, set dependencies.mongodb.enabled=false and supply the connection via the
# conf values (conf.core.env / conf.core.envFromSecret). The in-cluster psmdb-db (below) is the default.

############################################
############ CERT-MANAGER WAIT #############
############################################
# Umbrella-rendered Job that waits for the cert-manager webhook to be Available (and its CA injected)
# before Certificate/Issuer CRs are applied. Rendered ONLY when this release installs cert-manager
# (global.armonik.operators.certManager.deploy); covers every emitter (ingress, activemq). Config only.
certManagerWait:
  image:
    repository: alpine/k8s
    tag: 1.31.0
    pullPolicy: IfNotPresent
  timeout: 300s

############################################
############### DEPENDENCIES ###############
############################################

dependencies:
  ################# RABBITMQ #################
  rabbitmq:
    image:
      registry: bitnamilegacy
      repository: rabbitmq
      tag: 4.1.3
    enabled: false
    fullnameOverride: "rabbitmq"
    auth:
      username: "admin"
      password: "admin"
      # tls:
      #   enabled: false
      #   autoGenerated: false
    #esourcesPreset: nano
    persistence:
      enabled: false
    metrics:
      image: 
        registry: public.ecr.aws
      enabled: true
      serviceMonitor:
        enabled: true

  ################## REDIS ##################
  redis:
    enabled: true
    image:
      registry: public.ecr.aws
    auth:
      enabled: true
      usersExistingSecret: "redis-users"
      aclUsers:
        default:
          permissions: "~* &* +@all"
    replica:
      enabled: false
    tls:
      enabled: false
      existingSecret: "" 
      serverPublicKey: ""
      serverKey: ""
      caPublicKey: ""
    metrics:
      enabled: true
      image:
        registry: public.ecr.aws
      serviceMonitor:
        enabled: true
        port: http-metrics

  # Bitnami chart compatible values
  # redis:
  #   enabled: true
  #   image:
  #     registry: public.ecr.aws
  #   useStatefulSet: true
  #   replica:
  #     replicaCount: 1
  #     persistence:
  #       enabled: false
  #     autoscaling:
  #       enabled: false
  #       targetCPU: "80"
  #       targetMemory: "80"
  #   fullnameOverride: "redis"
  #   tls: #BUG CHART https://github.com/bitnami/charts/issues/29616
  #     enabled: false
  #     autoGenerated: false
  #     authClients: false
  #     # existingSecret: redis-crt
  #     # certFilename: "tls-combined.pem"
  #     # certKeyFilename: "tls.key"
  #     # certCAFilename: "ca.crt"
  #   usernames:
  #     admin: admin
  #   master:
  #     resourcesPreset: nano
  #     persistence:
  #       enabled: false
  #     containerPorts:
  #       redis: 6379
  #   metrics:
  #     image: 
  #         registry: public.ecr.aws
  #     enabled: true
  #     serviceMonitor:
  #       enabled: true

  ################## ACTIVEMQ ##################
  activemq:
    enabled: true
    replicas: 1
    fullnameOverride: "activemq"
    image:
      registry: docker.io

  ################## MONGODB ##################
  # This default configuration is intended for a development/test cluster
  # Sharding is not supported yet
  # Please check Percona's MongoDB Helm chart documentation @ https://github.com/percona/percona-helm-charts/tree/main/charts/psmdb-db
  mongodb:
    enabled: true
    sharding:
      enabled: false
    backup:
      enabled: false
    replsets:
      rs0:
        size: 1
    #existingConfigmap: "mongodb-armonik-scripts"
    tls:
      mode: preferTLS
      allowInvalidCertificates: true
      # issuerConf:
      #   name: armonik-selfsigned-issuer
      #   kind: ClusterIssuer
      #   group: cert-manager.io
    unsafeFlags:
      replsetSize: true
      tls: true
    finalizers: []

  # KEDA moved to charts/armonik-operators (config at operators.keda.*; install/use via
  # global.armonik.operators.keda.{deploy,available}).

  # cert-manager moved to charts/armonik-operators (config at operators.cert-manager.*; install/use
  # via global.armonik.operators.certManager.{deploy,available}).

  ################## GRAFANA ##################
  grafana:
    image:
        registry: docker.io
    enabled: true
    serviceMonitor:
      enabled: true
    fullnameOverride: "grafana"
    grafana.ini:
      server:
        # Keep root_url path-less and serve_from_sub_path false: the ingress publishes Grafana
        # under a prefix it injects itself (armonik-ingress templates/configmaps/nginx.yaml),
        # which needs an empty appSubUrl. Enforced by armonik/templates/validate.yaml.
        domain: grafana.local
        root_url: http://grafana
        serve_from_sub_path: false
      auth.anonymous:
        enabled: true
    sidecar:
      dashboards:
        enabled: true
        folderAnnotation: "grafana_dashboard_folder"
        label: "grafana_dashboard"
        # -- Namespaces the sidecar watches: this release's plus `global.armonik.monitoring.namespace`,
        # where kps renders the standard k8s/node dashboards (the sidecar sees only its own by default;
        # `rbac.namespaced=false` already grants the cluster-wide read).
        # Beware `helm upgrade --reuse-values`: it replays the old coalesced values, where the grafana
        # chart's own `searchNamespace: null` beats this default. Pass values explicitly.
        searchNamespace:
          - '{{ include "armonik.monitoring.dashboardNamespaces" . }}'
      datasources:
        enabled: true

  ################## FLUENT-BIT ##################
  fluent-bit:
    enabled: true
    fullnameOverride: "fluent-bit"
    daemonSetVolumes:
      - name: runlogjournal
        hostPath:
          path: /run/log/journal
          type: ''
      - name: dmesg
        hostPath:
          path: /var/log/dmesg
          type: ''
      - name: varlog
        hostPath:
          path: /var/log
          type: ''
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
          type: ''
    daemonSetVolumeMounts:
      - name: runlogjournal
        readOnly: true
        mountPath: /run/log/journal
      - name: dmesg
        readOnly: true
        mountPath: /var/log/dmesg
      - name: varlog
        readOnly: true
        mountPath: /var/log
      - name: varlibdockercontainers
        readOnly: true
        mountPath: /var/lib/docker/containers

    config:
            # Parsers_File  /fluent-bit/etc/parsers.conf
      service: |
        [SERVICE]
            Daemon        Off
            Flush         1
            Log_Level     info
            Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020
            Health_Check  On
      inputs: |
        [INPUT]
            Name               tail
            Tag                kube.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log
            Parser             cri
            Docker_Mode        On
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
        [INPUT]
            Name               tail
            Tag                application.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log, /var/log/containers/*ingress*.log, /var/log/containers/mongodb*.log, /var/log/containers/keda*.log
            Parser             cri
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
      filters: |
        [FILTER]
            Name                kubernetes
            Match               *
            Kube_URL            https://kubernetes.default.svc:443
            Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
            Kube_Tag_Prefix     kube.var.log.containers.
            Merge_Log           On
            Merge_Log_Trim      On
            Merge_Parser        json
            Keep_Log            Off
            Annotations         On
            Labels              On
            K8S-Logging.Parser  On
            K8S-Logging.Exclude Off
            Buffer_Size         0
        [FILTER]
            Name                    nest
            Match                   *
            Operation               lift
            Nested_under            kubernetes
            Add_prefix              kubernetes_
        [FILTER]
            Name                    modify
            Match                   *
            Condition               Key_exists log
            Rename                  log @m
            Add                     sourcetype renamelog
      outputs: |
        [OUTPUT]
            Name                    http
            Match                   kube.*
            Host                    seq
            Port                    5341
            URI                     /api/events/raw?clef
            Header                  Content-Type application/vnd.serilog.clef
            Format                  json_lines
            json_date_key           @t
            json_date_format        iso8601
        [OUTPUT]
            Name                    stdout
            Match                   kube.*
      customParsers: |
        [PARSER]
            Name   json
            Format json
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        [PARSER]
            Name cri
            Format regex
            Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
            Time_Keep On

    # Regex ^(?:(?<time>[^\s]+)\s+(?<stream>\w+)\s+(?<logtag>\w+)\s+)?(?<log>\{.*\})$
