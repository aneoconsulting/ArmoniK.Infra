{{- $networkPolicyEnabled := list .Values "networkPolicy" "enabled"
    | include "armonik.utils.index"
    | default false
-}}

{{- if $networkPolicyEnabled }}

{{/*
  MongoDB operator NetworkPolicy.
*/}}

{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "mongodb-operator"
      "config" (include "armonik.netpol.mongodbOperator" . | fromYaml)
  ) }}

{{/*
  MongoDB server NetworkPolicy.
*/}}

{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "mongodb-server"
      "config" (include "armonik.netpol.mongodbServer" . | fromYaml)
  ) }}
{{- end }}
