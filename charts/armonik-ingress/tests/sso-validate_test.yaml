suite: sso validation guards
templates:
  - validate.yaml
values:
  - ../ci/sso-values.yaml
tests:
  - it: accepts the user-mode fixture
    asserts:
      - notFailedTemplate: {}

  - it: accepts the group-mode fixture
    values:
      - ../ci/sso-group-values.yaml
    asserts:
      - notFailedTemplate: {}

  - it: requires publicUrl
    set:
      sso:
        publicUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.publicUrl is required when sso.enabled'

  - it: requires the issuer URL
    set:
      sso:
        oauth2Proxy:
          issuerUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.issuerUrl is required when sso.enabled'

  - it: requires the client id
    set:
      sso:
        oauth2Proxy:
          clientId: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.clientId is required when sso.enabled'

  - it: requires the Secret
    set:
      sso:
        oauth2Proxy:
          existingSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.existingSecret is required when sso.enabled'

  - it: requires an image tag
    set:
      sso:
        oauth2Proxy:
          image:
            tag: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.image.tag is required when sso.enabled'

  - it: refuses a floating image tag
    set:
      sso:
        oauth2Proxy:
          image:
            tag: latest
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.image.tag must be an exact version tag'

  - it: refuses a tag without the CVE-2026-34457 fix
    set:
      sso:
        oauth2Proxy:
          image:
            tag: v7.15.1
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.image.tag "v7.15.1" is older than v7.15.2'

  - it: accepts a suffixed tag at the minimum version
    set:
      sso:
        oauth2Proxy:
          image:
            tag: v7.15.2-alpine
    asserts:
      - notFailedTemplate: {}

  - it: refuses a publicUrl with a path
    set:
      sso:
        publicUrl: https://example.com/armonik
    asserts:
      - failedTemplate:
          errorPattern: 'sso.publicUrl must be scheme://host\[:port\]'

  - it: refuses a non-http issuer
    set:
      sso:
        oauth2Proxy:
          issuerUrl: idp.example.com
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.issuerUrl must be an http or https URL'

  - it: refuses an unknown identity mode
    set:
      sso:
        identityMode: role
    asserts:
      - failedTemplate:
          errorPattern: 'sso.identityMode must be user or group, got "role"'

  - it: refuses an unknown identity claim
    set:
      sso:
        identityClaim: sub
    asserts:
      - failedTemplate:
          errorPattern: 'sso.identityClaim must be email, preferred_username or user, got "sub"'

  - it: refuses an empty fingerprint
    set:
      sso:
        fingerprint: ""
    asserts:
      - failedTemplate:
          errorPattern: 'sso.fingerprint must be non-empty'

  - it: refuses an unsafe fingerprint
    set:
      sso:
        fingerprint: 'a"; add_header x y'
    asserts:
      - failedTemplate:
          errorPattern: 'sso.fingerprint may only hold'

  - it: refuses an unsafe CN prefix
    set:
      sso:
        cnPrefix: "sso $"
    asserts:
      - failedTemplate:
          errorPattern: 'sso.cnPrefix may only hold'

  - it: refuses an unsafe group CN prefix
    set:
      sso:
        groupCnPrefix: "g;"
    asserts:
      - failedTemplate:
          errorPattern: 'sso.groupCnPrefix may only hold'

  - it: requires a group mapping in group mode
    set:
      sso:
        identityMode: group
    asserts:
      - failedTemplate:
          errorPattern: 'sso.groupMapping must list at least one'

  - it: requires a group and a cn on every mapping entry
    set:
      sso:
        identityMode: group
        groupMapping:
          - group: admins
            cn: admins
          - group: users
    asserts:
      - failedTemplate:
          errorPattern: 'sso.groupMapping\[1\] needs a non-empty group and cn'

  - it: refuses a group name that would break the nginx map
    set:
      sso:
        identityMode: group
        groupMapping:
          - group: 'a"b'
            cn: x
    asserts:
      - failedTemplate:
          errorPattern: 'sso.groupMapping\[0\].group may not contain'

  - it: refuses an unsafe mapped cn
    set:
      sso:
        identityMode: group
        groupMapping:
          - group: admins
            cn: "a b"
    asserts:
      - failedTemplate:
          errorPattern: 'sso.groupMapping\[0\].cn may only hold'

  - it: refuses a health path colliding with a served route
    set:
      sso:
        healthPath: /admin
    asserts:
      - failedTemplate:
          errorPattern: 'sso.healthPath must be a single path segment'

  # oauth2-proxy refuses to start with both (pkg/validation/sessions.go).
  - it: refuses a cookie refresh with a minimal session cookie
    set:
      sso:
        oauth2Proxy:
          cookieRefresh: 1h
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.cookieRefresh must be 0 with sso.oauth2Proxy.sessionCookieMinimal, got "1h"'

  - it: accepts any zero refresh with a minimal session cookie
    set:
      sso:
        oauth2Proxy:
          cookieRefresh: 0s
    asserts:
      - notFailedTemplate: {}

  - it: accepts a cookie refresh once sessionCookieMinimal is off
    set:
      sso:
        oauth2Proxy:
          sessionCookieMinimal: false
          cookieRefresh: 1h
    asserts:
      - notFailedTemplate: {}

  - it: refuses a malformed duration
    set:
      sso:
        oauth2Proxy:
          cookieExpire: 8 hours
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.cookieExpire must be a duration such as 8h or 30m, or 0, got "8 hours"'

  - it: refuses a non-boolean sessionCookieMinimal
    set:
      sso:
        oauth2Proxy:
          sessionCookieMinimal: "yes"
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.sessionCookieMinimal must be true or false'

  - it: refuses the health check User-Agent flags (CVE-2026-34457)
    set:
      sso:
        oauth2Proxy:
          extraArgs: [--gcp-healthchecks]
    asserts:
      - failedTemplate:
          errorPattern: 'extraArgs: "--gcp-healthchecks" is refused'

  - it: refuses --ping-user-agent in its = form too
    set:
      sso:
        oauth2Proxy:
          extraArgs: [--ping-user-agent=probe]
    asserts:
      - failedTemplate:
          errorPattern: 'extraArgs: "--ping-user-agent=probe" is refused'

  - it: refuses gateway mode
    set:
      gateway:
        enabled: true
        gatewayClassName: example
    asserts:
      - failedTemplate:
          errorPattern: 'sso.enabled is not supported with gateway mode yet: the HTTPRoute routes gRPC by an exact content-type match'

  - it: refuses an HTTPRoute on a shared Gateway
    set:
      httpRoute:
        enabled: true
        parentRefs:
          - name: shared
    asserts:
      - failedTemplate:
          errorPattern: 'sso.enabled is not supported with gateway mode yet'

  - it: requires an HTTP HealthCheckPolicy to probe the health path
    set:
      healthCheckPolicy:
        enabled: true
        default:
          config:
            type: HTTP
            httpHealthCheck:
              requestPath: /admin/
    asserts:
      - failedTemplate:
          errorPattern: 'healthCheckPolicy.default.config.httpHealthCheck.requestPath must be sso.healthPath \(/healthz\)'

  - it: accepts an HTTP HealthCheckPolicy on the health path, and a TCP one
    set:
      healthCheckPolicy:
        enabled: true
        default:
          config:
            type: HTTP
            httpHealthCheck:
              requestPath: /healthz
    asserts:
      - notFailedTemplate: {}

  - it: requires the IdP CIDRs once the NetworkPolicy is on
    set:
      networkPolicy:
        enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'sso.networkPolicy.idpEgressCidrs must list the IdP'

  - it: refuses a malformed CIDR
    set:
      sso:
        networkPolicy:
          idpEgressCidrs: [example.com]
    asserts:
      - failedTemplate:
          errorPattern: 'sso.networkPolicy.idpEgressCidrs: "example.com" is not a CIDR'

  - it: needs ESO for an external store
    set:
      global:
        armonik:
          operators:
            externalSecrets:
              deploy: false
              available: false
      sso:
        oauth2Proxy:
          externalSecret:
            storeName: vault
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.externalSecret.storeName needs global.armonik.operators.externalSecrets.available'

  - it: needs both remote keys with an external store
    set:
      sso:
        oauth2Proxy:
          externalSecret:
            storeName: vault
            clientSecret:
              key: armonik/oauth2-proxy
    asserts:
      - failedTemplate:
          errorPattern: 'sso.oauth2Proxy.externalSecret.cookieSecret.key is required'
