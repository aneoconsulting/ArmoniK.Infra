  fluent-bit:
    enabled: true
    fullnameOverride: "fluent-bit"
    daemonSetVolumes:
      - name: runlogjournal
        hostPath:
          path: /run/log/journal
          type: ''
      - name: dmesg
        hostPath:
          path: /var/log/dmesg
          type: ''
      - name: varlog
        hostPath:
          path: /var/log
          type: ''
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
          type: ''
    daemonSetVolumeMounts:
      - name: runlogjournal
        readOnly: true
        mountPath: /run/log/journal
      - name: dmesg
        readOnly: true
        mountPath: /var/log/dmesg
      - name: varlog
        readOnly: true
        mountPath: /var/log
      - name: varlibdockercontainers
        readOnly: true
        mountPath: /var/lib/docker/containers

    config:
            # Parsers_File  /fluent-bit/etc/parsers.conf
      service: |
        [SERVICE]
            Daemon        Off
            Flush         1
            Log_Level     info
            Parsers_File  /fluent-bit/etc/conf/custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020
            Health_Check  On
      inputs: |
        [INPUT]
            Name               tail
            Tag                kube.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log
            Parser             cri
            Docker_Mode        On
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
        [INPUT]
            Name               tail
            Tag                application.*
            Path               /var/log/containers/*control-plane*.log, /var/log/containers/*compute-plane*.log, /var/log/containers/*ingress*.log, /var/log/containers/mongodb*.log, /var/log/containers/keda*.log
            Parser             cri
            Buffer_Chunk_Size  512KB
            Buffer_Max_Size    5M
            Rotate_Wait        30
            Mem_Buf_Limit      30MB
            Skip_Long_Lines    Off
            Refresh_Interval   10
            Read_from_Head     On
      filters: |
        [FILTER]
            Name                kubernetes
            Match               *
            Kube_URL            https://kubernetes.default.svc:443
            Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
            Kube_Tag_Prefix     kube.var.log.containers.
            Merge_Log           On
            Merge_Log_Trim      On
            Merge_Parser        json
            Keep_Log            Off
            Annotations         On
            Labels              On
            K8S-Logging.Parser  On
            K8S-Logging.Exclude Off
            Buffer_Size         0
        [FILTER]
            Name                    nest
            Match                   *
            Operation               lift
            Nested_under            kubernetes
            Add_prefix              kubernetes_
        [FILTER]
            Name                    modify
            Match                   *
            Condition               Key_exists log
            Rename                  log @m
            Add                     sourcetype renamelog
      outputs: |
        [OUTPUT]
            Name                    http
            Match                   kube.*
            Host                    seq
            Port                    5341
            URI                     /api/events/raw?clef
            Header                  Content-Type application/vnd.serilog.clef
            Format                  json_lines
            json_date_key           @t
            json_date_format        iso8601
        [OUTPUT]
            Name                    stdout
            Match                   kube.*
      customParsers: |
        [PARSER]
            Name   json
            Format json
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        [PARSER]
            Name cri
            Format regex
            Regex ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
            Time_Key time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
            Time_Keep On

    # Regex ^(?:(?<time>[^\s]+)\s+(?<stream>\w+)\s+(?<logtag>\w+)\s+)?(?<log>\{.*\})$
