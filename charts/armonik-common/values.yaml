# Library chart: renders nothing, takes no configuration of its own. What it owns is the single
# definition of the cross-chart `global.armonik` defaults below, which each root chart lifts with
# `import-values: [{child: global.armonik, parent: global.armonik}]` on its armonik-common dependency,
# globals not propagating upward on their own. Precedence holds per key: these < the root chart's
# values.yaml < user -f/--set. import-values copies chart-file values only, which is what makes it right
# here (nobody configures this chart) and unusable for propagating a dependency's user-set values, which
# it would silently drop.
# Only what must be identical across charts belongs here.
#
# values.schema.json type-checks these globals for every chart depending on this one: helm validates a
# library chart's schema against its subchart values, which carry the coalesced `global`. It ships inside
# the vendored archive, so re-run charts/update-charts.sh after editing it.
global:
  armonik:
    # Cross-chart operator control (see charts/armonik-operators), per operator:
    #   deploy    - THIS release installs the operator + CRDs; gates the armonik-operators subchart
    #               conditions and the CRD-ordering hooks on the CRs we emit.
    #   available - the CRDs exist, from here or another release -> emit CRs.
    #   namespace - where the operator runs, for consumers deriving hostnames from it. Defaults to this
    #               release's namespace when this release deploys it, else empty, meaning "not stated":
    #               that is a render error for anything that needs it. Set it for an externally installed
    #               operator, or when a subchart's own namespaceOverride moves it (the umbrella guards
    #               against the two disagreeing).
    # Default = consume operators installed elsewhere; the umbrella overrides deploy=true.
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.externalSecrets.deploy | empty | ternary "" .Release.Namespace }}'
      keda:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.keda.deploy | empty | ternary "" .Release.Namespace }}'
      certManager:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.certManager.deploy | empty | ternary "" .Release.Namespace }}'
      mongodbOperator:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.mongodbOperator.deploy | empty | ternary "" .Release.Namespace }}'
      prometheusOperator:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.prometheusOperator.deploy | empty | ternary "" .Release.Namespace }}'
      googleCasIssuer:
        deploy: false
        available: true
        namespace: '{{ .Values.global.armonik.operators.googleCasIssuer.deploy | empty | ternary "" .Release.Namespace }}'
    # Shared cert-manager issuer Certificates reference by default.
    certManager:
      issuer:
        enabled: false
        name: '{{.Release.Name}}-shared-issuer'
        # -- issuerRef.kind; an external issuer kind is valid too.
        # @default -- `Issuer`
        kind:
        # -- issuerRef.group.
        # @default -- `cert-manager.io`
        group:
    monitoring:
      # -- Prometheus for the Grafana datasource and PromQL KEDA triggers. Defaults to the
      # `armonik.monitoring.prometheusUrl.default` derivation; a literal URL replaces it.
      prometheusUrl: '{{ include "armonik.monitoring.prometheusUrl.default" . }}'
      # -- Control-plane metrics-exporter `/metrics` scraped by KEDA (default scaling path). Defaults to
      # the `armonik.monitoring.metricsExporterUrl.default` derivation off `conf.source`; a literal URL replaces it.
      metricsExporterUrl: '{{ include "armonik.monitoring.metricsExporterUrl.default" . }}'
    # Default tag of an image that sets none, keyed on the repository rather than the values slot:
    # a worker's identity is only known at render time. Components mirror ArmoniK's release trains
    # (armonik_versions in versions.tfvars.json), plus one per chart whose AppVersion is its image's.
    # -- Version per component. Empty or absent means the AppVersion of the chart deploying the image,
    # keeping core and gui in lockstep with the charts. The rest release separately and need reviewing
    # per ArmoniK release.
    versions:
      core: ""
      gui: ""
      infraPlugins: "0.3.2"
      extCsharp: "0.22.0"
      extCpp: "0.5.4"
      extJava: "0.1.4"
      activemq: ""
    # -- Component each image repository belongs to. Registering one gives it a default tag; leaving it
    # out makes the tag required, the safer default for a user-supplied image.
    imageComponents:
      dockerhubaneo/armonik_control: core
      dockerhubaneo/armonik_control_metrics: core
      dockerhubaneo/armonik_pollingagent: core
      dockerhubaneo/armonik_core_stream_test_worker: core
      dockerhubaneo/armonik_core_htcmock_test_worker: core
      dockerhubaneo/armonik_core_bench_test_worker: core
      dockerhubaneo/armonik_admin_app: gui
      dockerhubaneo/armonik_load_balancer: infraPlugins
      dockerhubaneo/armonik-dynamic-dotnet-worker: extCsharp
      dockerhubaneo/armonik-sdk-cpp-dynamicworker: extCpp
      dockerhubaneo/armonik-dynamic-java-worker: extJava
      apache/activemq: activemq
    # Declared, not defaulted: null documents the key without joining the precedence chain. Each
    # resolves in charts/armonik/values.yaml, else in the helper named below.
    # -- Root dir for conf mount Secrets in pods.
    # @default -- `/mounts`, from `armonik.conf.mountPath`
    mountPath:
    # -- Release owning the conf Secrets a child reads, as `<source>-conf-<layer>`.
    # @default -- `.Release.Name`, from `armonik.conf.source`
    source:
    # -- Release name of the control plane, for its URL. Only needed when it is its own release.
    # @default -- `.Release.Name`, from `armonik.controlPlane.source`
    controlPlane:
  # Ours, outside `global.armonik`, which is all `import-values` lifts: a default here would reach no
  # root chart, so each consumer resolves its own.
  # -- Cluster DNS domain. Empty stops hostnames at `.svc`.
  # @default -- `cluster.local`, from `armonik.clusterDomain`
  clusterDomain:
  # -- Surfaced by the admin GUI. armonik-ingress reads both fields and defaults neither.
  environment:
    name:
    description:
  # -- Appended to every ArmoniK pod spec, after the chart- and component-level ones.
  imagePullSecrets:
  # -- Overrides every image's own registry, ours and the dependencies'.
  imageRegistry:
