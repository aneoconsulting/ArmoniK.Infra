{{- $tls := .Values.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- if and ($tls.enabled | empty | not) (eq $tls.type "cert-manager") }}
{{- $globalIssuer := include "armonik.certManager.issuer" $ | fromYaml }}
{{- $localEnabled := (list $certManager "existingIssuer" "enabled" | include "armonik.utils.index") | empty | not }}
{{- $useGlobal := and $globalIssuer.enabled (not $localEnabled) }}
{{- $existingIssuer := or $localEnabled $useGlobal }}
{{- if and (not (dig "armonik" "operators" "certManager" "available" true .Values.global)) (not $existingIssuer) }}
{{- fail "activemq TLS via cert-manager requires it: set global.armonik.operators.certManager.available=true, set tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or use a tls.type other than cert-manager." }}
{{- end }}
{{- if not $existingIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  annotations:
    {{- if dig "armonik" "operators" "certManager" "deploy" false .Values.global }}
    {{- /* CRD-ordering hook only when THIS release installs cert-manager; external/absent -> no hook.
           Weight 0 keeps the Issuer ahead of the Certificate below, hooked at weight 10. */}}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    {{- end }}
    {{- with .Values.additionalAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "activemq.fullname" . }}-issuer
  namespace: {{ include "activemq.namespace" . | quote }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "activemq.fullname" . }}
  namespace: {{ include "activemq.namespace" . | quote }}
  {{- if dig "armonik" "operators" "certManager" "deploy" false .Values.global }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  commonName: {{ include "activemq.fullname" . }}
  dnsNames:
  - {{ include "activemq.fullname" . }}.{{ include "activemq.namespace" . }}
  - {{ include "activemq.fullname" . }}.{{ include "activemq.namespace" . }}.svc
  - {{ include "activemq.fullname" . }}.{{ include "activemq.namespace" . }}.svc.{{ $tls.clusterDomain }}
  secretName: {{ include "activemq.fullname" . }}
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  {{- with $certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with $certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  issuerRef:
    {{- if $localEnabled }}
    name: {{ list $certManager "existingIssuer" "name" | include "armonik.utils.index" }}
    kind: {{ list $certManager "existingIssuer" "kind" | include "armonik.utils.index" | default "Issuer" }}
    group: {{ list $certManager "existingIssuer" "group" | include "armonik.utils.index" | default "cert-manager.io" }}
    {{- else if $useGlobal }}
    name: {{ $globalIssuer.name }}
    kind: {{ $globalIssuer.kind }}
    group: {{ $globalIssuer.group }}
    {{- else }}
    name: {{ include "activemq.fullname" . }}-issuer
    kind: Issuer
    group: cert-manager.io
    {{- end }}
  additionalOutputFormats:
    - type: CombinedPEM
{{- end }}
