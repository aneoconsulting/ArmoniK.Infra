# Escape hatches: the additive extra* values and the podSpec/container patches.
extraVolumes:
  - name: scratch
    emptyDir: {}
extraVolumeMounts:
  - name: scratch
    mountPath: /scratch
extraEnv:
  - name: CONTROL_LOCAL
    value: "1"
extraEnvFrom:
  - configMapRef:
      name: control-extra
      optional: true
extraInitContainers:
  - name: warmup
    image: busybox:0.0.0-test
    command: ["/bin/sh", "-c", "true"]
extraContainers:
  - name: debug
    image: busybox:0.0.0-test
    command: ["/bin/sh", "-c", "sleep infinity"]
containerPatch:
  imagePullPolicy: Always
  # A nested scalar the chart does build: deep-merges, siblings survive.
  startupProbe:
    failureThreshold: 40
podSpecPatch:
  # A key the chart does not build at all.
  hostAliases:
    - ip: "10.0.0.1"
      hostnames: ["legacy.internal"]
  # A scalar the chart does build: the patch wins.
  shareProcessNamespace: true

# The metrics-exporter and the init Job carry their own patches and extras.
init:
  enabled: true
  extraEnv:
    - name: INIT_LOCAL
      value: "1"
  extraVolumes:
    - name: init-scratch
      emptyDir: {}
  extraVolumeMounts:
    - name: init-scratch
      mountPath: /scratch
  extraInitContainers:
    - name: init-warmup
      image: busybox:0.0.0-test
      command: ["/bin/sh", "-c", "true"]
  containerPatch:
    imagePullPolicy: Always
  podSpecPatch:
    hostAliases:
      - ip: "10.0.0.2"
        hostnames: ["init.internal"]

metricsExporter:
  extraEnv:
    - name: EXPORTER_LOCAL
      value: "1"
  extraEnvFrom:
    - configMapRef:
        name: exporter-extra
        optional: true
  extraVolumes:
    - name: exporter-scratch
      emptyDir: {}
  extraVolumeMounts:
    - name: exporter-scratch
      mountPath: /scratch
  extraContainers:
    - name: exporter-debug
      image: busybox:0.0.0-test
      command: ["/bin/sh", "-c", "sleep infinity"]
  containerPatch:
    # A nested scalar the chart does build: deep-merges, siblings survive.
    startupProbe:
      failureThreshold: 40
  podSpecPatch:
    shareProcessNamespace: true
