global:
  imageRegistry: ""
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: activemq
namespaceOverride: ""

HorizontalPodAutoscaler:
  enabled: false

image:
  repository: apache
  name: activemq
  tag: 6.3.1
  pullPolicy: IfNotPresent
  imagePullSecrets: []
  registry: ""

serviceAccount:
  create: false
  name: activemq-serviceaccount
  annotations: {}
  secrets: []

activemqOptsMemory: "-Xms1g -Xmx1g"

extraEnv: []
# -- Extra envFrom for the activemq container.
extraEnvFrom: []
# -- Extra containers, after the activemq container, and extra init containers.
extraContainers: []
extraInitContainers: []
# containerPatch:
#   securityContext:
#     readOnlyRootFilesystem: true
#
# -- Merged over the activemq container, last. Lists the chart builds are refused: use extra*.
containerPatch: {}
# podSpecPatch:
#   hostAliases:
#     - ip: "10.0.0.1"
#       hostnames: ["legacy.internal"]
#
# -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
# Pod labels are out of reach: the selector is immutable.
podSpecPatch: {}
  # - name: ACTIVEMQ_ENABLE_SCHEDULER
  #   value: "true"

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Note: PodSecurityPolicy will not be created when Kubernetes version is 1.25 or later.
  pspEnabled: false

commonLabels:
  app: storage
  service: activemq
  type: queue
podLabels: {}
podAnnotations: {}

podSecurityContext: {}

securityContext: {}

priorityClassName: system-cluster-critical

containerPort:
  amqp: 5672
  dashboard: 8161

hostNetwork:
  enabled: false

replicas: 1

revisionHistoryLimit:

updateStrategy: {}
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 0
#     maxUnavailable: 1

podDisruptionBudget:
  # https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  enabled: false
  minAvailable:
  maxUnavailable:

args: []

service:
  type: ClusterIP
  port:
    amqp: 5672
    dashboard: 8161
  annotations: {}
  labels: {}
  #  Add these labels to have metrics-server show up in `kubectl cluster-info`
  #  kubernetes.io/cluster-service: "true"
  #  kubernetes.io/name: "Metrics-server"

# See https://github.com/kubernetes-sigs/metrics-server#scaling
resources:
  requests:
    cpu: 100m
    memory: 200Mi
  # limits:
  #   cpu:
  #   memory:

extraVolumeMounts:
  # - mountPath: /credentials/
  #   mountPropagation: None
  #   name: activemq-storage-secret-volume
  #   readOnly: true
  # Single-file overrides: mounting the whole conf/ directory would hide the rest of
  # the image's own conf/ tree (jetty-spring.xml, conf/jetty/*.xml, login.config,
  # users.properties, ...), which this ActiveMQ version still needs to start.
  - mountPath: /opt/apache-activemq/conf/activemq.xml
    subPath: activemq.xml
    mountPropagation: None
    name: activemq-conf-xml
    readOnly: true
  - mountPath: /opt/apache-activemq/conf/log4j2.properties
    subPath: log4j2.properties
    mountPropagation: None
    name: activemq-conf-xml
    readOnly: true
  - mountPath: /opt/apache-activemq/conf/jolokia-access.xml
    subPath: jolokia-access.xml
    mountPropagation: None
    name: activemq-jolokia-xml
    readOnly: true

extraVolumes:
  # - name: activemq-tls-volume
  #   secret:
  #     defaultMode: 420
  #     optional: false
  #     secretName: activemq   # cert Secret from certificate.yaml (when tls.type=cert-manager)
  - configMap:
      defaultMode: 420
      name: activemq-configs
      optional: false
    name: activemq-conf-xml
  - configMap:
      defaultMode: 420
      name: activemq-jolokia-configs
      optional: false
    name: activemq-jolokia-xml

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

dnsConfig: {}

# Annotations to add to the deployment
deploymentAnnotations: {}

schedulerName: ""

tmpVolume:
  emptyDir: {}

tls:
  # Enable TLS certificate management for activemq (only takes effect when tls.type is "cert-manager").
  enabled: false
  type: "cert-manager"
  clusterDomain: cluster.local
  certManager:
    addInjectorAnnotations: true
    existingIssuer:
      # Use an existing cert-manager issuer
      enabled: false
      # Kind of the existing cert-manager issuer
      kind: "Issuer"
      # Name of the existing cert-manager issuer
      name: "my-issuer"
      group: ""
    # Set the requested duration (i.e. lifetime) of the Certificate.
    # See https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec
    duration: ""
    # How long before the currently issued certificate’s expiry cert-manager should renew the certificate.
    # See https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec
    renewBefore: ""
    # Add extra annotations to the Certificate resource
    annotations: {}
    # Add extra labels to the Certificate resource
    labels: {}

networkPolicy:
  enabled: false
  extraIngressRules: []
  extraEgressRules: []
