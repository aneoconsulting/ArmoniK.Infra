{{- /* Rejects deploy=true with available=false: installed but unusable. Lives in the umbrella
       because that is where the CRs available gates are emitted. Renders nothing. */ -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- range $op, $cfg := $ops -}}
{{- if and $cfg.deploy (not $cfg.available) -}}
{{- fail (printf "global.armonik.operators.%s: deploy=true but available=false (operator would be installed but unusable). Set available=true, or deploy=false to only consume an externally-installed operator." $op) -}}
{{- end -}}
{{- end -}}
