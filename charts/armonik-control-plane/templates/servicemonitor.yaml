{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $me := .Values.metricsExporter | default dict }}
{{- $svc := $me.service | default dict }}
{{- if and $me.enabled $ops.prometheusOperator.available }}
{{/* Metrics-exporter metrics, armonik_<partition>_tasks_queued included, for the shared cluster Prometheus. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-metrics-exporter" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: metrics-exporter
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "armonik.namespace" . | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics-exporter
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  {{/* Release labels on every series, so a shared Prometheus keeps releases apart under one job name. */}}
  targetLabels:
    - app.kubernetes.io/instance
    - armonik.fr/deployment
  endpoints:
    - port: {{ $svc.name | quote }}
      path: /metrics
      {{/* Fixed job name the bundled Grafana dashboards query, instead of the Service name. */}}
      relabelings:
        - targetLabel: job
          replacement: metrics-exporter
{{- end }}
