suite: existing ServiceAccount tests
release:
  name: t
templates:
  - deployments/control-plane.yaml
  - deployments/metrics-exporter.yaml
  - jobs/init.yaml
tests:
  - it: creates and uses its own ServiceAccount when create is true (default)
    set:
      serviceAccount:
        create: true
    template: deployments/control-plane.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: control-plane
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
  - it: uses an existing ServiceAccount name when create is false and a name is given
    set:
      serviceAccount:
        create: false
        name: my-existing-sa
    template: deployments/control-plane.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-existing-sa
  - it: fails when create is false and no ServiceAccount name is given
    set:
      serviceAccount:
        create: false
        name: ""
    template: deployments/metrics-exporter.yaml
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name is required when serviceAccount.create is false"
