apiVersion: v2
name: armonik-ingress
description: A Helm chart for Ingress
icon: https://25070129.fs1.hubspotusercontent-eu1.net/hubfs/25070129/Website/Images%20-%20Website/ArmoniK/logo_armonik_by_aneo%201.svg
kubeVersion: ">=v1.25.0-0"
keywords:
  - armonik
  - helm
type: application
version: 0.1.0
# renovate: datasource=github-releases depName=aneoconsulting/ArmoniK.Admin.GUI extractVersion=^v(?<version>.*)$
appVersion: "0.15.4"
sources:
  - https://github.com/aneoconsulting/ArmoniK.Infra
maintainers:
  - name: Aneo
    email: armonik@aneo.fr
    url: armonik.fr

dependencies:
  - name: armonik-common
    version: 0.1.x
    repository: file://../armonik-common
    # Cross-chart global.armonik defaults, defined once in armonik-common/values.yaml.
    import-values:
      - child: global.armonik
        parent: global.armonik
