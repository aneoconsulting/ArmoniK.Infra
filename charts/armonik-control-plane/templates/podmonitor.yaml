{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- if $ops.prometheusOperator.available }}
{{/* Control-plane pod metrics (1081). */}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-control-plane" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: control-plane
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "armonik.namespace" . | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  {{/* Release labels on every series, as on the metrics-exporter ServiceMonitor and compute-plane PodMonitor. */}}
  podTargetLabels:
    - app.kubernetes.io/instance
    - armonik.fr/deployment
  podMetricsEndpoints:
    - port: metrics-port
      path: /metrics
      {{/* Job name of the Terraform scrape config (monitoring/onpremise/prometheus), so its queries carry over. */}}
      relabelings:
        - targetLabel: job
          replacement: metrics-control-plane
{{- end }}
