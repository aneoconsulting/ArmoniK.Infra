name: Approval freshness push relay

# Only a trigger: a rewritten branch changes the diff of the pull requests based
# on it without sending them any event. A fast-forward keeps their merge base,
# so only forced pushes are relayed.

on:
  push:
    branches:
      - "**"

permissions: {}

jobs:
  relay:
    name: approval-freshness-push-relay
    if: github.event.forced
    runs-on: ubuntu-latest
    steps:
      - name: Relay
        env:
          REF: ${{ github.ref }}
        run: echo "Forced push to ${REF}"
