{{- $egressRules := include "armonik.netpol.egressRulesFromServices" (list . .Values.networkPolicy.egress.services) | fromYamlArray -}}
{{- if .Values.networkPolicy.egress.dns.enabled }}
  {{- $egressRules = append $egressRules (include "armonik.netpol.dnsRule" .Values.networkPolicy.egress.dns | fromYaml) }}
{{- end }}

{{- $ingressRules := list (dict
      "from" (list
        (dict "podSelector" (dict "matchLabels" .Values.networkPolicy.ingress.computePlaneLabels))
        (dict
          "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" (.Values.networkPolicy.ingress.namespace | default (include "armonik.namespace" .))))
          "podSelector" (dict "matchLabels" .Values.networkPolicy.ingress.ingressLabels)))
      "ports" .Values.networkPolicy.ingress.ports) -}}

{{- $cfg := dict
      "enabled" .Values.networkPolicy.enabled
      "podSelector" .Values.networkPolicy.podSelector
      "policyTypes" (list "Ingress" "Egress")
      "ingress" (dict "rules" $ingressRules "extraRules" (.Values.networkPolicy.ingress.extraRules | default list))
      "egress" (dict "rules" $egressRules "extraRules" (.Values.networkPolicy.egress.extraRules | default list)) -}}

{{ include "armonik.netpol.render" (dict "context" . "config" $cfg "component" "control-plane") }}