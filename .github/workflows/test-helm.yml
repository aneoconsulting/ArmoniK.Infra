name: Helm chart tests
on:
  push:
    branches:
      - main
      - feat/revamp-helm
  pull_request:
    branches:
      - main
      - feat/revamp-helm
  workflow_dispatch:

env:
  HELM_VERSION: v3.18.4
  HELM_UNITTEST_VERSION: "1.1.2"
  KUBECONFORM_VERSION: "0.8.0"

jobs:
  deps:
    name: Vendor dependencies (freshness check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Cache helm repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm/repository
          key: helm-repo-${{ hashFiles('charts/*/Chart.lock', 'charts/*/Chart.yaml', 'test/harness/*/Chart.lock') }}
          restore-keys: helm-repo-

      # bare mode reproduces the committed Chart.lock files and fails when a
      # Chart.yaml drifted from its lock: this IS the freshness check.
      - name: Vendor chart dependencies from Chart.lock
        run: ./test/vendor.sh

      - name: Check lock files unchanged
        run: git diff --exit-code -- 'charts/*/Chart.lock' test/harness/common-harness/Chart.lock

      - name: Upload vendored archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendored-charts
          if-no-files-found: error
          retention-days: 1
          path: |
            charts/*/charts/*.tgz
            test/harness/common-harness/charts/*.tgz

  unittest:
    name: helm-unittest
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendored-charts
          path: .

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"

      - name: Run unit test suites
        run: ./test/unittest.sh

  template-matrix:
    name: Render matrix and kubeconform
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendored-charts
          path: .

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Run render matrix
        run: ./test/matrix.sh

  # A linter rather than a vulnerability scan: trivy matches each rendered
  # resource against its Kubernetes checks. The packaged archives are what
  # charts/scan-inputs.sh renders and traces back to the templates.
  chart-checks:
    name: Check the charts with trivy
    runs-on: ubuntu-latest
    needs: deps
    permissions:
      contents: read
    env:
      TRIVY_VERSION: v0.76.2
      TRIVY_DISABLE_TELEMETRY: "true"
      TRIVY_SKIP_VERSION_CHECK: "true"
      TRIVY_NO_PROGRESS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vendored-charts
          path: .

      - name: Package the charts
        run: ./charts/package-charts.sh -o dist

      # The runner image ships mikefarah yq v4, which the script checks.
      - name: Render the charts
        run: ./charts/scan-inputs.sh -d dist -o scan

      # Pinned by commit: the trivy-action and setup-trivy tags were
      # force-pushed to malicious commits in March 2026 (GHSA-69fq-xp46-6x23).
      - name: Set up trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Check the rendered charts
        run: |
          mkdir -p scan/reports
          trivy config --misconfig-scanners kubernetes \
            --format json --output scan/reports/charts.json scan/manifests

      # Templates link to the checked commit, the checked-out one.
      - name: Report
        run: |
          ./.github/scripts/trivy-charts-report.sh scan "$GITHUB_STEP_SUMMARY" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$(git rev-parse HEAD)"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-chart-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            scan/renders.tsv
            scan/documents.tsv
            scan/reports/misconfigurations.csv
