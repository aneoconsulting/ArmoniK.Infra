# Nothing renders until triggers is set.

# -- Name of the ScaledObject.
suffix: ""

# -- Workload to scale. It must be in the ScaledObject's namespace.
scaleTargetRef:
  # -- API version of the workload.
  apiVersion: "apps/v1"
  # -- Kind of the workload.
  kind: "Deployment"
  # -- Name of the workload. Required.
  name: ""
  # -- Container whose environment KEDA reads for trigger parameters (KEDA default: the first one).
  envSourceContainerName: ".spec.template.spec.containers[0]"

# -- Polling interval in seconds.
pollingInterval: 30
# -- Cooldown period in seconds.
cooldownPeriod: 300
# -- Idle replica count, below minReplicaCount. Not rendered: commented out in the template.
idleReplicaCount: 0
# -- Minimum replica count.
minReplicaCount: 1
# -- Maximum replica count.
maxReplicaCount: 100

# -- Fallback options. Not rendered: commented out in the template.
fallback:
  # -- Failures before falling back.
  failureThreshold: 3
  # -- Replica count on fallback.
  replicas: 6

# -- `advanced` options and the HPA scale-down behavior.
behavior:
  # -- Restore the workload's original replica count when the ScaledObject is deleted.
  restoreToOriginalReplicaCount: false
  # -- Scale-down stabilization window in seconds.
  stabilizationWindowSeconds: 300
  # -- Scale-down policy type: Percent or Pods.
  type: Percent
  # -- Scale-down policy value.
  value: 100
  # -- Scale-down policy period in seconds.
  periodSeconds: 15

# -- KEDA triggers, rendered as-is.
triggers: []
