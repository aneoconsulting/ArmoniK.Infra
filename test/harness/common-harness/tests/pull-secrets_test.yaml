suite: armonik.imagePullSecrets normalization
templates:
  - pull-secrets.yaml
tests:
  - it: concatenates the sources in order, skipping nil ones
    set:
      pullSecrets:
        - [{name: component}]
        - null
        - [{name: global}]
    asserts:
      - equal:
          path: data.result
          value: '[{"name":"component"},{"name":"global"}]'
  - it: takes Secret names as well as references
    set:
      pullSecrets:
        - [chart]
        - [{name: global}]
    asserts:
      - equal:
          path: data.result
          value: '[{"name":"chart"},{"name":"global"}]'
  - it: deduplicates by name across sources and forms, keeping the first position
    set:
      pullSecrets:
        - [{name: shared}, chart]
        - [global, shared, {name: chart}]
    asserts:
      - equal:
          path: data.result
          value: '[{"name":"shared"},{"name":"chart"},{"name":"global"}]'
  - it: renders nothing when every source is empty
    set:
      pullSecrets: [[], null]
    asserts:
      - equal:
          path: data.result
          value: '[]'
  - it: fails on a bare string source
    set:
      pullSecrets: [regcred]
    asserts:
      - failedTemplate:
          errorPattern: 'imagePullSecrets must be a list, got "regcred"'
  - it: fails on a reference naming no Secret
    set:
      pullSecrets:
        - [{secret: regcred}]
    asserts:
      - failedTemplate:
          errorPattern: 'imagePullSecrets entry \{"secret":"regcred"\} names no Secret'
