{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $mongo := .Values.dependencies.mongodb | default dict }}
{{- /* dependencies.mongodb.tls passes verbatim into the PerconaServerMongoDB spec.tls (psmdb-db
       templates/cluster.yaml), a structural schema: any key beyond mode/allowInvalidCertificates/
       certManagementPolicy/certValidityDuration/issuerConf fails server-side apply with "field not
       declared in schema". ArmoniK's own keys therefore live in dependencies.mongodb.certManager. */}}
{{- $tls := $mongo.tls | default dict }}
{{- $certManager := $mongo.certManager | default dict }}
{{- if and $mongo.enabled $certManager.enabled }}
{{- if eq ($tls.mode | default "preferTLS") "disabled" }}
{{- fail "dependencies.mongodb.certManager.enabled cannot be combined with dependencies.mongodb.tls.mode=disabled: cert-manager would issue Certificates the replica set never uses. Set tls.mode to allowTLS, preferTLS or requireTLS, or turn certManager.enabled off." }}
{{- end }}
{{- $domain := include "armonik.clusterDomain" . }}
{{- /* The operator names the replset Service/StatefulSet after the CR and creates them in the CR's
       namespace, so take both from psmdb-db's (alias "mongodb") own helpers through the live subchart
       scope: its nameOverride/fullnameOverride/namespaceOverride are independent of the umbrella's.
       replsetName is an ArmoniK-only value defaulting to "rs0"; it is not derived from
       dependencies.mongodb.replsets.*.name, so a renamed replset needs it set explicitly. */}}
{{- $cluster := include "psmdb-database.fullname" .Subcharts.dependencies.Subcharts.mongodb }}
{{- $ns := include "psmdb-database.namespace" .Subcharts.dependencies.Subcharts.mongodb }}
{{- $replset := $mongo.replsetName | default "rs0" }}
{{- $svc := printf "%s-%s" $cluster $replset }}

{{- /* Resolved once, outside the range below: ssl and ssl-internal share this $issuer, so a local
       fallback Issuer is one object, not one per Certificate. */}}
{{- $issuerName := printf "%s-issuer" $cluster }}
{{- $provider := $certManager.provider | default "selfSigned" }}
{{- $localRequested := hasKey $certManager "provider" }}
{{- $issuer := list $ $certManager.existingIssuer $issuerName $provider $localRequested | include "armonik.certManager.getIssuer" | fromYaml }}
{{- if and (not $ops.certManager.available) $issuer.needsLocalIssuer }}
{{- fail "dependencies.mongodb.certManager.enabled requires it: set global.armonik.operators.certManager.available=true, set dependencies.mongodb.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or disable certManager.enabled and bring your own ssl/ssl-internal Secrets via tls.certManagementPolicy=userProvidedOnly with secrets.ssl/secrets.sslInternal." }}
{{- end }}
{{- if empty $issuer.name }}
{{- fail "the cert-manager issuer has no name: set dependencies.mongodb.certManager.existingIssuer.name when existingIssuer.enabled=true, else global.armonik.certManager.issuer.name must not be empty." }}
{{- end }}
{{- if and (list $certManager "existingIssuer" "enabled" | include "armonik.utils.index" | empty) (not $issuer.needsLocalIssuer) }}
{{- /* Only the shared issuer's provider is checkable at render time. The backend of a local
       existingIssuer would need `lookup`, so pointing existingIssuer at a selfSigned Issuer
       reintroduces the no-common-CA problem unnoticed. */}}
{{- $cmi := .Values.certManagerIssuer | default dict }}
{{- if eq ($cmi.provider | default "selfSigned") "selfSigned" }}
{{- fail "dependencies.mongodb.certManager.enabled cannot use a selfSigned shared issuer: replica set members must chain to a common CA. Use certManagerIssuer.provider=ca, vault, acme, venafi or googleCas, or point dependencies.mongodb.certManager.existingIssuer at an issuer backed by a real CA." }}
{{- end }}
{{- end }}
{{- /* Same for the local fallback: a selfSigned Issuer has no persistent signing key, so ssl and
       ssl-internal would each get their own root, not trusting each other. */}}
{{- if and $issuer.needsLocalIssuer (eq $provider "selfSigned") }}
{{- fail "dependencies.mongodb.certManager.enabled cannot use a local selfSigned fallback issuer: replica set members must chain to a common CA, and cert-manager's selfSigned issuer type has no persistent signing key, so ssl and ssl-internal would each get an independently self-signed root that does not trust the other. Set dependencies.mongodb.certManager.provider to ca, vault, acme, venafi or googleCas, point dependencies.mongodb.certManager.existingIssuer at an issuer backed by a real CA, or set global.armonik.certManager.issuer.enabled=true with certManagerIssuer.provider set to a real CA." }}
{{- end }}
{{- if $issuer.needsLocalIssuer }}
{{- include "armonik.certManager.issuerManifest" (dict
      "root" $
      "name" $issuer.name
      "namespace" $ns
      "provider" $provider
      "kind" $issuer.kind
      "group" $issuer.group
      "spec" (index $certManager $provider | default dict)
      "labels" (include "armonik.labels" $)
      "specValuesPath" "dependencies.mongodb.certManager") }}
{{- end }}

{{- range $purpose, $secret := dict "ssl" ($certManager.existingSecret | default (printf "%s-ssl" $cluster)) "ssl-internal" ($certManager.existingSecretInternal | default (printf "%s-ssl-internal" $cluster)) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $cluster }}-{{ $purpose }}
  namespace: {{ $ns }}
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  secretName: {{ $secret }}
  commonName: {{ $svc }}
  # The replset Service and, through the wildcard, each member (rs0-0, rs0-1, ...). Members are
  # both server and client to each other (usages in armonik.certManager.certificateSpec).
  dnsNames:
  - {{ $svc }}
  - {{ $svc }}.{{ $ns }}
  - {{ $svc }}.{{ $ns }}.svc
  - {{ $svc }}.{{ $ns }}.svc.{{ $domain }}
  - "*.{{ $svc }}"
  - "*.{{ $svc }}.{{ $ns }}"
  - "*.{{ $svc }}.{{ $ns }}.svc"
  - "*.{{ $svc }}.{{ $ns }}.svc.{{ $domain }}"
  {{- include "armonik.certManager.certificateSpec" (dict "certManager" $certManager "issuer" $issuer) | nindent 2 }}
{{- end }}
{{- end }}
