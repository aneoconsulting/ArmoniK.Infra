# cert-manager TLS with an existing issuer.
# FIXME: sets certificates.enable, which no template reads, instead of tls.enabled, so this fixture
# renders no Certificate.
certificates:
  enable: true
tls:
  type: "cert-manager"
  certManager:
    existingIssuer:
      enabled: true
      kind: ClusterIssuer
      name: my-issuer
