suite: existing ServiceAccount tests
release:
  name: t
templates:
  - deployment.yaml
  - init.yaml
values:
  - ../ci/keda-off-values.yaml
tests:
  - it: creates and uses its own ServiceAccount when create is true (default)
    set:
      serviceAccount:
        create: true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: t-armonik-compute-plane
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
  - it: uses the ServiceAccount of the umbrella owning the conf Secrets by default (create is false)
    set:
      conf:
        source: base
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: base-compute-plane
  - it: uses an existing ServiceAccount name when create is false and a name is given
    set:
      serviceAccount:
        create: false
        name: my-existing-sa
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-existing-sa
  - it: fails when create is false and no ServiceAccount name is given
    set:
      serviceAccount:
        create: false
        name: ""
    template: init.yaml
    asserts:
      - failedTemplate:
          errorPattern: "serviceAccount.name is required when serviceAccount.create is false"
