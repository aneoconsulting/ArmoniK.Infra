suite: prometheus-operator pod monitor
templates:
  - podmonitor.yaml
set:
  partitions:
    default:
      worker:
        image:
          name: armonik-dynamic-dotnet-worker
tests:
  - it: renders a PodMonitor when the prometheus-operator CRDs are present
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodMonitor
  - it: renders no PodMonitor when the prometheus operator is unavailable
    set:
      global:
        armonik:
          operators:
            prometheusOperator:
              deploy: false
              available: false
    asserts:
      - hasDocuments:
          count: 0
