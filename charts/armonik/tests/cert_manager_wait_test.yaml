suite: cert-manager wait hook Job
templates:
  - cert-manager-wait.yaml
values:
  - ../ci/minimal-values.yaml
release:
  name: t
set:
  global.armonik.operators.certManager.deploy: true
  global.armonik.operators.certManager.available: true
tests:
  - it: schedules on tainted nodes once tolerations are set
    set:
      certManagerWait.tolerations:
        - key: node-role
          operator: Exists
          effect: NoSchedule
      certManagerWait.nodeSelector:
        role: system
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: node-role
      - equal:
          path: spec.template.spec.nodeSelector.role
          value: system

  - it: patches the wait pod and container
    set:
      certManagerWait.podSpecPatch.hostAliases:
        - ip: "10.0.0.1"
          hostnames: ["cm.internal"]
      certManagerWait.containerPatch.imagePullPolicy: Always
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: spec.template.spec.hostAliases[0].ip
          value: "10.0.0.1"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: keeps the wait script intact under a patch
    set:
      certManagerWait.containerPatch.imagePullPolicy: Always
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "cert-manager webhook ready"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "deployment/cert-manager-webhook"

  - it: refuses a patch that would replace the command-bearing container list
    set:
      certManagerWait.podSpecPatch.containers:
        - name: hijack
          image: busybox:1.37.0
    asserts:
      - failedTemplate:
          errorPattern: "certManagerWait.podSpecPatch.containers: the chart builds containers"

  - it: renders nothing when cert-manager comes from another release
    set:
      global.armonik.operators.certManager.deploy: false
      global.armonik.operators.certManager.namespace: cert-manager
    asserts:
      - hasDocuments:
          count: 0
