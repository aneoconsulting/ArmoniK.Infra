{{- if .Values.gateway.enabled }}
{{- $nginx := include "armonik.ingress.nginx" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "armonik.ingress.gateway.name" . | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: ingress
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}

  {{- with .Values.gateway.infrastructure }}
  infrastructure:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- with .Values.gateway.addresses }}
  addresses:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- $from := list .Values "gateway" "allowedRoutes" "namespaces" "from" | include "armonik.utils.index" | default "Same" }}
  listeners:
    {{- if not $nginx }}
    {{- /* gateway mode: nginx's ports, cleartext; validate.yaml refuses gateway.tls. */}}
    {{- range .Values.ports }}
    - name: {{ .name | quote }}
      port: {{ .servicePort }}
      protocol: HTTP
      {{- with $.Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: {{ $from | quote }}
    {{- end }}
    {{- else if .Values.gateway.tls.enabled }}
    - name: https
      port: 443
      protocol: HTTPS
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}

      tls:
        mode: Terminate
        {{- if .Values.gateway.tls.options }}
        options:
          {{- toYaml .Values.gateway.tls.options | nindent 10 }}
        {{- else if .Values.gateway.tls.certificateRefs }}
        certificateRefs:
          {{- toYaml .Values.gateway.tls.certificateRefs | nindent 10 }}
        {{- else }}
        certificateRefs:
        - name: {{ include "armonik.fullname" . }}
        {{- end }}

      allowedRoutes:
        namespaces:
          from: {{ $from | quote }}
    {{- else }}
    - name: http
      port: 80
      protocol: HTTP
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}

      allowedRoutes:
        namespaces:
          from: {{ $from | quote }}
    {{- end }}
{{- end }}
