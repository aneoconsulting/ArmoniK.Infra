{{- /* sso.oauth2Proxy.existingSecret built by ESO from an existing store, when one is named. */}}
{{- $sso := include "armonik.ingress.sso" . | fromYaml -}}
{{- $eso := list $sso "oauth2Proxy" "externalSecret" | include "armonik.utils.index" | fromYaml | default dict -}}
{{- if and $sso.enabled $eso.storeName }}
{{- $ops := include "armonik.operators" . | fromYaml }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $sso.oauth2Proxy.existingSecret | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.externalSecrets.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ include "armonik.conf.refreshInterval" . | quote }}
  {{- with (include "armonik.conf.refreshPolicy" .) }}
  refreshPolicy: {{ . | quote }}
  {{- end }}
  secretStoreRef:
    {{- list (pick $eso "storeName" "storeKind") "sso.oauth2Proxy.externalSecret" $ | include "armonik.conf.sourceRef" | nindent 4 }}
  target:
    name: {{ $sso.oauth2Proxy.existingSecret | quote }}
    creationPolicy: Owner
  data:
    {{- range $secretKey, $item := dict "client-secret" $eso.clientSecret "cookie-secret" $eso.cookieSecret }}
    - secretKey: {{ $secretKey | quote }}
      remoteRef:
        key: {{ $item.key | quote }}
        {{- with $item.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
