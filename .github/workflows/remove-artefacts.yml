name: Remove Old Branch Artefacts

# Docker Hub has no tag retention and publish.yml pushes a chart tag per commit.
# The action deletes pre-release tags older than `months` (2) and keeps plain
# X.Y.Z and -SNAPSHOT*, so releases and main survive.

on:
  schedule:
    - cron: '20 9 * * 1'   # 9:20 on Monday
  workflow_dispatch:

permissions: {}

jobs:
  charts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The repositories publish.yml creates, one per release-root chart of
        # charts/package-charts.sh.
        chart:
          - armonik
          - armonik-operators
          - armonik-control-plane
          - armonik-compute-plane
          - armonik-ingress
          - armonik-dependencies
          - activemq
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7

      - name: Remove old branch chart tags
        uses: aneoconsulting/ArmoniK.Actions.CleanupArtifacts/remove-images@c83a887c5a27fef327098a89bce0a28a4e82168d # main
        with:
          org: dockerhubaneo
          image: ${{ matrix.chart }}
          user: ${{ secrets.DOCKER_HUB_LOGIN }}
          token: ${{ secrets.DOCKER_HUB_TOKEN }}
