# Control flags, documented in armonik-common/values.yaml. Only `deploy` matters here, true by default
# since installing the operators is this chart's purpose. Under the umbrella, the umbrella's
# global.armonik.operators.* win.
# global.armonik.operators.<op> holds the control flags; <op> at the top level is the operator
# subchart's own configuration.
# googleCasIssuer keeps deploy=false: it is GCP-specific, needed only by a googleCas issuer provider.
# Opt in with --set global.armonik.operators.googleCasIssuer.deploy=true.
global:
  armonik:
    operators:
      externalSecrets:
        deploy: true
      keda:
        deploy: true
      certManager:
        deploy: true
      mongodbOperator:
        deploy: true
      prometheusOperator:
        deploy: true
      googleCasIssuer:
        deploy: false

# --- Operator subchart configuration, at operators.<op>.* under the umbrella ---

# KEDA (https://github.com/kedacore/charts)
keda:
  crds:
    install: true
  prometheus:
    metricServer:
      enabled: true
      serviceMonitor:
        enabled: true
  certificates:
    certManager:
      enabled: false
      issuer:
        {
          "generate": false,
          "group": "cert-manager.io",
          "kind": "ClusterIssuer",
          "name": "armonik-selfsigned-issuer",
        }
  image:
    pullPolicy: IfNotPresent
  # imagePullSecrets: []
  # priorityClassName:

# External Secrets Operator (https://charts.external-secrets.io); chart defaults install the CRDs.
external-secrets: {}
# external-secrets:
#   priorityClassName:
#   webhook:
#     priorityClassName:
#   certController:
#     priorityClassName:

# cert-manager (https://charts.jetstack.io).
cert-manager:
  crds:
    # enabled and keep replace the deprecated installCRDs (enabled=true, keep=true).
    enabled: true
    # false: uninstall removes the six cert-manager CRDs (charts/uninstall.md), and with them every
    # Certificate and Issuer cluster-wide. Set true on a shared cluster.
    keep: false
  prometheus:
    servicemonitor:
      enabled: true
  # global:
  #   priorityClassName:

google-cas-issuer:
  crds:
    enabled: true
    keep: false
  app:
    approval:
      # Upstream binds the literal cert-manager/cert-manager ServiceAccount; googleCasIssuerApproval
      # binds the actual one instead.
      enabled: false

# cert-manager's approval of Google CAS CertificateRequests, rendered when this release installs
# google-cas-issuer (templates/google-cas-issuer-approval.yaml).
googleCasIssuerApproval:
  # -- Set false when approval is managed elsewhere, e.g. by approver-policy.
  enabled: true
  # -- Subjects allowed to approve. Empty means cert-manager's own ServiceAccount, which requires this
  # release to install cert-manager.
  subjects: []

# Percona Server for MongoDB operator (https://percona.github.io/percona-helm-charts/). Chart defaults
# install the CRDs; the PerconaServerMongoDB CR itself stays in armonik-dependencies.
mongodb-operator:
  # Upstream default false pins WATCH_NAMESPACE to this release's namespace, silently ignoring a CR
  # anywhere else. true watches every namespace, with ClusterRole/ClusterRoleBinding RBAC.
  watchAllNamespaces: true
# The psmdb-operator chart has no priorityClassName value.

# kube-prometheus-stack (https://prometheus-community.github.io/helm-charts): the shared monitoring
# stack, one per cluster. Grafana stays per-release, in armonik-dependencies.
# global.armonik.monitoring.prometheusUrl derives from its naming helpers in this release; other
# releases set it, as NOTES.txt prints.
kube-prometheus:
  prometheus-node-exporter:
    # TODO: root filesystem mount disabled to avoid a Docker Desktop crash
    hostRootFsMount:
      enabled: false
  alertmanager:
    enabled: false
  grafana:
    # kps's Grafana stays off; forceDeployDashboards still ships its dashboard ConfigMaps (the standard
    # k8s/node dashboards) for the per-release Grafana sidecar to collect.
    enabled: false
    forceDeployDashboards: true
  prometheus:
    prometheusSpec:
      scrapeInterval: 10s
      evaluationInterval: 30s
      # Select ServiceMonitors/PodMonitors from every namespace and release, not only kps's own.
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorSelectorNilUsesHelmValues: false
      podMonitorNamespaceSelector: {}
      # priorityClassName:
  # prometheusOperator:
  #   priorityClassName:
