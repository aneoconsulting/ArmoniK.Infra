  rabbitmq:
    image:
      registry: bitnamilegacy
      repository: rabbitmq
      tag: 4.1.3
    enabled: false
    fullnameOverride: "rabbitmq"
    auth:
      username: "admin"
      password: "admin"
      # tls:
      #   enabled: false
      #   autoGenerated: false
    #esourcesPreset: nano
    persistence:
      enabled: false
    metrics:
      image: 
        registry: public.ecr.aws
      enabled: true
      serviceMonitor:
        enabled: true

  ################## REDIS ##################
  redis:
    enabled: true
    image:
      registry: public.ecr.aws
    auth:
      enabled: true
      usersExistingSecret: "redis-users"
      aclUsers:
        default:
          permissions: "~* &* +@all"
    replica:
      enabled: false
    tls:
      enabled: false
      existingSecret: "" 
      serverPublicKey: ""
      serverKey: ""
      caPublicKey: ""
    metrics:
      enabled: true
      image:
        registry: public.ecr.aws
      serviceMonitor:
        enabled: true
        port: http-metrics
