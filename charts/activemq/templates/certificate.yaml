{{- if eq .Values.tls.type "cert-manager" }}
{{- if and (not (dig "armonik" "operators" "certManager" "available" true .Values.global)) (not .Values.tls.certManager.existingIssuer.enabled) }}
{{- fail "activemq TLS via cert-manager requires it: set global.armonik.operators.certManager.available=true, set tls.certManager.existingIssuer.enabled=true, or use a tls.type other than cert-manager." }}
{{- end }}
{{- if not .Values.tls.certManager.existingIssuer.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  annotations:
    {{- if dig "armonik" "operators" "certManager" "deploy" false .Values.global }}
    {{- /* CRD-ordering hook only when THIS release installs cert-manager; external/absent -> no hook.
           Weight 0 keeps the Issuer ahead of the Certificate below, hooked at weight 10. */}}
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    {{- end }}
    {{- with .Values.additionalAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "activemq.fullname" . }}-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "activemq.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- if dig "armonik" "operators" "certManager" "deploy" false .Values.global }}
  {{- /* CRD-ordering hook only when THIS release installs cert-manager; external/absent -> no hook. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  commonName: {{ include "activemq.fullname" . }}
  dnsNames:
  - {{ include "activemq.fullname" . }}.{{ .Release.Namespace }}
  - {{ include "activemq.fullname" . }}.{{ .Release.Namespace }}.svc
  - {{ include "activemq.fullname" . }}.{{ .Release.Namespace }}.svc.{{ .Values.tls.clusterDomain }}
  secretName: {{ include "activemq.fullname" . }}
  usages:
    - server auth
    - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  {{- with .Values.tls.certManager.duration }}
  duration: {{ . }}
  {{- end }}
  {{- with .Values.tls.certManager.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  issuerRef:
    {{- if .Values.tls.certManager.existingIssuer.enabled }}
    name: {{ .Values.tls.certManager.existingIssuer.name }}
    kind: {{ .Values.tls.certManager.existingIssuer.kind }}
    {{- else }}
    name: {{ include "activemq.fullname" . }}-issuer
    kind: Issuer
    {{- end }}
    group: cert-manager.io
  additionalOutputFormats:
    - type: CombinedPEM
{{- end }}
