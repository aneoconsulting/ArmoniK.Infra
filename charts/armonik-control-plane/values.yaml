# global.armonik.* comes from armonik-common via import-values; its defaults suit a standalone plane.
global:
  # Release name of the umbrella that owns the conf Secrets (defaults to "armonik").
  armonik:
    source: armonik
imagePullSecrets: []
name: control-plane
image:
  registry: ""
  repository: dockerhubaneo
  name: armonik_control
  tag:
  pullPolicy: IfNotPresent

replicas: 1
maxErrorAllowed: 50

defaultPartition: default
extraPartitions:
  # default:
  #   parentPartitionIds: []
  #   podMax: 100
  #   podReserved: 50
  #   preemptionPercentage: 20
  #   priority: 1

rbac:
  authentication:
    required: false
  authorization:
    required: false
  createBuiltInRoles: false
  roles:
    # <roleName>: [""]
  users:
    # <username>: [""]
  userCertificates:
    # <username>:
    #   commonName: ""
    #   fingerprint: ""

serviceAccount:
  create: true
  # Name of the ServiceAccount.
  # When create=false, this must instead name an existing ServiceAccount to use.
  name: control-plane
  annotations: {}
  secrets: []

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /liveness
    port: 1081
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 1

startupProbe:
  httpGet:
    path: /startup
    port: 1081
  initialDelaySeconds: 15
  periodSeconds: 3
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 20

nodeSelector: {}
tolerations: []
annotations: {}
affinity: {}
priorityClassName: ""

# Base conf merged into every control-plane workload: core + log layers + core TLS mounts.
conf:
  # Overrides the umbrella's global.armonik.mountPath for this release (default "/mounts").
  # mountPath: /mounts
  # A workload mounts the mount-aggregate of each layer it uses (same layers as envSecret), all at
  # mountPath (merged into one projected volume). path defaults to mountPath, mode to "0444".
  envSecret:
    - '{{ list "core" . | include "armonik.conf.secretName" }}'
    - '{{ list "log" . | include "armonik.conf.secretName" }}'
  mountSecret:
    - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
    - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'

# On top of the base conf: control layer.
deployment:
  conf:
    envSecret:
      - '{{ list "control" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "control" . | include "armonik.conf.mountSecretName" }}'

ports:
  - name: control-port
    containerPort: 1080
    protocol: TCP
  - name: metrics-port
    containerPort: 1081
    protocol: TCP

service:
  name: control-plane
  serviceType: ClusterIP
  annotations:

  ports:
    - name: control-port
      port: 5001
      targetPort: 1080

metricsExporter:
  enabled: true
  name: metrics-exporter
  replicas: 1
  image:
    registry:
    repository:
    name: armonik_control_metrics
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  annotations:
  affinity:
  priorityClassName:
  livenessProbe:
    httpGet:
      path: /liveness
      port: 1080
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 1
  startupProbe:
    httpGet:
      path: /startup
      port: 1080
    initialDelaySeconds: 15
    periodSeconds: 3
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 20
  ports:
    - name: metrics-port
      containerPort: 1080
      protocol: TCP
  service:
    name: metrics-exporter
    serviceType: ClusterIP
    annotations:
    ports:
      - name: metrics-port
        port: 9419
        targetPort: 1080
  # On top of the base conf: metrics layer.
  conf:
    envSecret:
      - '{{ list "metrics" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "metrics" . | include "armonik.conf.mountSecretName" }}'

init:
  enabled: false
  name: init
  image:
    registry:
    repository:
    name:
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  annotations:
  affinity:
  priorityClassName:
  # On top of the base conf: jobs layer.
  conf:
    envSecret:
      - '{{ list "init" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "init" . | include "armonik.conf.mountSecretName" }}'

networkPolicy:
  enabled: false
  submitter:
    enabled: true
    # Pod selector matching Prometheus, for the built-in ingress rule below. Defaults to
    # app.kubernetes.io/name: prometheus (kube-prometheus-stack's own label).
    prometheusPodSelector:
    extraIngressRules: []
    # DNS-only by default. Add your own rules below.
    # extraEgressRules:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # MongoDB's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: percona-server-mongodb
    #     ports:
    #       - protocol: TCP
    #         port: 27017
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # ActiveMQ's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: activemq
    #     ports:
    #       - protocol: TCP
    #         port: 5672
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>   # Redis's namespace
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: redis
    #     ports:
    #       - protocol: TCP
    #         port: 6379
    extraEgressRules: []

  metricsExporter:
    enabled: true
    # Pod selector matching Prometheus, for the built-in ingress rule below. Defaults to
    # app.kubernetes.io/name: prometheus (kube-prometheus-stack's own label).
    prometheusPodSelector:
    extraIngressRules: []
    # DNS-only by default, same as submitter.extraEgressRules above (MongoDB only).
    extraEgressRules: []
