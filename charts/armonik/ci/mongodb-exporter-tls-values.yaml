# mongodb-exporter-values.yaml with MongoDB TLS required: the ExternalSecret adds the ca.crt
# remoteRef (from the psmdb default <fullname>-ssl-internal, secrets.sslInternal being unset) and the
# URI carries &tls=true&tlsCAFile=/mongodb/certificate/ca.crt.
global:
  armonik:
    # kube-prometheus-stack is installed by another release: its URL is stated.
    monitoring:
      prometheusUrl: http://ops-kube-prometheus-prometheus.monitoring.svc:9090
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: external-secrets
      prometheusOperator:
        deploy: false
        available: true
        namespace: monitoring
networkPolicy:
  enabled: true
dependencies:
  mongodb-exporter:
    enabled: true
  mongodb:
    unsafeFlags:
      tls: false
