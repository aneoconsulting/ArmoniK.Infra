{{- $init := .Values.init | default dict -}}
{{- $deployment := .Values.deployment | default dict -}}
{{- /* Without the init Job, the control plane runs the init itself and keeps running (StopAfterInit false). */}}
{{- $conf := list
    (not $init.enabled | ternary (include "armonik.control.init.confHelper" .) "" | fromYaml)
    (include "armonik.control.confHelper" . | fromYaml)
    .Values.conf
    $deployment.conf
  | include "armonik.conf.merge" | fromYaml -}}
{{- $conf = list $conf $ | include "armonik.conf.resolve" | fromYaml -}}
{{- $hpa := list .Values "hpa" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- dict
      "root" $
      "component" "control-plane"
      "name" (include "armonik.fullname" .)
      "conf" $conf
      "replicas" ($hpa | ternary nil .Values.replicas)
  | include "armonik.control.deployment" }}
