{{/*
Internal URLs of the components the ingress fronts: keys control-plane, grafana and seq, each present
only when that component is enabled. ingress.{control_plane,grafana,seq}_url override them, else each
is the in-cluster Service URL. Named ingress.urlsSecretName (default "<release>-urls"), in
ingress.urlsSecretNamespace, else the ingress namespace.
*/}}
{{- $domain := include "armonik.clusterDomain" . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $cpPort := include "armonik.controlPlane.servicePort" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $ingress.urlsSecretName $ | default (printf "%s-urls" .Release.Name) | quote }}
  namespace: {{ $ingress.urlsSecretNamespace | default (include "armonik.namespace" .Subcharts.ingress) | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if list .Values "control-plane" "enabled" | include "armonik.utils.index" }}
  {{- $url := $ingress.control_plane_url | default "" -}}
  {{- if not $url }}
  {{- with index .Subcharts "control-plane" }}
  {{- $url = printf "%s-control-plane.%s.svc.%s:%d"
      (include "armonik.controlPlane.source" $)
      (include "armonik.namespace" .)
      $domain
      (int $cpPort) -}}
  {{- end }}
  {{- end }}
  {{- if $url }}
  control-plane: {{ $url | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- /* Each Service named by its own chart's helpers; seq has no namespace key of its own. */}}
  {{- $services := dict
        "grafana" (list "grafana.fullname" "grafana.namespace")
        "seq"     (list "seq.fullname" "") }}
  {{- range $component, $helpers := $services }}
  {{- if list $.Values "dependencies" $component "enabled" | include "armonik.utils.index" }}
  {{- $url := index $ingress (printf "%s_url" $component) | default "" -}}
  {{- with index $.Subcharts.dependencies.Subcharts $component }}
  {{- $dep := . -}}
  {{- if not $url }}
  {{- $ns := .Release.Namespace -}}
  {{- with index $helpers 1 }}
  {{- $ns = include . $dep -}}
  {{- end }}
  {{- $url = printf "http://%s.%s.svc.%s" (include (index $helpers 0) $dep) $ns $domain -}}
  {{- end }}
  {{- end }}
  {{- if $url }}
  {{ $component }}: {{ $url | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
