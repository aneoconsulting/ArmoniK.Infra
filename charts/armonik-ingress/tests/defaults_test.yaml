suite: chart defaults
templates:
  - validate.yaml
  - deployments/nginx.yaml
tests:
  - it: fails on plain chart defaults, urlsSecretName having none
    template: validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "specify urlsSecretName or at least one of"
  - it: renders with chart defaults plus urlsSecretName
    template: deployments/nginx.yaml
    set:
      urlsSecretName: example-urls
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
