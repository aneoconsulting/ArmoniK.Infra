name: Helm chart tests
on:
  push:
    branches:
      - main
      - feat/revamp-helm
  pull_request:
    branches:
      - main
      - feat/revamp-helm
  workflow_dispatch:

env:
  HELM_VERSION: v3.18.4
  HELM_UNITTEST_VERSION: "1.1.2"
  KUBECONFORM_VERSION: "0.8.0"

jobs:
  deps:
    name: Vendor dependencies (freshness check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Cache helm repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm/repository
          key: helm-repo-${{ hashFiles('charts/*/Chart.lock', 'charts/*/Chart.yaml', 'test/harness/*/Chart.lock') }}
          restore-keys: helm-repo-

      # bare mode reproduces the committed Chart.lock files and fails when a
      # Chart.yaml drifted from its lock: this IS the freshness check.
      - name: Vendor chart dependencies from Chart.lock
        run: ./test/vendor.sh

      - name: Check lock files unchanged
        run: git diff --exit-code -- 'charts/*/Chart.lock' test/harness/common-harness/Chart.lock

      - name: Upload vendored archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendored-charts
          if-no-files-found: error
          retention-days: 1
          path: |
            charts/*/charts/*.tgz
            test/harness/common-harness/charts/*.tgz

  package:
    name: Package charts
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0 # git-version walks the tag history

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendored-charts
          path: .

      # Chart versions never bump per change, so the in-tree 0.1.0 would name
      # every build alike.
      - name: Generate snapshot version
        id: version
        uses: codacy/git-version@877bb11b7a2ee44dcd7c0a03882c7037356e64e9 # 2.8.6
        with:
          minor-identifier: "feat:"
          # Never the current branch: a push to main would otherwise claim the
          # version the next tag releases.
          release-branch: ${{ github.head_ref || github.ref_name }}-pre
          dev-branch: ${{ github.head_ref || github.ref_name }}

      - name: Package charts
        run: ./charts/package-charts.sh -v "${{ steps.version.outputs.version }}"

      # The archive, not the source tree: this is what proves it carries its
      # dependencies.
      - name: Check the packaged umbrella renders offline
        run: helm template airgap "dist/armonik-${{ steps.version.outputs.version }}.tgz" >/dev/null

      - name: Upload packaged charts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-charts
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.tgz
            dist/index.yaml

  unittest:
    name: helm-unittest
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendored-charts
          path: .

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version "$HELM_UNITTEST_VERSION"

      - name: Run unit test suites
        run: ./test/unittest.sh

  template-matrix:
    name: Render matrix and kubeconform
    runs-on: ubuntu-latest
    needs: deps
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "${{ env.HELM_VERSION }}"

      - name: Download vendored archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendored-charts
          path: .

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Run render matrix
        run: ./test/matrix.sh
