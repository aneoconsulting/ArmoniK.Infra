{{- $networkPolicyEnabled := list .Values "networkPolicy" "enabled"
    | include "armonik.utils.index"
-}}

{{/*
  Freeform policies from networkPolicy.extraPolicies (values.yaml), each with its own podSelector
  and rules, independent of this chart's other policies.
*/}}
{{- if $networkPolicyEnabled }}
{{- range $i, $policy := .Values.networkPolicy.extraPolicies }}
{{- if hasKey $policy "podSelector" | not }}
{{- printf "networkPolicy.extraPolicies[%d] needs a podSelector (use {} to match every pod in the namespace)" $i | fail }}
{{- end }}
{{- include "armonik.netpol.render" (dict
      "context" $
      "component" ($policy.name | default (printf "extra-%d" $i))
      "config" $policy
  ) }}
{{- end }}
{{- end }}
