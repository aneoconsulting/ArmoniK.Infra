{{/* Recommanded way of initializing users by the Valkey chart 
see https://github.com/valkey-io/valkey-helm/tree/main/valkey#existing-secret-recommended */}}
{{- with .Subcharts.dependencies.Subcharts.redis }}
{{- /* Named by valkey's own reading of auth.usersExistingSecret, in valkey's namespace. */}}
{{- $name := tpl .Values.auth.usersExistingSecret . }}
{{- $namespace := include "armonik.redis.namespace" . }}
{{- $existingSecret := lookup "v1" "Secret" $namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- if $existingSecret }}
  {{- /* if secrets already exists same password is used to avoid rotation on helm upgrade */}}
  default: {{ index $existingSecret.data "default" }}
  {{- else }}
  default: {{ randAlphaNum 16 | b64enc | quote }}
  {{- end }}
{{- end }}
