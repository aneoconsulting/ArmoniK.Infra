suite: certificate SANs follow the real backend identity
release:
  name: t
templates:
  - certificate/redis-certificate.yaml
  - certificate/mongodb-certificate.yaml
  - certificate/postgresql-certificate.yaml
  - charts/dependencies/charts/redis/templates/service.yaml
  - charts/dependencies/charts/mongodb/templates/cluster.yaml
  - charts/dependencies/charts/postgresql/templates/cluster.yaml
tests:
  # Regression guard: redis-certificate.yaml once hardcoded "<release>-redis" for commonName/dnsNames
  # while the actual valkey Service name comes from its own fullname helper (nameOverride/
  # fullnameOverride-aware), so the cert covered the wrong host and every ArmoniK client failed the
  # TLS handshake with RemoteCertificateNameMismatch (the Certificate itself still reported Ready).
  # fullnameOverride here would not move a hardcoded guess, so it proves the template calls the real
  # helper instead. Covered under three cases: chart defaults, dependencies.redis.fullnameOverride,
  # and a release namespaceOverride (the valkey Service has no metadata.namespace of its own, so it
  # always lands in the release namespace that armonik.namespace resolves to).
  - it: redis Service is named exactly what redis-certificate.yaml expects (defaults)
    template: charts/dependencies/charts/redis/templates/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: t-redis
  - it: redis Certificate commonName and dnsNames match that Service name (defaults)
    template: certificate/redis-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
      dependencies:
        redis:
          tls:
            enabled: true
            existingSecret: redis-tls
            certManager:
              enabled: true
    asserts:
      - equal:
          path: spec.commonName
          value: t-redis
      - contains:
          path: spec.dnsNames
          content: t-redis
      - contains:
          path: spec.dnsNames
          content: t-redis.NAMESPACE

  - it: redis Service is named exactly what redis-certificate.yaml expects (fullnameOverride)
    template: charts/dependencies/charts/redis/templates/service.yaml
    set:
      dependencies:
        redis:
          fullnameOverride: custom-redis
    asserts:
      - equal:
          path: metadata.name
          value: custom-redis
  - it: redis Certificate commonName and dnsNames match that Service name (fullnameOverride)
    template: certificate/redis-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
      dependencies:
        redis:
          fullnameOverride: custom-redis
          tls:
            enabled: true
            existingSecret: redis-tls
            certManager:
              enabled: true
    asserts:
      - equal:
          path: spec.commonName
          value: custom-redis
      - contains:
          path: spec.dnsNames
          content: custom-redis
      - contains:
          path: spec.dnsNames
          content: custom-redis.NAMESPACE

  - it: redis Certificate namespace, commonName and dnsNames follow a release namespaceOverride
    template: certificate/redis-certificate.yaml
    set:
      namespaceOverride: custom-ns
      control-plane:
        namespaceOverride: custom-ns
      compute-plane:
        namespaceOverride: custom-ns
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
      dependencies:
        redis:
          tls:
            enabled: true
            existingSecret: redis-tls
            certManager:
              enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
      - equal:
          path: spec.commonName
          value: t-redis
      - contains:
          path: spec.dnsNames
          content: t-redis
      - contains:
          path: spec.dnsNames
          content: t-redis.custom-ns

  # Regression guard: mongodb-certificate.yaml once guessed "<release>-mongodb" for the cluster name
  # and read the namespace from the UMBRELLA's own armonik.namespace instead of the psmdb-db CR's own
  # (independently overridable) name/namespace. nameOverride/namespaceOverride here would not move a
  # hardcoded guess, so it proves the template reuses the CR's own helpers.
  - it: mongodb CR is named and namespaced exactly what mongodb-certificate.yaml expects
    template: charts/dependencies/charts/mongodb/templates/cluster.yaml
    set:
      dependencies:
        mongodb:
          nameOverride: custom-mongo
          namespaceOverride: custom-ns
    asserts:
      - equal:
          path: metadata.name
          value: t-custom-mongo
      - equal:
          path: metadata.namespace
          value: custom-ns
  - it: mongodb Certificate namespace, commonName and first dnsName match that CR
    template: certificate/mongodb-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
      certManagerIssuer:
        provider: venafi
      dependencies:
        mongodb:
          nameOverride: custom-mongo
          namespaceOverride: custom-ns
          certManager:
            enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
        documentIndex: 0
      - equal:
          path: spec.commonName
          value: t-custom-mongo-rs0
        documentIndex: 0
      - equal:
          path: spec.dnsNames[0]
          value: t-custom-mongo-rs0
        documentIndex: 0

  # Regression guard: issuer.enabled=true, create=false and name explicitly blanked out used to
  # render issuerRef.name: "" silently (Kubernetes accepts the object, cert-manager never issues
  # it, nothing reports an error). Both consumers now `required` the name.
  - it: redis Certificate fails when the shared issuer name is empty
    template: certificate/redis-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
              create: false
              name: ""
      dependencies:
        redis:
          tls:
            enabled: true
            existingSecret: redis-tls
            certManager:
              enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "global.armonik.certManager.issuer.name must not be empty"

  - it: mongodb Certificate fails when the shared issuer name is empty
    template: certificate/mongodb-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
              name: ""
      certManagerIssuer:
        provider: venafi
      dependencies:
        mongodb:
          certManager:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "global.armonik.certManager.issuer.name must not be empty"

  # Regression guard: certManager.enabled issues Certificates regardless of tls.mode, so a replica
  # set explicitly set to tls.mode=disabled would still get two unused Certificates and no error.
  - it: mongodb Certificate fails when certManager is enabled but tls.mode=disabled
    template: certificate/mongodb-certificate.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
      certManagerIssuer:
        provider: venafi
      dependencies:
        mongodb:
          tls:
            mode: disabled
          certManager:
            enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "dependencies.mongodb.tls.mode=disabled"

  # Same guard for postgresql: fullnameOverride/namespaceOverride would not move a hardcoded guess, so
  # it proves the template reuses the Cluster CR's own helpers. ClusterIssuer keeps the shared issuer's
  # namespace guard out of the way.
  - it: postgresql Cluster CR is named and namespaced exactly what postgresql-certificate.yaml expects
    template: charts/dependencies/charts/postgresql/templates/cluster.yaml
    values:
      - ../ci/postgresql-certmanager-values.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              kind: ClusterIssuer
      dependencies:
        postgresql:
          fullnameOverride: custom-pg
          namespaceOverride: custom-ns
    asserts:
      - equal:
          path: metadata.name
          value: custom-pg
      - equal:
          path: metadata.namespace
          value: custom-ns
  - it: postgresql server Certificate namespace, commonName and dnsNames match that CR
    template: certificate/postgresql-certificate.yaml
    values:
      - ../ci/postgresql-certmanager-values.yaml
    set:
      global:
        armonik:
          certManager:
            issuer:
              kind: ClusterIssuer
      dependencies:
        postgresql:
          fullnameOverride: custom-pg
          namespaceOverride: custom-ns
    documentSelector:
      path: metadata.name
      value: custom-pg-server
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-ns
      - equal:
          path: spec.commonName
          value: custom-pg-rw
      - lengthEqual:
          path: spec.dnsNames
          count: 12
      - contains:
          path: spec.dnsNames
          content: custom-pg-rw.custom-ns.svc.cluster.local
      - contains:
          path: spec.dnsNames
          content: custom-pg-ro.custom-ns.svc
      - contains:
          path: spec.dnsNames
          content: custom-pg-r.custom-ns
  - it: postgresql Cluster CR gets the same four Secret names the Certificates write
    template: charts/dependencies/charts/postgresql/templates/cluster.yaml
    values:
      - ../ci/postgresql-certmanager-values.yaml
    asserts:
      - equal:
          path: spec.certificates
          value:
            serverTLSSecret: armonik-postgresql-server
            serverCASecret: armonik-postgresql-server
            replicationTLSSecret: armonik-postgresql-replication
            clientCASecret: armonik-postgresql-replication
