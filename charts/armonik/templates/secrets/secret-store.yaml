{{- if eq (include "armonik.conf.esoEnabled" .) "true" }}
{{- $sa := printf "%s-conf-eso" .Release.Name | trunc 63 | trimSuffix "-" }}
{{/* Dedicated read-only ServiceAccount for the Kubernetes-provider SecretStore. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "armonik.namespace" . }}
roleRef:
  kind: Role
  name: {{ $sa }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "armonik.conf.storeName" . }}
  namespace: {{ include "armonik.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ include "armonik.namespace" . }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $sa }}
{{- end }}
