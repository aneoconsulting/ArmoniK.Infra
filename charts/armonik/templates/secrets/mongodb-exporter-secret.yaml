{{/* ExternalSecret composing the MongoDB connection URI for the mongodb-exporter dependency
     (prometheus-mongodb-exporter) from the psmdb-db cluster-monitor credentials. Named and keyed
     by dependencies.mongodb-exporter.existingSecret.{name,key}, the single source of truth the
     exporter's own chart reads back - this template does not derive its own name. It lives in the
     exporter's namespace, reading MongoDB's Secrets through the stores secret-store.yaml renders there. */}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- with index .Subcharts.dependencies.Subcharts "mongodb-exporter" -}}
{{- $exporter := . -}}
{{- if not (hasKey $.Subcharts.dependencies.Subcharts "mongodb") -}}
  {{- fail "dependencies.mongodb-exporter.enabled requires dependencies.mongodb (psmdb-db) to be enabled: the exporter has no MongoDB to monitor" -}}
{{- end -}}
{{- if not $ops.externalSecrets.available -}}
  {{- fail "dependencies.mongodb-exporter.enabled requires the ExternalSecrets operator (global.armonik.operators.externalSecrets.available): MongoDB credentials are only readable at runtime through it" -}}
{{- end -}}
{{- with $.Subcharts.dependencies.Subcharts.mongodb -}}
{{- $mongo := . -}}
{{- $requireTls := (include "armonik.mongodb.requireTls" $mongo | fromYaml).enabled -}}
{{- $mongoNamespace := include "armonik.mongodb.namespace" $mongo -}}
{{- $host := include "armonik.mongodb.host" $mongo -}}
{{- $port := include "armonik.mongodb.port" $mongo | trim -}}
{{- $rs := list $mongo.Values "replsets" "rs0" "name" | include "armonik.utils.index" | default "rs0" -}}
{{- $secretName := include "armonik.mongodb.secretName" $mongo -}}
{{- $name := $exporter.Values.existingSecret.name -}}
{{- if not $name -}}
  {{- fail "dependencies.mongodb-exporter.existingSecret.name must name the Secret this ExternalSecret creates" -}}
{{- end -}}
{{- $key := $exporter.Values.existingSecret.key | default "mongodb-uri" -}}
{{- $namespace := include "armonik.mongodbExporter.namespace" $exporter -}}
{{- $storeOverride := list $mongoNamespace $ $namespace | include "armonik.conf.storeNameOverride" -}}
{{- /* Escape both credentials: the operator-generated password may contain @ : / ? */ -}}
{{- $uri := printf "mongodb://{{ .user | urlquery }}:{{ .password | urlquery }}@%s:%s/admin?replicaSet=%s" $host $port $rs -}}
{{- if $requireTls -}}
  {{- $uri = printf "%s&tls=true&tlsCAFile=/mongodb/certificate/ca.crt" $uri -}}
{{- end -}}
{{- $sslInternal := list $mongo.Values "secrets" "sslInternal" | include "armonik.utils.index" -}}
{{- $sslInternal = $sslInternal | default (printf "%s-ssl-internal" (include "psmdb-database.fullname" $mongo)) -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  # The psmdb-db Secret does not exist yet on a fresh install; converge onto it quickly once the
  # operator creates it, rather than waiting out conf-secrets.yaml's 1h default.
  refreshInterval: 1m0s
  secretStoreRef:
    kind: SecretStore
    name: {{ list "" $ $namespace | include "armonik.conf.storeName" | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{ $key }}: {{ $uri | quote }}
        {{- if $requireTls }}
        ca.crt: {{ printf "{{ .cacrt }}" | quote }}
        {{- end }}
  data:
    - secretKey: user
      remoteRef:
        key: {{ $secretName | quote }}
        property: MONGODB_CLUSTER_MONITOR_USER
      {{- with $storeOverride }}
      sourceRef:
        storeRef:
          kind: SecretStore
          name: {{ . | quote }}
      {{- end }}
    - secretKey: password
      remoteRef:
        key: {{ $secretName | quote }}
        property: MONGODB_CLUSTER_MONITOR_PASSWORD
      {{- with $storeOverride }}
      sourceRef:
        storeRef:
          kind: SecretStore
          name: {{ . | quote }}
      {{- end }}
    {{- if $requireTls }}
    - secretKey: cacrt
      remoteRef:
        key: {{ $sslInternal | quote }}
        property: ca.crt
      {{- with $storeOverride }}
      sourceRef:
        storeRef:
          kind: SecretStore
          name: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end -}}
{{- end -}}
