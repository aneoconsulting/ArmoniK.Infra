# Partition fan-out: one Deployment (+ one ScaledObject with keda enabled) per
# partition, per-partition values merged over partitionCommon: worker image,
# tcp agent/worker channel (bench keeps the unix-socket default), custom KEDA
# trigger threshold.
partitions:
  bench:
    worker:
      # Reference-string form, accepted anywhere an image object is.
      image: dockerhubaneo/armonik_core_bench_test_worker:0.0.0-test
  htcmock:
    socketType: "tcp"
    worker:
      image:
        repository: dockerhubaneo/armonik_core_htcmock_test_worker
    hpa:
      triggers:
        - type: prometheus
          metadata:
            serverAddress: http://prometheus-prometheus:9090
            metricName: "armonik_{{ .Values.partitionName }}_tasks_queued"
            threshold: "5"
            namespace: "{{ .Release.Namespace }}"
            query: 'armonik_{{ .Values.partitionName }}_tasks_queued{job="metrics-exporter"}'
