  #           Format regex
  #           Regex  ^(?<host>[^ ]*) [^ ]* (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^ ]*) +\S*)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
  #           Time_Key time
  #           Time_Format %d/%b/%Y:%H:%M:%S %z
  #       [PARSER]
  #           Name   apache_error
  #           Format regex
  #           Regex  ^\[[^ ]* (?<time>[^\]]*)\] \[(?<level>[^\]]*)\](?: \[pid (?<pid>[^\]]*)\])?( \[client (?<client>[^\]]*)\])? (?<message>.*)$
  #       [PARSER]
  #           Name   nginx
  #           Format regex
  #           Regex ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
  #           Time_Key time
  #           Time_Format %d/%b/%Y:%H:%M:%S %z
  #       [PARSER]
  #           Name   json
  #           Format json
  #           Time_Key time
  #           Time_Format %d/%b/%Y:%H:%M:%S %z
  #       [PARSER]
  #           Name        docker
  #           Format      json
  #           Time_Key    time
  #           Time_Format %Y-%m-%dT%H:%M:%S.%L
  #           Time_Keep   On
  #       [PARSER]
  #           Name cri
  #           Format regex
  #           Regex ^(?:(?<time>[^\s]+)\s+(?<stream>\w+)\s+(?<logtag>\w+)\s+)?(?<log>\{.*\})$
  #           Time_Key time
  #           Time_Format %Y-%m-%dT%H:%M:%S.%L
  #           Time_Keep On
  #           Decode_Field_As json log
  #       [PARSER]
  #           Name        syslog
  #           Format      regex
  #           Regex       ^\<(?<pri>[0-9]+)\>(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
  #           Time_Key    time
  #           Time_Format %b %d %H:%M:%S

  # == Seq ==
  seq:
    enabled: true
    persistence:
      enabled: false
    image:
      pullPolicy: IfNotPresent
    #   repository: $REPO-NAME/datalust/seq
    env:
      SEQ_API_LISTENURI: "http://+:5341"
    # imagePullSecrets: []
    # priorityClassName:
    # A fresh Seq needs an admin password (firstRunAdminPassword, or firstRunAdminPasswordHash for
    # better confidentiality) unless firstRunNoAuthentication is set, which is unfit for production.
    # See https://github.com/datalust/helm.datalust.co/blob/main/charts/seq/values.yaml
    firstRunNoAuthentication: true
    # Applied once networkPolicy.enabled=true: ingress from fluent-bit (5341) and the ingress (80).
    networkPolicy:
      ingress:
        # namespaceSelector {} admits any namespace; narrow it to the peers' namespaces once known.
        - from:
            - namespaceSelector: {}
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: fluent-bit
          ports:
            - protocol: TCP
              port: 5341
        - from:
            - namespaceSelector: {}
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: ingress
          ports:
            - protocol: TCP
              port: 80


  # Not subcharts: umbrella-only settings of ArmoniK's GCS object storage and Pub/Sub queue adapters
  # (templates/storage/_gcs.tpl, _pubsub.tpl).

  # == GCS ==
  gcs:
    enabled: false
    projectId: ""  # required when gcs.enabled
    bucketName: ""  # required when gcs.enabled
    emulatorEndpoint: ""
    credentialsFilePath: ""

  # == Pub/Sub ==
  pubsub:
    enabled: false
    projectId: ""  # required when pubsub.enabled
    prefix: ""
    kmsKeyName: ""


# ==== Network policies ====
# The umbrella's own NetworkPolicies (templates/networkpolicies/): the control and compute planes,
# the egress of nginx, fluent-bit and KEDA, then MongoDB, Redis, ActiveMQ and mongodb-exporter.
# Every other dependency and operator has its own networkPolicy.enabled, independent of this one.
# Inventory in charts/network-policies.md.
networkPolicy:
  # Renders every policy above, extraPolicies included.
  enabled: false
  # Your own NetworkPolicies, each with its own podSelector and rules, e.g.:
  # extraPolicies:
  #   - name: allow-custom-scraper
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: control-plane
  #     ingress:
  #       - from:
  #           - namespaceSelector:
  #               matchLabels:
  #                 kubernetes.io/metadata.name: monitoring
  #         ports:
  #           - protocol: TCP
  #             port: 9090
  extraPolicies: []

  # podSelector of the MongoDB pods, labelled by psmdb-operator rather than their own chart.
  # mongodbPodSelector:
  #   matchLabels:
  #     app.kubernetes.io/name: percona-server-mongodb

  # Same for the KEDA operator pods.
  # kedaPodSelector:
  #   matchLabels:
  #     app.kubernetes.io/name: keda-operator

# ==== Operators (armonik-operators, alias operators) ====
# Only the ArmoniK-specific overrides; the operators' base configuration is in
# armonik-operators/values.yaml.
operators:
  # Kubernetes-flavor policies, applied once networkPolicy.enabled=true, plus egress to the
  # Kubernetes API (443, 6443) for each KEDA component.
  keda:
    networkPolicy:
      flavor: "kubernetes"
      kubernetes:
        metricsServer:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443
        operator:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443
        webhooks:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443

  # Egress to DNS and the Kubernetes API (443, 6443), for the controller, webhook and cert
  # controller alike, applied once their networkPolicy.enabled=true.
  external-secrets:
    networkPolicy:
      enabled: false
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - ports:
          - protocol: TCP
            port: 443
        - ports:
          - protocol: TCP
            port: 6443
    webhook:
      networkPolicy:
        enabled: false
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - ports:
            - protocol: TCP
              port: 443
          - ports:
            - protocol: TCP
              port: 6443

    certController:
      networkPolicy:
        enabled: false
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - ports:
            - protocol: TCP
              port: 443
          - ports:
            - protocol: TCP
              port: 6443

  kube-prometheus:
    # Restricting this stack takes at least the networkPolicy of prometheusOperator,
    # kube-state-metrics and prometheus.
    # prometheusOperator:
    #   networkPolicy:
    #     enabled: true
    # kube-state-metrics:
    #   networkPolicy:
    #     enabled: true

    # prometheus carries ArmoniK-specific rules, applied once networkPolicy.enabled=true.
    prometheus:
      networkPolicy:
        enabled: false
        # namespaceSelector {} admits any namespace on every peer below; narrow it to each peer's
        # namespace once known.
        ingress:
          - from:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
            ports:
              - protocol: TCP
                port: 9090

        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53

          # Control plane
          - ports:
              - protocol: TCP
                port: 1081
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/component: control-plane

          # Metrics exporter
          - ports:
              - protocol: TCP
                port: 1080
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/component: metrics-exporter

          # Compute plane
          - ports:
              - protocol: TCP
                port: 1080
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: compute-plane

          # Kube-state-metrics
          - ports:
              - protocol: TCP
                port: 8080
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kube-state-metrics

          # Grafana
          - ports:
              - protocol: TCP
                port: 3000
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana

          # KEDA metrics API server
          - ports:
              - protocol: TCP
                port: 8080
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: keda-operator-metrics-apiserver

          # cert-manager controller
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/component: controller
                    app.kubernetes.io/name: cert-manager

          # cert-manager webhook
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/component: webhook
                    app.kubernetes.io/name: webhook

          # cert-manager cainjector
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - namespaceSelector: {}
                podSelector:
                  matchLabels:
                    app.kubernetes.io/component: cainjector
                    app.kubernetes.io/name: cainjector

          # Prometheus Operator, Kubelet and node-exporter
          - ports:
              - protocol: TCP
                port: 10250
              - protocol: TCP
                port: 9100

          # Kubernetes API server
          - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443

          # CoreDNS metrics
          - ports:
              - protocol: TCP
                port: 9153
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns

  cert-manager:
    # cert-manager's own startupapicheck Job gates our hooked shared Issuer (weight 0) and
    # Certificates (weight 10) on the webhook being ready. Upstream runs it post-install at weight 1;
    # post-upgrade is added since upgrades touch those CRs too, and weight -1 keeps it after its
    # ServiceAccount/RBAC hooks (-5) but ahead of what it gates.
    startupapicheck:
      timeout: 300s
      jobAnnotations:
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-weight: "-1"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    # Restricting cert-manager takes the networkPolicy of all three components (controller,
    # cainjector, webhook).
    # networkPolicy:
    #   enabled: true
    # cainjector:
    #   networkPolicy:
    #     enabled: true
    # webhook:
    #   networkPolicy:
    #     enabled: true
