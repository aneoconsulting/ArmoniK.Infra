################## NETWORK POLICIES ##################
# These settings are specific to the ArmoniK umbrella chart.
# The policies declared for control-plane, compute-plane, and fluent-bit are egress
# rules managed by ArmoniK itself. Ingress rules are generally defined by the
# upstream dependency charts, with MongoDB as the main exception where the
# ingress and egress policies are explicitly configured in this chart.
#
# By default, NetworkPolicy resources are disabled per component. To restrict
# traffic for a given component, set its `networkPolicy.enabled: true` (naming
# varies per chart, see each dependency's own values). 
networkPolicy:
  control-plane:
    enabled: false
    submitter:
      enabled: true
    metricsExporter:
      enabled: true

  compute-plane:
    enabled: false

  mongodb:
    enabled: false
    operator:
      enabled: true
    server:
      enabled: true

  fluent-bit:
    enabled: false

operators:
  keda:
    networkPolicy:
      flavor: "kubernetes"
      kubernetes:
        metricsServer:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443
        operator:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443
        webhooks:
          extraEgressRules:
            - ports:
                - protocol: TCP
                  port: 443
                - protocol: TCP
                  port: 6443

  external-secrets:
    networkPolicy:
    # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - protocol: UDP
              port: 53
            - protocol: TCP
              port: 53
        - ports:
          - protocol: TCP
            port: 443
        - ports:
          - protocol: TCP
            port: 6443
    webhook:
    # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
      networkPolicy:
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - ports:
            - protocol: TCP
              port: 443
          - ports:
            - protocol: TCP
              port: 6443          
      
    certController:
    # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
      networkPolicy:
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
          - ports:
            - protocol: TCP
              port: 443
          - ports:
            - protocol: TCP
              port: 6443

  kube-prometheus:
    ### Network policy
    # Minimum required for this deployment: enable the networkPolicy
    # on prometheusOperator, kube-state-metrics and prometheus. 
    
    # prometheusOperator:
    #   networkPolicy:
    #     enabled: true
    # kube-state-metrics:
    #   networkPolicy:
    #     enabled: true

    # The prometheus component is already configured with ArmoniK-specific ingress/egress
    # Set networkPolicy.enabled: true to apply the default NetworkPolicy for this component.
    prometheus:
      networkPolicy:
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana
            ports:
              - protocol: TCP
                port: 9090

        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53

          # Control plane
          - ports:
              - protocol: TCP
                port: 1081
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: control-plane

          # Metrics exporter
          - ports:
              - protocol: TCP
                port: 1080
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: metrics-exporter

          # Kube-state-metrics
          - ports:
              - protocol: TCP
                port: 8080
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: kube-state-metrics

          # Grafana
          - ports:
              - protocol: TCP
                port: 3000
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: grafana

          # KEDA metrics API server
          - ports:
              - protocol: TCP
                port: 8080
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: keda-operator-metrics-apiserver

          # cert-manager controller
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: controller
                    app.kubernetes.io/name: cert-manager

          # cert-manager webhook
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: webhook
                    app.kubernetes.io/name: webhook

          # cert-manager cainjector
          - ports:
              - protocol: TCP
                port: 9402
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: cainjector
                    app.kubernetes.io/name: cainjector

          # Prometheus Operator
          - ports:
              - protocol: TCP
                port: 10250
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: prometheus-operator

            # CoreDNS metrics
          - ports:
              - protocol: TCP
                port: 9153
            to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns

  # cert-manager:
  ### Network policy
  # Minimum required for this deployment: enable the default networkPolicy on
  # all three cert-manager sub-components below (controller, cainjector, webhook).

  #   networkPolicy:
  #     enabled: true
  #   cainjector:
  #     networkPolicy:
  #       enabled: true
  #   webhook:
  #     networkPolicy:
  #       enabled: true