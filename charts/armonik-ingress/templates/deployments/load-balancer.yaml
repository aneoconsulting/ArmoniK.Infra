{{- if .Values.loadBalancer.enabled }}
{{/* Own release train, not the chart AppVersion. */}}
{{- $image := list $ "loadBalancer.image" .Values.loadBalancer.image | include "armonik.utils.imageConf" | fromYaml }}
{{- $ctx := dict "root" $ "image" $image -}}
{{- $podSpec := list (include "armonik.ingress.lb.podSpec" $ctx) .Values.loadBalancer.podSpecPatch "loadBalancer.podSpecPatch" | include "armonik.utils.patch" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-load-balancer" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: load-balancer
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with coalesce .Values.loadBalancer.annotations .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.loadBalancer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: load-balancer
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The LB reads lb.yml (and the cluster certs) only at startup, so roll the pod whenever either changes
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/load-balancer.yaml") . | sha256sum }}
        checksum/certs: {{ include (print $.Template.BasePath "/secrets/lb-cluster-certs.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/component: load-balancer
        {{- include "armonik.selectorLabels" . | nindent 8 }}
    spec: {{- $podSpec | nindent 6 }}
{{- end }}
