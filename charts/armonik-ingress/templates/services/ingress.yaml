apiVersion: v1
kind: Service
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    app.kubernetes.io/component: ingress
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with coalesce .Values.service.annotations .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if eq .Values.service.type "HeadLess" }}
  type: "ClusterIP"
  clusterIP: "None"
{{ else }}
  type: {{ include "armonik.ingress.serviceType" . }}
{{- end }}
  selector:
    app.kubernetes.io/component: ingress
    {{- include "armonik.selectorLabels" . | nindent 4 }}
  ports:
  {{- range .Values.ports }}
  - name: {{ .name }}
    port: {{ eq $.Values.service.type "HeadLess" | ternary (include "armonik.ingress.containerPort" (dict "protocol" .protocol "root" $)) .servicePort }}
    targetPort: {{ include "armonik.ingress.containerPort" (dict "protocol" .protocol "root" $) }}
    protocol: TCP
    {{- if and (eq .protocol "grpc") (or $.Values.tls.enabled $.Values.gateway.tls.enabled) }}
    appProtocol: "kubernetes.io/h2c"
    {{- end }}
  {{- end }}
