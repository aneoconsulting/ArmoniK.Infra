suite: urls Secret store and sync
release:
  name: t
templates:
  - armonik-nginx-conf.yaml
values:
  - ../ci/default-values.yaml
tests:
  - it: reads its own Kubernetes-provider store every minute by default
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.secretStoreRef
          value:
            kind: SecretStore
            name: t-armonik-ingress-nginx-conf
      - equal:
          path: spec.refreshInterval
          value: 1m0s
      - notExists:
          path: spec.refreshPolicy
      - equal:
          path: spec.dataFrom[0].extract.key
          value: example-urls
  - it: routes the urls Secret to a pre-existing store
    set:
      urlsSecretStoreName: vault-backend
      urlsSecretStoreKind: ClusterSecretStore
      urlsSecretVersion: "7"
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: vault-backend
      - equal:
          path: spec.dataFrom[0].extract.version
          value: "7"
  - it: takes a refresh interval and policy of its own
    set:
      conf:
        refreshInterval: 2h
        refreshPolicy: OnChange
    asserts:
      - equal:
          path: spec.refreshInterval
          value: 2h
      - equal:
          path: spec.refreshPolicy
          value: OnChange
  - it: rejects a store name combined with a namespace
    set:
      urlsSecretStoreName: vault-backend
      urlsSecretNamespace: other
    asserts:
      - failedTemplate:
          errorPattern: 'urlsSecretStoreName excludes urlsSecretNamespace'
