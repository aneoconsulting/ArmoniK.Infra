suite: render-time guards
templates:
  - validate.yaml
release:
  name: t
tests:
  - it: fails when grafana root_url carries a path
    set:
      dependencies:
        grafana:
          grafana.ini:
            server:
              root_url: http://grafana/grafana
    asserts:
      - failedTemplate:
          errorPattern: "must not carry a path"
  - it: fails when grafana serve_from_sub_path is enabled
    set:
      dependencies:
        grafana:
          grafana.ini:
            server:
              serve_from_sub_path: true
    asserts:
      - failedTemplate:
          errorPattern: "must stay false"
  - it: fails when MongoDB and PostgreSQL are both set
    set:
      dependencies:
        mongodb:
          enabled: true
        postgresql:
          connection:
            host: pg.example
    asserts:
      - failedTemplate:
          errorPattern: "mongodb, postgresql back the same table storage slot"
  - it: fails when two queues are enabled
    set:
      dependencies:
        activemq:
          enabled: true
        sqs:
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "activemq, sqs back the same queue slot"
