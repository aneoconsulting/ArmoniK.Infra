suite: securityContext on the init Job
templates:
  - init.yaml
values:
  - ../ci/partitions-values.yaml
release:
  name: t
tests:
  - it: runs the init pod as nobody by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 65534
            runAsGroup: 65534
  - it: ignores global.armonik.runAsUser and runAsGroup, which only the agent and worker take
    set:
      global.armonik.runAsUser: 1234
      global.armonik.runAsGroup: 4321
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 65534
            runAsGroup: 65534
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
  - it: hardens the init container by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
  - it: drops both securityContexts when nulled
    set:
      init.podSecurityContext: null
      init.securityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext
  - it: lets containerPatch override a single field
    set:
      init.containerPatch:
        securityContext:
          readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
