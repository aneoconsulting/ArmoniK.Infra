# Gateway API path: Gateway, HTTPRoute and (GKE) HealthCheckPolicy, the HTTPRoute forcing the
# Service type to ClusterIP (armonik.ingress.serviceType).
global:
  environment:
    name: ci
    description: ArmoniK CI environment
urlsSecretName: example-urls
gateway:
  enabled: true
  # No chart default; templates/validate.yaml requires it.
  gatewayClassName: example-gateway-class
httpRoute:
  enabled: true
healthCheckPolicy:
  enabled: true
