{{/* One mount Secret per conf layer, always rendered so pods can mount it non-optionally. If the
     layer declares mountSecret sources, an ExternalSecret aggregates them via dataFrom.extract,
     prefixing keys per mount name to avoid collisions (e.g. ca.crt across backends); else an empty
     Secret. Only "core" has sources by default; any layer may add via conf.<layer>.mountSecret. */}}
{{- if eq (include "armonik.conf.esoEnabled" .) "true" -}}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "jobs" -}}
{{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml -}}
{{- $name := list $layer $ | include "armonik.conf.mountSecretName" -}}
{{- if $conf.mountSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "armonik.namespace" $ }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: {{ include "armonik.conf.storeName" $ }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  dataFrom:
    {{- range $mname, $mount := $conf.mountSecret }}
    - extract:
        key: {{ $mount.secret | quote }}
      rewrite:
        - regexp:
            source: "^"
            target: {{ printf "%s-" $mname | quote }}
    {{- end }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "armonik.namespace" $ }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
type: Opaque
{{- end }}
{{- end }}
{{- end -}}
