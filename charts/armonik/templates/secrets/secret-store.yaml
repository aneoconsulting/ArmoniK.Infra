{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- if $ops.externalSecrets.available }}
{{- $sa := printf "%s-conf" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $currentNamespace := include "armonik.namespace" . }}
{{- /* Namespaces holding our ExternalSecrets (the conf layers', mongodb-exporter's), each mapped to
       the other namespaces it reads. Each gets a read-only ServiceAccount, a base store reading it and
       one store per other namespace (armonik.conf.storeName). A storeName-routed source needs none. */}}
{{- $reads := dict $currentNamespace dict }}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "init" }}
  {{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml }}
  {{- $namespaces := list }}
  {{- range $name, $ref := $conf.envFromSecret }}
    {{- if not $ref.storeName }}
      {{- $namespaces = append $namespaces $ref.namespace }}
    {{- end }}
  {{- end }}
  {{- range $s := $conf.envSecret }}
    {{- $item := include "armonik.conf.secretItem" $s | fromYaml }}
    {{- if not $item.storeName }}
      {{- $namespaces = append $namespaces $item.namespace }}
    {{- end }}
  {{- end }}
  {{- range $mount := $conf.mountSecret }}
    {{- if not $mount.storeName }}
      {{- $namespaces = append $namespaces $mount.namespace }}
    {{- end }}
  {{- end }}
  {{- range $namespace := $namespaces }}
    {{- if and $namespace (ne $namespace $currentNamespace) }}
      {{- $_ := set (index $reads $currentNamespace) $namespace true }}
    {{- end }}
  {{- end }}
{{- end }}
{{- with include "armonik.mongodbExporter.storeReads" $ | fromYaml }}
  {{- if not (hasKey $reads .consumer) }}
    {{- $_ := set $reads .consumer dict }}
  {{- end }}
  {{- if ne .remote .consumer }}
    {{- $_ := set (index $reads .consumer) .remote true }}
  {{- end }}
{{- end }}

{{- /* One Role and RoleBinding per namespace read, binding every ServiceAccount that reads it. */}}
{{- $readers := dict }}
{{- range $consumer, $remotes := $reads }}
  {{- range $namespace := append (keys $remotes) $consumer }}
    {{- $current := index $readers $namespace | default list }}
    {{- $_ := set $readers $namespace (append $current $consumer) }}
  {{- end }}
{{- end }}

{{- range $consumer := keys $reads | sortAlpha }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $consumer | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
{{- range $namespace := prepend (keys (index $reads $consumer) | sortAlpha) $consumer }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ list $namespace $ $consumer | include "armonik.conf.storeName" | quote }}
  namespace: {{ $consumer | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $namespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $sa | quote }}
{{- end }}
{{- end }}

{{- range $namespace := keys $readers | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
subjects:
  {{- range $consumer := index $readers $namespace | uniq | sortAlpha }}
  - kind: ServiceAccount
    name: {{ $sa | quote }}
    namespace: {{ $consumer | quote }}
  {{- end }}
roleRef:
  kind: Role
  name: {{ $sa | quote }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
