{{ if (include "armonik.dependencies" $ | fromYaml).grafana }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-armonik
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |-
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: {{ include "armonik.monitoring.prometheusUrl" $ | quote }}
        isDefault: true
        uid: "PBFA97CFB590B2093"
        jsonData:
          tlsSkipVerify: true
        version: 1
{{ end }}
