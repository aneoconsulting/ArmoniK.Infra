{{- $issuer := include "armonik.certManager.issuer" $ | fromYaml -}}
{{- if and $issuer.enabled $issuer.create -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- $name := required "global.armonik.certManager.issuer.name is required when issuer.create=true" $issuer.name -}}
{{- $provider := index $.Values $issuer.provider | default dict -}}
{{- if eq $issuer.provider "selfSigned" -}}
apiVersion: cert-manager.io/v1
kind: {{ $issuer.kind }}
metadata:
  name: {{ $name }}
  {{- if eq $issuer.kind "Issuer" }}
  namespace: {{ include "armonik.namespace" . }}
  {{- end }}
  {{- if $ops.certManager.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  selfSigned: {}
{{- else if eq $issuer.provider "googleCas" -}}
{{- if not (or $ops.googleCasIssuer.deploy $ops.googleCasIssuer.available) -}}
{{- fail "global.armonik.certManager.issuer.provider=googleCas requires the Google CAS Issuer operator: set global.armonik.operators.googleCasIssuer.deploy=true (this release installs it) or .available=true (installed by another release)." -}}
{{- end -}}
{{- if and (ne $issuer.kind "GoogleCASIssuer") (ne $issuer.kind "GoogleCASClusterIssuer") -}}
{{- fail (printf "global.armonik.certManager.issuer.kind %q is invalid for provider=googleCas: set it to GoogleCASIssuer or GoogleCASClusterIssuer." $issuer.kind) -}}
{{- end -}}
{{- if ne $issuer.group "cas-issuer.jetstack.io" -}}
{{- fail (printf "global.armonik.certManager.issuer.group %q is invalid for provider=googleCas: set it to cas-issuer.jetstack.io (the default cert-manager.io only fits selfSigned/venafi)." $issuer.group) -}}
{{- end -}}
apiVersion: cas-issuer.jetstack.io/v1beta1
kind: {{ $issuer.kind }}
metadata:
  name: {{ $name }}
  {{- if eq $issuer.kind "GoogleCASIssuer" }}
  namespace: {{ include "armonik.namespace" . }}
  {{- end }}
  {{- if $ops.googleCasIssuer.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  project: {{ required "googleCas.project is required" $provider.project | quote }}
  location: {{ required "googleCas.location is required" $provider.location | quote }}
  caPoolId: {{ required "googleCas.caPoolId is required" $provider.caPoolId | quote }}
  {{- with $provider.certificateAuthorityId }}
  certificateAuthorityId: {{ . | quote }}
  {{- end }}
  {{- with $provider.credentials }}
  {{- if .name }}
  credentials:
    name: {{ .name | quote }}
    key: {{ .key | default "credentials.json" | quote }}
  {{- end }}
  {{- end }}
{{- else if eq $issuer.provider "venafi" -}}
{{- $tpp := $provider.tpp | default dict -}}
{{- $cloud := $provider.cloud | default dict -}}
apiVersion: cert-manager.io/v1
kind: {{ $issuer.kind }}
metadata:
  name: {{ $name }}
  {{- if eq $issuer.kind "Issuer" }}
  namespace: {{ include "armonik.namespace" . }}
  {{- end }}
  {{- if $ops.certManager.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  venafi:
    zone: {{ required "venafi.zone is required" $provider.zone | quote }}
    {{- if $tpp.url }}
    tpp:
      url: {{ $tpp.url | quote }}
      credentialsRef:
        name: {{ required "venafi.tpp.credentialsRef.name is required" $tpp.credentialsRef.name | quote }}
      {{- with $tpp.caBundle }}
      caBundle: {{ . | b64enc | quote }}
      {{- end }}
    {{- else }}
    cloud:
      apiTokenSecretRef:
        name: {{ required "venafi.cloud.apiTokenSecretRef.name is required" $cloud.apiTokenSecretRef.name | quote }}
        key: {{ $cloud.apiTokenSecretRef.key | default "apikey" | quote }}
    {{- end }}
{{- else -}}
{{- fail (printf "global.armonik.certManager.issuer.provider %q is not recognized: use selfSigned, venafi or googleCas." $issuer.provider) -}}
{{- end -}}
{{- end -}}
