{{- $image := list . "gui.image" .Values.gui.image | include "armonik.utils.imageConf" | fromYaml }}
{{- $ctx := dict "root" $ "image" $image -}}
{{- $podSpec := list (include "armonik.ingress.gui.podSpec" $ctx) .Values.gui.podSpecPatch "gui.podSpecPatch" | include "armonik.utils.patch" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-gui" | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    app.kubernetes.io/component: gui
    {{- include "armonik.labels" . | nindent 4 }}
    {{- with .Values.gui.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.annotations}}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: gui
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: gui
        {{- include "armonik.labels" . | nindent 8 }}
        {{- with .Values.gui.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.gui.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec: {{- $podSpec | nindent 6 }}
