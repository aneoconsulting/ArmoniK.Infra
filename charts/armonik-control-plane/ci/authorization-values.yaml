# Authorization surface: methods, the access model permission sets with one added and one removed,
# grants with and without condition, identity settings (Authorization__* and Identity__* in the
# control plane and the init Job), and extra partitions (indexed InitServices__Partitioning__*).
init:
  enabled: true
extraPartitions:
  default:
    podMax: 100
    podReserved: 50
    preemptionPercentage: 20
    priority: 1
  gpu:
    priority: 2
authorization:
  authentication: Xfcc, Proxy
  configRevision: 3
  accessModelSets: true
  permissionSets:
    team-reader: [data:read, data:download]
    access-admin: null
  grants:
    team-own:
      principal: role:modelling-team
      permissionSet: session-own
      condition: session.owner == request.caller && grant.principal in session.createdUnder
    platform:
      principal: role:platform-team
      permissionSet: cluster-admin
    removed: null
  identity:
    UserHeader: X-Auth-Request-Email
