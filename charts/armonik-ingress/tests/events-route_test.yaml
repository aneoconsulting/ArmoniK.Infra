suite: events route to the dedicated control plane
release:
  name: t
templates:
  - armonik-nginx-conf.yaml
values:
  - ../ci/default-values.yaml
tests:
  - it: routes Events through the URLs Secret key, only when the key is present
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: '(?s)\{\{- if index \. "control-plane-events" \}\}\s+upstream armonik_events \{\s+zone armonik_events_zone 32k;\s+server \{\{ index \. "control-plane-events" \| quote \}\} resolve;.*?\}\s+\{\{- end \}\}'
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: '(?s)\{\{- if index \. "control-plane-events" \}\}\s+# [^\n]*\n\s+location \^~ /armonik\.api\.grpc\.v1\.events\.Events/ \{\s+grpc_pass grpc://armonik_events;.*?\}\s+\{\{- end \}\}\s+location ~\* \^/armonik\\\. \{\s+grpc_pass grpc://armonik;'

  - it: routes Events to control_plane_events_url without any template condition
    set:
      urlsSecretName: ""
      control_plane_url: control-plane:5001
      control_plane_events_url: control-plane-events:1080
    asserts:
      - isKind:
          of: Secret
      - matchRegex:
          path: stringData["armonik.conf"]
          pattern: '(?m)^\s+server "control-plane-events:1080" resolve;$'
      - matchRegex:
          path: stringData["armonik.conf"]
          pattern: '(?m)^\s+location \^~ /armonik\.api\.grpc\.v1\.events\.Events/ \{$'
      - notMatchRegex:
          path: stringData["armonik.conf"]
          pattern: 'control-plane-events" \}\}'

  - it: sizes the events zone with upstreamZoneSize
    set:
      upstreamZoneSize: 1m
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: '(?m)^\s+zone armonik_events_zone 1m;$'

  - it: sets the mTLS identity headers on the events route too
    set:
      urlsSecretName: ""
      control_plane_url: control-plane:5001
      control_plane_events_url: control-plane-events:1080
      tls.enabled: true
      mtls.enabled: true
    asserts:
      - matchRegex:
          path: stringData["armonik.conf"]
          pattern: '(?s)location \^~ /armonik\.api\.grpc\.v1\.events\.Events/ \{\s+grpc_set_header X-Certificate-Client-CN \$client_cn;\s+grpc_set_header X-Certificate-Client-Fingerprint \$client_fingerprint;\s+grpc_pass grpc://armonik_events;'

  - it: leaves Events on the main upstream with no events URL and no ESO
    set:
      urlsSecretName: ""
      control_plane_url: control-plane:5001
    asserts:
      - notMatchRegex:
          path: stringData["armonik.conf"]
          pattern: 'armonik_events'

  - it: never routes Events around the multi-cluster load balancer
    set:
      loadBalancer.enabled: true
      control_plane_events_url: control-plane-events:1080
    asserts:
      - notMatchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: 'armonik_events'
