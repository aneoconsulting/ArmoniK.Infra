# Deterministic minimal profile: every third-party dependency disabled. Keeps the render small,
# offline-friendly and reproducible (no operator CRs, no randAlphaNum redis-users Secret). Used by
# test/matrix.sh and the umbrella unittest suites, and linted by ct.
#
# deploy=false drops the operator subcharts, available=false the operator-gated resources
# (SecretStore, ExternalSecrets, monitors, ScaledObjects).
global:
  armonik:
    operators:
      externalSecrets:
        deploy: false
        available: false
      keda:
        deploy: false
        available: false
      certManager:
        deploy: false
        available: false
      mongodbOperator:
        deploy: false
        available: false
      prometheusOperator:
        deploy: false
        available: false
dependencies:
  redis:
    enabled: false
  activemq:
    enabled: false
  mongodb:
    enabled: false
  mongodb-exporter:
    enabled: false
  grafana:
    enabled: false
  fluent-bit:
    enabled: false
  seq:
    enabled: false
