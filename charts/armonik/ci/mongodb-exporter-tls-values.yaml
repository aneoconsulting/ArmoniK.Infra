# mongodb-exporter-values.yaml with MongoDB TLS required: the ExternalSecret then also pulls
# ca.crt (from <fullname>-ssl-internal, secrets.sslInternal being unset) and the URI carries
# tls=true&tlsCAFile.
global:
  armonik:
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: external-secrets
      prometheusOperator:
        deploy: false
        available: true
        namespace: monitoring
networkPolicy:
  enabled: true
dependencies:
  mongodb-exporter:
    enabled: true
  mongodb:
    unsafeFlags:
      tls: false
