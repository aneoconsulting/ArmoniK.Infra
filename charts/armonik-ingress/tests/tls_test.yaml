suite: tls and mtls
templates:
  - certificate.yaml
  - armonik-nginx-conf.yaml
  - services/ingress.yaml
values:
  - ../ci/tls-mtls-values.yaml
tests:
  # Gating these CRs on a self-installed cert-manager's webhook is the umbrella's job (cert-manager's
  # own startupapicheck hook); covered by armonik/tests/operators_test.yaml.
  - it: renders the Certificate and its Issuer
    template: certificate.yaml
    asserts:
      - containsDocument:
          kind: Certificate
          apiVersion: cert-manager.io/v1
          any: true
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          any: true
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
        documentSelector:
          path: kind
          value: Issuer
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
        documentSelector:
          path: kind
          value: Certificate
  - it: references an existing issuer instead of creating one
    template: certificate.yaml
    set:
      tls:
        certManager:
          existingIssuer:
            enabled: true
            kind: ClusterIssuer
            name: my-issuer
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          any: true
        not: true
      - equal:
          path: spec.issuerRef.name
          value: my-issuer
        documentSelector:
          path: kind
          value: Certificate
  - it: turns on client certificate verification with mTLS
    template: armonik-nginx-conf.yaml
    asserts:
      - matchRegex:
          path: spec.target.template.data["armonik.conf"]
          pattern: ssl_verify_client on
  - it: local fallback Issuer honors tls.certManager.provider=googleCas, forwarded as-is
    template: certificate.yaml
    set:
      tls:
        certManager:
          provider: googleCas
          googleCas:
            project: my-project
            location: europe-west1
            caPoolId: my-pool
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: GoogleCASIssuer
        documentSelector:
          path: kind
          value: GoogleCASIssuer
      - equal:
          path: spec.project
          value: my-project
        documentSelector:
          path: kind
          value: GoogleCASIssuer
      - equal:
          path: spec.issuerRef
          value:
            name: RELEASE-NAME-armonik-ingress-issuer
            kind: GoogleCASIssuer
            group: cas-issuer.jetstack.io
        documentSelector:
          path: kind
          value: Certificate
  - it: local fallback fails when tls.certManager.googleCas is empty (same guard as the umbrella's shared issuer)
    template: certificate.yaml
    set:
      tls:
        certManager:
          provider: googleCas
    asserts:
      - failedTemplate:
          errorPattern: "tls.certManager.googleCas is required for provider=googleCas"
  - it: setting certManager.provider keeps its own local Issuer even though the shared issuer is enabled
    template: certificate.yaml
    set:
      tls:
        certManager:
          provider: selfSigned
      global:
        armonik:
          certManager:
            issuer:
              enabled: true
              name: shared-issuer
    asserts:
      - notFailedTemplate: {}
      - containsDocument:
          kind: Issuer
          apiVersion: cert-manager.io/v1
          any: true
      - equal:
          path: spec.issuerRef.name
          value: RELEASE-NAME-armonik-ingress-issuer
        documentSelector:
          path: kind
          value: Certificate
  - it: fails TLS via cert-manager when the operator is unavailable and no issuer exists
    template: certificate.yaml
    set:
      global:
        armonik:
          operators:
            certManager:
              deploy: false
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "ingress TLS via cert-manager requires it"
  - it: Service and Certificate share the same name and namespace under overrides
    set:
      fullnameOverride: custom-ingress
      namespaceOverride: ingress-ns
    asserts:
      - equal:
          path: metadata.name
          value: custom-ingress
        template: services/ingress.yaml
      - equal:
          path: metadata.namespace
          value: ingress-ns
        template: services/ingress.yaml
      - equal:
          path: metadata.namespace
          value: ingress-ns
        template: certificate.yaml
        documentSelector:
          path: kind
          value: Certificate
      - contains:
          path: spec.dnsNames
          content: custom-ingress.ingress-ns
        template: certificate.yaml
        documentSelector:
          path: kind
          value: Certificate
