# PostgreSQL as the table storage, its server and replication certificates issued by cert-manager
# from the shared issuer instead of the CloudNativePG operator's own CA.
global:
  armonik:
    certManager:
      issuer:
        enabled: true
certManagerIssuer:
  create: true
  provider: ca
  ca:
    secretName: armonik-ca-key-pair
dependencies:
  mongodb:
    enabled: false
  mongodb-exporter:
    enabled: false
  postgresql:
    enabled: true
    certManager:
      enabled: true
    cluster:
      certificates:
        serverTLSSecret: armonik-postgresql-server-tls
        serverCASecret: armonik-postgresql-server-tls
        replicationTLSSecret: armonik-postgresql-replication-tls
        clientCASecret: armonik-postgresql-replication-tls
