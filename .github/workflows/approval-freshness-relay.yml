name: Approval freshness relay

# Only a trigger: its completion starts approval-freshness.yml as workflow_run,
# which runs the default branch's workflow with a write token, whatever the
# pull request's base and origin.
# A push to a branch can change the diff of the pull requests based on it
# without sending them any event, so pushes are relayed too: a rewrite, but also
# a fast-forward to commits such a pull request already contains.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
  pull_request_review:
    types:
      - submitted
      - dismissed
  push:
    branches:
      - "**"

permissions: {}

jobs:
  relay:
    # Required status check: keep the name in sync with the ruleset.
    name: approval-freshness-relay
    runs-on: ubuntu-latest
    steps:
      - name: Relay
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event.pull_request.number && format('pull request {0}', github.event.pull_request.number) || github.ref }}
        run: echo "${EVENT} on ${REF}"
