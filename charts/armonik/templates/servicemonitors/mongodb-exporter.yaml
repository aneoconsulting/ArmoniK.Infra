{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- with index .Subcharts.dependencies.Subcharts "mongodb-exporter" -}}
{{- if $ops.prometheusOperator.available }}
{{/* Stands in for the exporter chart's own serviceMonitor: a subchart value cannot be gated on
     the prometheusOperator CRD being available. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "armonik.fullname" $ | printf "%s-mongodb-exporter" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" $ | quote }}
  labels:
    app.kubernetes.io/component: mongodb-exporter
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "armonik.namespace" $ | quote }}
  selector:
    matchLabels:
      {{/* Labelled by the dependency alias, not the chart name (prometheus-mongodb-exporter). */}}
      app.kubernetes.io/name: mongodb-exporter
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  targetLabels:
    - app.kubernetes.io/instance
  endpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - targetLabel: job
          replacement: mongodb-exporter
{{- end }}
{{- end }}
