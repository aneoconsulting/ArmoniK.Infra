{{- $tls := .Values.tls.enabled | default false }}
{{- $mtls := .Values.mtls.enabled | default false }}
{{- $cnPattern := include "armonik.ingress.mtlsCnPattern" .Values }}
apiVersion: v1
immutable: false
kind: ConfigMap
metadata:
  name: {{ include "armonik.fullname" . }}-conf
  namespace: {{ include "armonik.namespace" . }}
  labels:
    app.kubernetes.io/component: ingress
    {{- include "armonik.labels" . | nindent 4 }}
data:
  armonik.conf: |
    resolver kube-dns.kube-system ipv6=off;

    map $http_accept_language $accept_language {
        default en;
        ~*^en en;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $real_scheme {
    default   $scheme;
    https     https;
    }

    {{- if $mtls }}
    map $ssl_client_s_dn $ssl_client_s_dn_cn {
        default "";
        ~CN=(?<CN>[^,/]+) $CN;
    }
    map "$http_x_certificate_client_cn|$ssl_client_s_dn_cn" $client_cn {
        default $ssl_client_s_dn_cn;
    {{- if $cnPattern }}
        ~^(.+)|({{ $cnPattern }})$ $http_x_certificate_client_cn;
    {{- end }}
    }
    map "$http_x_certificate_client_fingerprint|$ssl_client_s_dn_cn" $client_fingerprint {
        default $ssl_client_fingerprint;
    {{- if $cnPattern }}
        ~^(.+)|({{ $cnPattern }})$ $http_x_certificate_client_fingerprint;
    {{- end }}
    }
    {{- end }}

    upstream armonik {
        zone armonik_zone 32k;
        server armonik-control-plane.{{ include "armonik.namespace" . }}.svc.cluster.local:5001 resolve;
        keepalive 128;
        keepalive_time 8h;
        keepalive_timeout 1h;
    }

    server {
        {{- if $tls }}
        # ===== TLS ENABLED =====
        listen 8443 ssl http2;
        listen [::]:8443 ssl http2;
        listen 9443 ssl http2;
        listen [::]:9443 ssl http2;
        {{- if or .Values.tls.ssl.certificatePath .Values.tls.ssl.keyPath }}
        ssl_certificate     {{ default "/ingress/tls.crt" .Values.tls.ssl.certificatePath }};
        ssl_certificate_key {{ default "/ingress/tls.key" .Values.tls.ssl.keyPath }};
        {{- else }}
        # TLS enabled but no certificate paths configured — mount certificate at /ingress or set .Values.tls.ssl.certificatePath and .Values.tls.ssl.keyPath
        {{- end }}
        {{- if $mtls }}
        ssl_verify_client on;
        ssl_client_certificate /ingressclient/ca.pem;
        {{- else }}
        ssl_verify_client off;
        proxy_hide_header X-Certificate-Client-CN;
        proxy_hide_header X-Certificate-Client-Fingerprint;
        {{- end }}
        ssl_protocols {{ default "TLSv1.2 TLSv1.3" .Values.tls.ssl.protocols }};
        ssl_ciphers {{ default "EECDH+AESGCM:EECDH+AES256" .Values.tls.ssl.ciphers }};
        ssl_conf_command Ciphersuites {{ default "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256" .Values.tls.ssl.cipherSuites }};
        {{- else }}
        # ===== TLS DISABLED =====
        listen 8080;
        listen [::]:8080;
        listen 9080 http2;
        listen [::]:9080 http2;
        {{- end }}

        sendfile on;
        tcp_nopush on;

        location = / {
            rewrite ^ $scheme://$http_host/admin/$accept_language/;
        }

        location = /admin {
            rewrite ^ $scheme://$http_host/admin/$accept_language/;
        }
        location = /admin/ {
            rewrite ^ $scheme://$http_host/admin/$accept_language/;
        }
        location = /admin/en {
            rewrite ^ $scheme://$http_host/admin/en/;
        }
        set $admin_app_upstream http://{{ include "armonik.fullname" . | printf "%s-gui" | trunc 63 | trimSuffix "-" }}.{{ include "armonik.namespace" . }}.svc.cluster.local:1080;
        location /admin/ {
            proxy_pass $admin_app_upstream$uri$is_args$args;
        }
        set $armonik_upstream grpc://armonik-control-plane.{{ include "armonik.namespace" . }}.svc.cluster.local:5001;
        location ~* ^/armonik\. {
            {{- if $mtls }}
            grpc_set_header X-Certificate-Client-CN $client_cn;
            grpc_set_header X-Certificate-Client-Fingerprint $client_fingerprint;
            {{- end }}
            grpc_pass $armonik_upstream;

            # Apparently, multiple chunks in a grpc stream is counted has a single body
            # So disable the limit
            client_max_body_size 0;

            # add a timeout of 1 month to avoid grpc exception for long task
            # TODO: find better configuration
            proxy_read_timeout 30d;
            proxy_send_timeout 1d;
            grpc_read_timeout 30d;
            grpc_send_timeout 1d;
        }

        location /static/ {
            alias /static/;
        }

        proxy_buffering off;
        proxy_request_buffering off;

        set $seq_upstream http://seq.{{ include "armonik.namespace" . }}.svc.cluster.local;
        location = /seq {
            rewrite ^ $scheme://$http_host/seq/ permanent;
        }
        location /seq/ {
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            rewrite  ^/seq/(.*)  /$1 break;
            proxy_pass $seq_upstream$uri$is_args$args;
            sub_filter '<head>' '<head><base href="${real_scheme}://${http_host}/seq/">';
            sub_filter_once on;
            proxy_hide_header content-security-policy;
        }
        set $grafana_upstream http://grafana.{{ include "armonik.namespace" . }}.svc.cluster.local;
        location = /grafana {
            rewrite ^ $scheme://$http_host/grafana/ permanent;
        }
        location /grafana/ {
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            rewrite  ^/grafana/(.*)  /$1 break;
            proxy_pass $grafana_upstream$uri$is_args$args;
            sub_filter '<head>' '<head><base href="${real_scheme}://${http_host}/grafana/">';
            sub_filter_once on;
            proxy_intercept_errors on;
            error_page 301 302 307 =302 ${scheme}://${http_host}${upstream_http_location};
        }
        location /grafana/api/live {
            proxy_set_header Host $http_host;
            rewrite  ^/grafana/(.*)  /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $grafana_upstream$uri$is_args$args;
        }
    }
