suite: value gates
templates:
  - pdb.yaml
  - hpa.yaml
  - psp.yaml
  - certificate.yaml
  - certificat.yaml
tests:
  - it: renders no gated resource by default
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a policy/v1 PodDisruptionBudget when enabled
    template: pdb.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 31
      apiVersions:
        - policy/v1
    set:
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: spec.minAvailable
          value: 1
  - it: renders the HorizontalPodAutoscaler when enabled
    template: hpa.yaml
    set:
      HorizontalPodAutoscaler:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
  - it: renders the PodSecurityPolicy below Kubernetes 1.25
    template: psp.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 24
    set:
      rbac:
        pspEnabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodSecurityPolicy
  - it: renders no PodSecurityPolicy from Kubernetes 1.25 on
    template: psp.yaml
    capabilities:
      majorVersion: 1
      minorVersion: 28
    set:
      rbac:
        pspEnabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: renders the cert-manager Certificate from an existing issuer
    template: certificate.yaml
    set:
      tls:
        type: "cert-manager"
        certManager:
          existingIssuer:
            enabled: true
            kind: ClusterIssuer
            name: my-issuer
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: spec.issuerRef.name
          value: my-issuer
  - it: fails TLS via cert-manager when the operator is unavailable and no issuer exists
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges: certificate.yaml gains a
        guard requiring global.armonik.operators.certManager.available=true,
        an existing issuer, or a non-cert-manager tls.type.
    template: certificate.yaml
    set:
      tls:
        type: "cert-manager"
      global:
        armonik:
          operators:
            certManager:
              deploy: false
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "activemq TLS via cert-manager requires it"
