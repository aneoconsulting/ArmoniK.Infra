{{- if list .Values "networkPolicy" "enabled" | include "armonik.utils.index"}}
{{- $nginx := include "armonik.ingress.nginx" . }}

{{- if $nginx }}
{{/*
  nginx NetworkPolicy (ingress and egress).
*/}}
{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "nginx"
      "config" (include "armonik.netpol.ingressNginx" . | fromYaml)
  ) }}
{{- end }}

{{/*
  GUI NetworkPolicy (ingress and egress).
*/}}
{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "gui"
      "config" (include "armonik.netpol.ingressGui" . | fromYaml)
  ) }}

{{/*
  Health-check NetworkPolicy, not scoped to nginx; rendered only when a gateway or HTTPRoute brings
  a health checker to admit in front of nginx.
*/}}
{{- if and $nginx (or .Values.gateway.enabled .Values.httpRoute.enabled) }}
{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "healthcheck"
      "config" (include "armonik.netpol.ingressHealthCheck" . | fromYaml)
  ) }}
{{- end }}

{{- end }}
