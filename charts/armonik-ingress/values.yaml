# global.armonik.* comes from armonik-common via import-values; its defaults suit a standalone release.

# -- Chart name used in resource names and labels.
nameOverride: ""
# -- Name prefix of every resource.
fullnameOverride: ""
# -- Namespace of every resource, the release namespace when empty.
namespaceOverride: ""
imagePullSecrets: []
# The nginx pod alone, on top of the chart-wide values.
deployment:
  # Listed before the chart-level and global ones.
  imagePullSecrets: []
image:
  registry:
  repository: nginxinc/nginx-unprivileged
  tag: 1.31.7-alpine-slim
  pullPolicy: IfNotPresent

# -- Ignored when `hpa.enabled`.
replicas: 1
# -- KEDA ScaledObject on CPU, needs operators.keda.available and metrics-server. `annotations` go on
# its metadata; the other keys are ScaledObject spec fields, passed through as written.
hpa:
  enabled: false
  annotations: {}
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
# -- PodDisruptionBudget. At most one of minAvailable and maxUnavailable; neither means maxUnavailable 1.
podDisruptionBudget:
  enabled: false
  minAvailable:
  maxUnavailable:
  labels: {}
  annotations: {}

nodeSelector: {}
tolerations: []
annotations: {}
affinity: {}
priorityClassName: ""
# -- nginx pod securityContext, also the gui and load-balancer default. nobody, as nginx shares no file
# with the other ArmoniK processes.
podSecurityContext:
  runAsUser: 65534
  runAsGroup: 65534
# -- nginx container securityContext, also the gui and load-balancer default.
securityContext:
  capabilities:
    drop:
      - ALL
  privileged: false
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
# -- Extra env for the nginx container.
extraEnv: []
# -- Extra envFrom for the nginx container.
extraEnvFrom: []
# -- Extra volumes and volumeMounts for the nginx container.
extraVolumes: []
extraVolumeMounts: []
# -- Extra containers, after the nginx container, and extra init containers.
extraContainers: []
extraInitContainers: []
# -- Merged over the nginx container, last. Lists the chart builds are refused: use extra*.
containerPatch: {}
# -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
# Pod labels are out of reach: the selector is immutable.
podSpecPatch: {}


resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 128Mi

ports:
  - name: ingress-grpc
    protocol: grpc
    servicePort: 5001
    http2: true
  - name: ingress-http
    protocol: http
    servicePort: 5000

service:
  type: LoadBalancer
  annotations: {}

# Cluster DNS domain. tls.clusterDomain overrides it; empty falls back to global.clusterDomain, then
# cluster.local.
clusterDomain: ""

tls:
  enabled: false
  certManager:
    enabled: true
    addInjectorAnnotations: true
    existingIssuer:
      # Use an existing cert-manager issuer.
      enabled: false
      # Issuer or ClusterIssuer.
      kind: "Issuer"
      name: "my-issuer"
      group: ""
    # Any provider, selfSigned included, keeps a local Issuer even when the global issuer is enabled.
    # Unset: the global issuer when enabled, else a local selfSigned one. See
    # charts/cert-manager-issuer.md.
    # provider: selfSigned
    # selfSigned: {}
    # ca: {}
    # vault: {}
    # acme: {}
    # venafi: {}
    # googleCas: {}
    # Certificate duration and renewBefore, see
    # https://cert-manager.io/docs/reference/api-docs/#cert-manager.io/v1.CertificateSpec
    duration: ""
    renewBefore: ""
    # DNS SANs appended to the in-cluster Service names. List every hostname external clients use.
    extraDnsNames: []
    # IP SANs. List the Service's external IP if clients connect to it directly.
    ipAddresses: []
    # Extra annotations and labels on the Certificate.
    annotations: {}
    labels: {}
  customCert:
    certPem: ""
    keyPem: ""
  ssl:
    protocols: "TLSv1.2 TLSv1.3"
    ciphers: "EECDH+AESGCM:EECDH+AES256"
    cipherSuites: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256"
    certificatePath: "/ingress/tls.crt"
    keyPath: "/ingress/tls.key"

mtls:
  enabled: false
  certificationAuthority:
    # pem or existingSecret. With neither, cert-manager issues a CA from the issuer tls.certManager
    # resolves (existingIssuer, else global.armonik.certManager.issuer, else a local Issuer).
    pem: ""
    existingSecret: ""
  trustedCommonNames: []

# -- Identity headers nginx sets on gRPC requests to the control plane. The umbrella passes these
# names to the control plane (Authenticator__*Header in its control conf layer); a control plane
# installed as its own release keeps ArmoniK Core's defaults, which are the values below. With mTLS, the CN and fingerprint come from the client certificate (or from a
# trustedCommonNames proxy) and the impersonation headers pass through; without mTLS, all four are
# cleared so a client cannot assert an identity. Letters, digits and dashes only.
identityHeaders:
  commonName: X-Certificate-Client-CN
  fingerprint: X-Certificate-Client-Fingerprint
  impersonationUsername: X-Impersonate-Username
  impersonationId: X-Impersonate-Id

# OIDC single sign-on on the web port (admin GUI, gRPC-web, Grafana, Seq) through an oauth2-proxy
# sidecar and nginx auth_request; the grpc port keeps mTLS for SDK and CLI clients. See
# charts/sso.md. Not supported with gateway.enabled or httpRoute.enabled.
sso:
  enabled: false
  # -- Public URL of the web port as browsers reach it, scheme://host[:port] with no path. The
  # OIDC redirect URI is <publicUrl>/oauth2/callback; https makes the session cookie Secure.
  publicUrl: ""
  # -- user: one CN per person, <cnPrefix><identityClaim>. group: one CN per groupMapping entry.
  identityMode: user
  # -- oauth2-proxy session field the user-mode CN is built from: email, preferred_username, or
  # user (the OIDC subject).
  identityClaim: email
  cnPrefix: "sso:"
  # -- Fingerprint header sent with every SSO identity. ArmoniK Core requires it non-empty; declare
  # the matching userCertificates without a fingerprint so it matches any.
  fingerprint: sso
  groupCnPrefix: "sso-group:"
  # -- group mode: ordered list of {group, cn}, the first IdP group present wins. A user in none of
  # them gets an empty CN, which ArmoniK Core rejects.
  groupMapping: []
  # - group: armonik-admins
  #   cn: admins
  # -- Unauthenticated path answering 200 on both ports, for load balancer health checks.
  healthPath: /healthz
  oauth2Proxy:
    image:
      registry: quay.io
      repository: oauth2-proxy/oauth2-proxy
      # -- Exact tag, v7.15.2 or later (CVE-2026-34457).
      tag: v7.15.5
      pullPolicy: IfNotPresent
    issuerUrl: ""
    clientId: ""
    # -- Secret in the release namespace with keys client-secret and cookie-secret (16, 24 or 32
    # bytes). Bring it yourself, or set externalSecret.storeName to have ESO build it.
    existingSecret: ""
    externalSecret:
      # -- Existing SecretStore or ClusterSecretStore to build existingSecret from; empty: none.
      storeName: ""
      storeKind: ""
      clientSecret:
        key: ""
        property: ""
      cookieSecret:
        key: ""
        property: ""
    scopes: "openid email profile"
    groupsClaim: groups
    # -- Groups allowed to log in (oauth2-proxy --allowed-group); empty: any authenticated user.
    allowedGroups: []
    emailDomains: ["*"]
    # -- Session lifetime: removing a user or group at the IdP takes effect at the latest after it.
    cookieExpire: 8h
    # -- 0 disables the refresh, which needs the OAuth tokens in the cookie: incompatible with
    # sessionCookieMinimal.
    cookieRefresh: "0"
    # -- Keep only the identity (user, email, groups) in the session cookie, not the OAuth tokens,
    # so it stays one cookie under 4 KB: nginx passes on one Set-Cookie per auth subrequest, and a
    # cookie split in _0/_1 breaks the session.
    sessionCookieMinimal: true
    # -- One CSRF cookie per login attempt, named after its state: parallel requests without a
    # session (a page and its favicon) each start a login without overwriting the other's cookie.
    cookieCsrfPerRequest: true
    # -- Lifetime of a CSRF cookie, so per-request cookies of abandoned logins expire.
    cookieCsrfExpire: 15m
    # -- Appended to the generated flags. --ping-user-agent and --gcp-healthchecks are refused.
    extraArgs: []
    resources: {}
    # -- Container securityContext; empty: the chart-level one with a read-only root filesystem.
    securityContext: {}
  networkPolicy:
    # -- CIDRs the nginx pod may reach on TCP 443 for the IdP, required once a NetworkPolicy
    # selects that pod (networkPolicy.enabled here, or the umbrella's).
    idpEgressCidrs: []

# Not read by any template.
volumes:
  # ingressSecret: ingress-crt
  mongodbSecret: mongodb
  # mongodbSecretCrt: mongodb-ca
  nginxConfigMap: armonik-ingress-conf
  nginxStaticConfigMap: armonik-ingress-static

# ==== Multi-cluster gRPC load balancer ====
loadBalancer:
  enabled: false
  clusters: {}
  defaultCluster: ""
  image:
    registry:
    repository: dockerhubaneo/armonik_load_balancer
    # -- Tag. Bumped through global.armonik.versions.infraPlugins, not here.
    # @default -- `global.armonik.versions.infraPlugins`
    tag:
    pullPolicy: IfNotPresent
  replicas: 1
  conf:
    listenPort: 8081
  service:
    type: HeadLess
    port: 8080
    annotations: {}
  resources: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  imagePullSecrets: []
  annotations: {}
  # -- Pod securityContext, the chart-level one when empty. A dedicated uid rather than nobody, as it
  # reads the cluster certificates. runAsUser is required by runAsNonRoot, the image declaring USER 0.
  podSecurityContext:
    runAsUser: 5001
    runAsGroup: 5001
  # -- Falls back to the chart-level securityContext.
  securityContext:
  # -- Extra env for the load-balancer container.
  extraEnv: []
  # -- Extra envFrom for the load-balancer container.
  extraEnvFrom: []
  # -- Extra volumes and volumeMounts for the load-balancer container.
  extraVolumes: []
  extraVolumeMounts: []
  # -- Extra containers, after the load-balancer container, and extra init containers.
  extraContainers: []
  extraInitContainers: []
  # -- Merged over the load-balancer container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}

# Secret holding the upstream URLs (keys control-plane, grafana, seq), read through ESO: its name in
# urlsSecretNamespace (default: the release namespace), or its key in urlsSecretStoreName.
# Empty, or ESO unavailable: the nginx conf is a plain Secret built from control_plane_url,
# grafana_url and seq_url.
#
# Flipping this on an existing release fails: both modes produce a Secret of the same name, and Helm
# refuses to adopt one it does not own. Delete the ExternalSecret first (its Secret goes with it),
# then upgrade:
#   kubectl delete externalsecrets.external-secrets.io -n <namespace> <fullname>-nginx-conf
#   helm upgrade <release-name> ...
urlsSecretName: ""
urlsSecretNamespace: ""
# Read the URLs from a pre-existing ESO store instead of this chart's Kubernetes-provider one;
# urlsSecretName is then the key in that store. Kind defaults to SecretStore, in the release
# namespace. Excludes urlsSecretNamespace; urlsSecretVersion needs a store name.
urlsSecretStoreName: ""
urlsSecretStoreKind: ""
urlsSecretVersion: ""

# ESO sync of the URLs Secret. 1m converges quickly on a fresh install, where the Secret it reads
# may not exist yet; raise it behind a metered store.
conf:
  refreshInterval: 1m0s
  # refreshPolicy: Periodic

# ==== Admin GUI ====
gui:
  image:
    registry:
    repository: dockerhubaneo/armonik_admin_app
    tag:
    pullPolicy: IfNotPresent
  ports:
    - name: gui
      containerPort: 1080
      servicePort: 1080
  service:
    type: ClusterIP
    annotations:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  annotations: {}
  affinity: {}
  priorityClassName: ""
  imagePullSecrets: []
  # -- Pod securityContext, the chart-level one when empty. The image's own user armonik (uid 5000),
  # not nobody: nginx writes to /tmp/nginx, which it owns. runAsUser is required by runAsNonRoot, the
  # image declaring that user by name, which the kubelet cannot verify.
  podSecurityContext:
    runAsUser: 5000
    runAsGroup: 5000
  # -- Falls back to the chart-level securityContext.
  securityContext:
  # -- Extra env for the gui container.
  extraEnv: []
  # -- Extra envFrom for the gui container.
  extraEnvFrom: []
  # -- Extra volumes and volumeMounts for the gui container.
  extraVolumes: []
  extraVolumeMounts: []
  # -- Extra containers, after the gui container, and extra init containers.
  extraContainers: []
  extraInitContainers: []
  # -- Merged over the gui container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}

static:
  environment.json:
    color: "#808080"
    description: "ArmoniK ingress environment"
    name: ""
    version: "{{ .Chart.AppVersion }}"
  # -- Default Admin GUI settings, the JSON exported from its Settings page. The GUI fetches
  # /static/gui_configuration, so the key name is fixed. It fills only the settings a browser has
  # not stored yet, and is ignored unless its `version` matches the GUI's major.minor.
  gui_configuration: {}


# ==== Gateway API ====
gateway:
  enabled: false
  tls:
    enabled: false
  allowedRoutes:
    namespaces:
      from: Same

# ==== HTTPRoute ====
httpRoute:
  enabled: false

# ==== GKE HealthCheckPolicy ====
healthCheckPolicy:
  enabled: false

networkPolicy:
  enabled: false

  # Health-check NetworkPolicy, rendered with gateway.enabled or httpRoute.enabled: its podSelector
  # and its ingress rules (each a full rule with "from" and "ports").
  healthCheckPodSelector: {}
  healthCheckRules: []

  # NetworkPolicy for the nginx front pod.
  nginx:
    # Extra ingress rules, each a full NetworkPolicy rule with "from" and "ports".
    extraIngressRules: []
    # The chart's own egress covers DNS and the GUI. The umbrella adds control-plane, Grafana and Seq
    # (armonik/templates/networkpolicies/nginx-egress.yaml); standalone, add them here, e.g.:
    # extraEgressRules:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/component: control-plane
    #     ports:
    #       - protocol: TCP
    #         port: 1080
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>
    #         podSelector:
    #           matchLabels:
    #             app.kubernetes.io/name: grafana
    #     ports:
    #       - protocol: TCP
    #         port: 3000
    #   - to:
    #       - namespaceSelector:
    #           matchLabels:
    #             kubernetes.io/metadata.name: <namespace>
    #         podSelector:
    #           matchLabels:
    #             app: seq
    #     ports:
    #       - protocol: TCP
    #         port: 80
    extraEgressRules: []

  # NetworkPolicy for the GUI backend pod.
  gui:
    # Extra ingress rules; the chart's own admit nginx only.
    extraIngressRules: []
    # Extra egress rules; the chart's own allow DNS only.
    extraEgressRules: []
