{{/*
Internal URLs the ingress proxies to, one key per enabled component. Each falls back to the
in-cluster Service URL when ingress.{control_plane_url,grafana_url,seq_url} is unset. Lands in the
ingress subchart's namespace, which is where it is consumed.
*/}}
{{- $domain := include "armonik.clusterDomain" . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $cpPort := include "armonik.controlPlane.servicePort" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $ingress.urlsSecretName $ | default (printf "%s-urls" .Release.Name) | quote }}
  namespace: {{ $ingress.urlsSecretNamespace | default (include "armonik.namespace" .Subcharts.ingress) | quote }}
type: Opaque
data:
  {{- if list .Values "control-plane" "enabled" | include "armonik.utils.index" }}
  {{- $url := $ingress.control_plane_url | default "" -}}
  {{- if not $url }}
  {{- with index .Subcharts "control-plane" }}
  {{- $url = printf "%s-control-plane.%s.svc.%s:%d"
      (include "armonik.controlPlane.source" $)
      (include "armonik.namespace" .)
      $domain
      (int $cpPort) -}}
  {{- end }}
  {{- end }}
  {{- if $url }}
  control-plane: {{ $url | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- range $component := list "grafana" "seq" }}
  {{- if list $.Values "dependencies" $component "enabled" | include "armonik.utils.index" }}
  {{- $url := index $ingress (printf "%s_url" $component) | default "" -}}
  {{- with index $.Subcharts.dependencies.Subcharts $component }}
  {{- if not $url }}
  {{- $url = printf "http://%s.%s.svc.%s"
      $component
      (include "armonik.namespace" .)
      $domain -}}
  {{- end }}
  {{- end }}
  {{- if $url }}
  {{ $component }}: {{ $url | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
