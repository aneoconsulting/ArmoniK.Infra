# -- Chart name used in resource names and labels.
nameOverride: ""
# -- Name prefix of every resource.
fullnameOverride: ""
# -- Namespace of every resource, the release namespace when empty. Under the umbrella it must equal the
# umbrella's own namespaceOverride.
namespaceOverride: ""
replicaCount: 1
shareProcessNamespace: false
restartPolicy: Always
imagePullSecrets: []

# global.armonik.* comes from armonik-common via import-values; its defaults suit a standalone plane
# (external operators, KEDA trigger URL derived from conf.source).
global:
  # Release name of the umbrella that owns the conf Secrets (defaults to "armonik").
  armonik:
    source: armonik

serviceAccount:
  create: false
  # -- ServiceAccount name (tpl-rendered), armonik.fullname when empty. With create=false it must exist:
  # by default, the one the conf.source umbrella creates for its own compute plane.
  name: '{{ if not .Values.serviceAccount.create }}{{ include "armonik.conf.source" . }}-compute-plane{{ end }}'
  annotations: {}
  secrets: []

service: {}

rbac:
  # Specifies whether RBAC resources should be created
  create: true

podDisruptionBudget:
  # https://kubernetes.io/docs/tasks/run-application/configure-pdb/
  enabled: false
  minAvailable:
  maxUnavailable:

networkPolicy:
  enabled: false
  # Pod selector matching Prometheus, for the built-in ingress rule below. Defaults to
  # app.kubernetes.io/name: prometheus (kube-prometheus-stack's own label).
  prometheusPodSelector:
  # Extra ingress rules on top of the built-in Prometheus rule. Rarely needed.
  extraIngressRules: []
  # DNS-only by default. Add your own rules below.
  # extraEgressRules:
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # MongoDB's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: percona-server-mongodb
  #     ports:
  #       - protocol: TCP
  #         port: 27017
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # ActiveMQ's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: activemq
  #     ports:
  #       - protocol: TCP
  #         port: 5672
  #   - to:
  #       - namespaceSelector:
  #           matchLabels:
  #             kubernetes.io/metadata.name: <namespace>   # Redis's namespace
  #         podSelector:
  #           matchLabels:
  #             app.kubernetes.io/name: redis
  #     ports:
  #       - protocol: TCP
  #         port: 6379
  extraEgressRules: []

# KEDA is controlled cross-chart by global.armonik.operators.keda: one ScaledObject per partition when
# it is available.

# Base conf, merged into the init Job only (agent/worker build theirs from partitionCommon).
conf:
  # Overrides the umbrella's global.armonik.mountPath for this release (default "/mounts").
  # mountPath: /mounts

init:
  enabled: true
  image:
    registry:
    repository: dockerhubaneo/armonik_control
    tag:
    pullPolicy:
  imagePullSecrets:
  resources:
  nodeSelector:
  tolerations:
  affinity:
  priorityClassName:
  # -- Extra env for the init container. Shared vars go in conf.env.
  extraEnv: []
  # -- Extra envFrom for the init container.
  extraEnvFrom: []
  # -- Extra volumeMounts for the init container.
  extraVolumeMounts: []
  # -- Extra volumes.
  extraVolumes: []
  # -- Extra init containers. There is no extraContainers on a Job: a sidecar that never
  # exits keeps it from finishing.
  extraInitContainers: []
  # containerPatch:
  #   securityContext:
  #     readOnlyRootFilesystem: true
  #
  # -- Merged over the init container, last. Lists the chart builds are refused: use extra*.
  containerPatch: {}
  # podSpecPatch:
  #   hostAliases:
  #     - ip: "10.0.0.1"
  #       hostnames: ["legacy.internal"]
  #
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # Init Job: core + log + jobs layers + core TLS mounts.
  conf:
    envSecret:
      - '{{ list "core" . | include "armonik.conf.secretName" }}'
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "init" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "init" . | include "armonik.conf.mountSecretName" }}'
  configmaps:

partitionCommon:
  socketType: "unixdomainsocket"
  podSecurityContext:
    runAsUser: 5000
  labels:
    app: "armonik"
    service: "compute-plane"
  agent:
    name: polling-agent
    image:
      registry:
      repository: dockerhubaneo/armonik_pollingagent
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: poll-agent-port
      containerPort: 1080
    readinessProbe: {}
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "500m"
      memory: "256Mi"
    securityContext:
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
    enableServiceLinks: true
    messageBatchSize: 1
    graceDelay: "00:00:15"
    # On top of partitionCommon: core (credentials) + polling + core TLS mounts.
    conf:
      envSecret:
        - '{{ list "core" . | include "armonik.conf.secretName" }}'
        - '{{ list "polling" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "core" . | include "armonik.conf.mountSecretName" }}'
        - secret: '{{ list "polling" . | include "armonik.conf.mountSecretName" }}'
    # -- Extra env for the agent container. Shared vars go in conf.env.
    extraEnv: []
    # -- Extra envFrom for the agent container.
    extraEnvFrom: []
    # -- Extra volumeMounts for the agent container.
    extraVolumeMounts: []
    # -- Merged over the agent container, last. Lists the chart builds are refused: use extra*.
    containerPatch: {}
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  imagePullSecrets: []
  terminationGracePeriodSeconds: 30
  # -- Extra containers, after agent, worker and the fluent-bit sidecar.
  extraContainers: []
  # -- Extra init containers.
  extraInitContainers: []
  # -- Extra volumes, after the conf mounts and the cache volume.
  extraVolumes: []
  # -- Merged over spec.template.spec, last. Lists the chart builds are refused: use extra*.
  # Pod labels are out of reach: the selector is immutable.
  podSpecPatch: {}
  # sharedStorage:
  #   enabled: true
  #   volume:
  #     hostPath:
  #       path: /srv/armonik/data
  #       type: Directory
  #
  # -- Shared file storage (FS type) for the worker container only: `shared-volume` mounted at
  # mountPath, plus the worker env FileStorageType=FS and target_data_path=<mountPath>. volume is one
  # Kubernetes volume source without its name (hostPath, persistentVolumeClaim, nfs, csi...). A
  # partition's volume merges over partitionCommon's, so declare the source in one place.
  sharedStorage:
    enabled: false
    mountPath: /data
    readOnly: true
    volume: {}
  # Default worker, will be overridden per partition
  worker:
    name: "worker"
    # -- Worker image, as this object or a reference string. The repository has no default: each
    # partition brings its own, as a full path (dockerhubaneo/armonik_core_stream_test_worker).
    image:
      registry:
      repository:
      tag:
      pullPolicy: IfNotPresent
    ports:
      name: worker-port
      containerPort: 1081
    livenessProbe:
      httpGet:
        path: "/liveness"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: "/startup"
        port: 1080
        scheme: HTTP
      initialDelaySeconds: 1
      periodSeconds: 3
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 20
    terminationMessagePath: "/dev/termination-log"
    terminationMessagePolicy: "File"
    imagePullPolicy: "IfNotPresent"
    limits:
      cpu: "1000m"
      memory: "1024Mi"
    requests:
      cpu: "500m"
      memory: "512Mi"
    # -- Worker container securityContext, same hardening as the agent's. The uid shared with the
    # agent is podSecurityContext's; runAsNonRoot fails a root image if runAsUser is nulled.
    securityContext:
      capabilities:
        drop:
          - ALL
      privileged: false
      runAsNonRoot: true
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
    checkRetries: 10
    checkDelay: "00:00:10"
    # On top of partitionCommon: worker layer only. Never core, so user code stays credential-free.
    conf:
      envSecret:
        - '{{ list "worker" . | include "armonik.conf.secretName" }}'
      mountSecret:
        - secret: '{{ list "worker" . | include "armonik.conf.mountSecretName" }}'
    # -- Extra env for the worker container. Shared vars go in conf.env.
    extraEnv: []
    # -- Extra envFrom for the worker container.
    extraEnvFrom: []
    # -- Extra volumeMounts for the worker container.
    extraVolumeMounts: []
    # -- Merged over the worker container, last. Lists the chart builds are refused: use extra*.
    containerPatch: {}
  hpa:
    type: "prometheus"
    # -- Polling interval in seconds
    pollingInterval: 15  # Optional. Default: 30 seconds
    # -- Cooldown period in seconds
    cooldownPeriod: 300  # Optional. Default: 300 seconds
    # -- Count of idle replicas
    idleReplicaCount: 0  # Optional. Default: ignored, must be less than minReplicaCount
    # -- Minimum count of replicas
    minReplicaCount: 1  # Optional. Default: 0
    # -- Maximum count of replicas
    maxReplicaCount: 5  # Optional. Default: 100

    # -- Fallback options
    # fallback: # Optional. Section to specify fallback options
    #  # -- Threshold of failures
    #  failureThreshold: 3 # Mandatory if fallback section is included
    #  # -- Number of replicas
    #  replicas: 6 # Mandatory if fallback section is included

    # -- Advanced options to manage the behavior of the HPA
    behavior:
      # -- Restore to the original replicas count
      restoreToOriginalReplicaCount: false  # Optional. Default: false
      # -- Stabilization window in seconds
      stabilizationWindowSeconds: 300
      # -- Type of the target
      type: Percent
      # -- Value of the target
      value: 100
      # -- Period in seconds
      periodSeconds: 15
    triggers:
      # Default: KEDA scrapes the metrics-exporter directly, keeping Prometheus out of the scaling path.
      # url comes from global.armonik.monitoring.metricsExporterUrl; targetValue is queued tasks per
      # replica. ASSUMES one always-present sample per armonik_<partition>_tasks_queued - metrics-api
      # cannot aggregate and has no absent-as-zero, so labeled metrics would need the PromQL opt-in.
      - type: metrics-api
        metadata:
          url: '{{ include "armonik.monitoring.metricsExporterUrl" . }}'
          format: prometheus
          valueLocation: 'armonik_{{ .Values.partitionName }}_tasks_queued'
          targetValue: "2"
          activationTargetValue: "0"
      # --- PromQL opt-in (advanced) ---------------------------------------------------------------
      # For rate/ratio/aggregation scaling, swap the trigger above for a prometheus one. Reintroduces the
      # dependency on prometheusOperator.available, and needs the namespace filter to stay multi-release
      # correct:
      #   - type: prometheus
      #     metadata:
      #       serverAddress: '{{ include "armonik.monitoring.prometheusUrl" . }}'
      #       query: 'sum(armonik_{{ .Values.partitionName }}_tasks_queued{namespace="{{ .Release.Namespace }}"})'
      #       threshold: "2"
  replicas: 1
  # Shared by agent + worker (no credentials): log + compute layers.
  conf:
    envSecret:
      - '{{ list "log" . | include "armonik.conf.secretName" }}'
      - '{{ list "compute" . | include "armonik.conf.secretName" }}'
    mountSecret:
      - secret: '{{ list "log" . | include "armonik.conf.mountSecretName" }}'
      - secret: '{{ list "compute" . | include "armonik.conf.mountSecretName" }}'
# Partitions to deploy: each key is a partition name, its value overrides merged over `partitionCommon`.
# At least one is REQUIRED (templates/partitions-guard.yaml), since a plane with none runs no workers.
# Maps being unioned across values files, partitions accumulate rather than replace; `unwanted: null`
# (or --set partitions.unwanted=null) drops an inherited one, while `{}` is a real partition inheriting
# partitionCommon. Only relevant when layering values files: this chart ships no active default.
partitions:

fluentBit:
  isDaemonSet: true
  image:
    registry:
    repository: fluent/fluent-bit
    # Third party, so the tag is required. In step with the fluent-bit subchart used by the DaemonSet.
    tag: "5.1.2"
    pullPolicy: IfNotPresent
  configMapRef: "fluent-bit-config"

preStopWaitScript: "<<EOF while test -e /cache/armonik_agent.sock ; do   sleep 1 done EOF"

# env:
#   pollingAgentAggregation:
