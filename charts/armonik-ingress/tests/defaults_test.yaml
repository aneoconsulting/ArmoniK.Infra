suite: chart defaults
templates:
  - deployments/nginx.yaml
  # The deployment's checksum/* annotation includes it, so it has to be loaded too.
  - armonik-nginx-conf.yaml
tests:
  - it: renders with chart defaults plus urlsSecretName, which has none
    template: deployments/nginx.yaml
    set:
      urlsSecretName: example-urls
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
