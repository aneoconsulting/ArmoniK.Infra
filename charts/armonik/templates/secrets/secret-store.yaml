{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- if $ops.externalSecrets.available }}
{{- $sa := printf "%s-conf-eso" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $currentNamespace := include "armonik.namespace" . }}
{{/* Dedicated read-only ServiceAccount for the Kubernetes-provider SecretStore(s). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $currentNamespace | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $currentNamespace | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $currentNamespace | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa | quote }}
    namespace: {{ $currentNamespace | quote }}
roleRef:
  kind: Role
  name: {{ $sa | quote }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ list "" . | include "armonik.conf.storeName" | quote }}
  namespace: {{ $currentNamespace | quote }}
  {{- if $ops.externalSecrets.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $currentNamespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $sa | quote }}

{{/* One extra SecretStore + cross-namespace RBAC per namespace that differs from this release's namespace  */}}
{{- $additionnalNamespaces := dict }}
{{- range $layer := list "core" "log" "control" "compute" "worker" "polling" "metrics" "init" }}
  {{- $conf := include (printf "armonik.conf.%s" $layer) $ | fromYaml }}
  {{- range $name, $ref := $conf.envFromSecret }}
    {{- if and $ref.namespace (ne $ref.namespace $currentNamespace) }}{{- $_ := set $additionnalNamespaces $ref.namespace true }}{{- end }}
  {{- end }}
  {{- range $mount := $conf.mountSecret }}
    {{- if and $mount.namespace (ne $mount.namespace $currentNamespace) }}{{- $_ := set $additionnalNamespaces $mount.namespace true }}{{- end }}
  {{- end }}
{{- end }}
{{- range $namespace, $_ := $additionnalNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa | quote }}
    namespace: {{ $currentNamespace | quote }}
roleRef:
  kind: Role
  name: {{ $sa | quote }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ list $namespace $ | include "armonik.conf.storeName" | quote }}
  namespace: {{ $currentNamespace | quote }}
  {{- if $ops.externalSecrets.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $namespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $sa | quote }}
{{- end }}
{{- end }}
