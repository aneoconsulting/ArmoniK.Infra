{{- $events := .Values.events | default dict -}}
{{- if $events.enabled -}}
{{- $deployment := .Values.deployment | default dict -}}
{{- /* Never the init: the main Deployment or the init Job owns it. */}}
{{- $conf := list
    (include "armonik.control.confHelper" . | fromYaml)
    (include "armonik.control.events.confHelper" . | fromYaml)
    .Values.conf
    $deployment.conf
    $events.conf
  | include "armonik.conf.merge" | fromYaml -}}
{{- $conf = list $conf $ | include "armonik.conf.resolve" | fromYaml -}}
{{- /* Each non-empty pod-level key of events replaces its chart-level twin, as coalesce does for the
        metrics-exporter. The full Values stay, so the shared helpers render unchanged. */}}
{{- $values := deepCopy .Values -}}
{{- range $key := list
      "resources" "nodeSelector" "tolerations" "affinity" "priorityClassName"
      "podSecurityContext" "securityContext" "livenessProbe" "startupProbe"
      "extraEnv" "extraEnvFrom" "extraVolumeMounts" "extraVolumes" "extraContainers" "extraInitContainers"
      "containerPatch" "podSpecPatch" "labels" "annotations" "podLabels" "podAnnotations" }}
  {{- with index $events $key }}
    {{- $_ := set $values $key (deepCopy .) -}}
  {{- end }}
{{- end }}
{{- $context := omit $ "Values" -}}
{{- $_ := set $context "Values" $values -}}
{{- $hpa := $events.hpa | default dict -}}
{{- dict
      "root" $context
      "component" "control-plane-events"
      "name" (include "armonik.control.events.name" .)
      "conf" $conf
      "replicas" ($hpa.enabled | empty | ternary $events.replicas nil)
  | include "armonik.control.deployment" }}
{{- end }}
