{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- if $ops.keda.available }}
{{- range $partitionName, $config := include "armonik.compute.partitions" $ | fromYaml }}
{{- $partition := dict -}}
{{/* Partition render context: .Values minus partitions, plus partitionName. Full .Values so
     partition values can call helpers, like the monitoring resolver in the triggers. */}}
{{- $context := omit $ "Values" -}}
{{- $_ := omit $.Values "partitions" | set $context "Values" -}}
{{- $_ := set $context.Values "partitionName" $partitionName -}}
{{- dict "dst" $partition "srcs" (list $config $.Values.partitionCommon) "print" false "render" true "context" $context | include "armonik.utils.merge" -}}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-%s" (include "armonik.fullname" $) $partitionName | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" $ }}
  {{- if $ops.keda.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    app.kubernetes.io/component: {{ printf "compute-plane-%s" $partitionName | quote }}
    app.kubernetes.io/part-of: compute-plane
    armonik.fr/partition: {{ $partitionName | quote }}
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ printf "%s-%s" (include "armonik.fullname" $) $partitionName | trunc 63 | trimSuffix "-" | quote }}
  pollingInterval: {{ $partition.hpa.pollingInterval }}
  cooldownPeriod: {{ $partition.hpa.cooldownPeriod }}
  idleReplicaCount: {{ $partition.hpa.idleReplicaCount }}
  minReplicaCount: {{ $partition.hpa.minReplicaCount }}
  maxReplicaCount: {{ $partition.hpa.maxReplicaCount }}
  {{- with $partition.hpa.fallback }}
  fallback:
    failureThreshold: {{ $partition.hpa.fallback.failureThreshold }}
    replicas: {{ $partition.hpa.fallback.replicas }}
  {{- end }}
  advanced:
    restoreToOriginalReplicaCount: {{ $partition.hpa.behavior.restoreToOriginalReplicaCount }}
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ $partition.hpa.behavior.stabilizationWindowSeconds }}
          policies:
            - type: {{ $partition.hpa.behavior.type }}
              value: {{ $partition.hpa.behavior.value }}
              periodSeconds: {{ $partition.hpa.behavior.periodSeconds }}
  triggers:
{{ toYaml $partition.hpa.triggers | indent 4 }}
{{ end }}
{{ end }}
