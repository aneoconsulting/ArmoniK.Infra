{{- if .Values.metricsExporter.enabled }}
{{- $conf := list
    (include "armonik.control.metrics.confHelper" $ | fromYaml)
    .Values.conf
    .Values.metricsExporter.conf
  | include "armonik.conf.merge" | fromYaml }}
{{- $conf = list $conf $ | include "armonik.conf.resolve" | fromYaml }}
{{- $image := list $ "metricsExporter.image" .Values.metricsExporter.image .Values.image | include "armonik.utils.imageConf" | fromYaml }}
{{- $ctx := dict "root" $ "conf" $conf "image" $image -}}
{{- $podSpec := list (include "armonik.control.metrics.podSpec" $ctx) .Values.metricsExporter.podSpecPatch "metricsExporter.podSpecPatch" | include "armonik.utils.patch" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "armonik.fullname" . | printf "%s-metrics-exporter" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ include "armonik.namespace" . }}
  labels:
    app.kubernetes.io/component: metrics-exporter
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with coalesce .Values.metricsExporter.annotations .Values.annotations}}
  annotations:
  {{- range $key, $value := . }}
    {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.metricsExporter.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics-exporter
      {{- include "armonik.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: metrics-exporter
        {{- include "armonik.selectorLabels" . | nindent 8 }}
    spec: {{- $podSpec | nindent 6 }}
{{- end }}
