suite: network policy
templates:
  - network-policy.yaml
tests:
  - it: renders nothing by default (networkPolicy.enabled=false)
    template: network-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with the activemq podSelector and both Ingress/Egress policyTypes when enabled
    template: network-policy.yaml
    set:
      networkPolicy:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: activemq
            app.kubernetes.io/instance: RELEASE-NAME
      - equal:
          path: spec.policyTypes
          value:
            - Ingress
            - Egress

  - it: allows control-plane/init and compute-plane ingress on the AMQP port, open to any namespace by default
    template: network-policy.yaml
    set:
      networkPolicy:
        enabled: true
    asserts:
      # documented default: networkPolicy.namespaceSelector unset means "any namespace"
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector
          value: {}
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchExpressions
          value:
            - key: app.kubernetes.io/component
              operator: In
              values:
                - control-plane
                - init
      - equal:
          path: spec.ingress[0].from[1].podSelector.matchLabels
          value:
            app.kubernetes.io/part-of: compute-plane
      - equal:
          path: spec.ingress[0].ports
          value:
            - protocol: TCP
              port: 5672

  - it: scopes ingress to a specific namespace instead of the open default when networkPolicy.namespaceSelector is set
    template: network-policy.yaml
    set:
      networkPolicy:
        enabled: true
        namespaceSelector: clients
    asserts:
      # negative case: no more namespaceSelector: {} once a namespace is stated
      - equal:
          path: spec.ingress[0].from[0].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: clients
      - equal:
          path: spec.ingress[0].from[1].namespaceSelector
          value:
            matchLabels:
              kubernetes.io/metadata.name: clients

  - it: grants DNS-only egress by default
    template: network-policy.yaml
    set:
      networkPolicy:
        enabled: true
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 1
      - equal:
          path: spec.egress
          value:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53

  - it: appends extraIngressRules and extraEgressRules to the chart's own rules
    template: network-policy.yaml
    set:
      networkPolicy:
        enabled: true
        extraIngressRules:
          - ports:
              - protocol: TCP
                port: 8161
        extraEgressRules:
          - ports:
              - protocol: TCP
                port: 61616
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 2
      - lengthEqual:
          path: spec.egress
          count: 2
      - contains:
          path: spec.ingress
          content:
            ports:
              - protocol: TCP
                port: 8161
      - contains:
          path: spec.egress
          content:
            ports:
              - protocol: TCP
                port: 61616
