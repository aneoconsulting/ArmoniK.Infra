suite: operator control surface
release:
  name: t
templates:
  - operators-guard.yaml
  - secrets/conf-secrets.yaml
  - cert-manager-wait.yaml
tests:
  - it: rejects an operator deployed but not available
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges: it adds
        templates/operators-guard.yaml and the global.armonik.operators
        control map.
    template: operators-guard.yaml
    set:
      global:
        armonik:
          operators:
            keda:
              deploy: true
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "deploy=true but available=false"
  - it: fails secret-backed conf when the ESO operator is unavailable
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges: the ESO gate moves from
        dependencies.external-secrets.enabled to
        global.armonik.operators.externalSecrets.available (the fail_with
        umbrella-envsecret-without-eso matrix case must move to this trigger
        at the same time).
    template: secrets/conf-secrets.yaml
    set:
      global:
        armonik:
          operators:
            externalSecrets:
              deploy: false
              available: false
    asserts:
      - failedTemplate:
          errorPattern: "envSecret and envFromSecret require ExternalSecretsOperator"
  - it: hooks the cert-manager wait job with before-hook-creation
    skip:
      reason: >-
        Enable after PR #294 (operator split) merges: the cert-manager wait
        job moves from armonik-ingress/templates/certificate.yaml to the
        umbrella's templates/cert-manager-wait.yaml (the ingress tls_test
        wait-job assertions move here at the same time).
    template: cert-manager-wait.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - exists:
          path: metadata.annotations["helm.sh/hook"]
      - matchRegex:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          pattern: before-hook-creation
