{{- $networkPolicyEnabled := list .Values "networkPolicy" "enabled"
    | include "armonik.utils.index"
-}}

{{/*
  Nginx egress to control-plane, Grafana and Seq. Lives in the umbrella, the only chart resolving
  their namespaces and selectors through .Subcharts.
*/}}
{{- $ingressEgress := include "armonik.netpol.ingressEgress" . | fromYaml -}}

{{- if and $networkPolicyEnabled $ingressEgress }}
{{- include "armonik.netpol.render" (dict
      "context" .
      "component" "nginx-egress"
      "config" $ingressEgress
  ) }}
{{- end }}
