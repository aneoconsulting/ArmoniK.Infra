{{- $mtls := .Values.mtls | default dict }}
{{- $tls := .Values.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- $ca := $mtls.certificationAuthority | default dict }}
{{- if $mtls.enabled }}
{{- if not $tls.enabled }}
{{- fail "mtls.enabled requires tls.enabled: mTLS requires TLS to be enabled. Set tls.enabled=true when mtls.enabled=true." }}
{{- end }}
{{- if $ca.existingSecret }}
{{- /* Mounted by deployments/nginx.yaml as-is; nothing to render. */}}
{{- else if $ca.pem }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "armonik.fullname" . }}-mtls-ca
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.pem | b64enc | quote }}
{{- else -}}
{{- /* No CA given: fall back to a cert-manager-issued CA, mirroring the TLS server cert's three-tier
       fallback in certificate.yaml exactly - local existingIssuer, else the shared global issuer, else
       a local Issuer this chart creates itself, backed by the SAME tls.certManager.provider - and only
       then fail, because cert-manager itself is unavailable. Provider must match certificate.yaml's:
       when tls.certManager.enabled is true, that file already created (or will create) the local
       fallback Issuer this one references below, and a mismatched provider here would resolve the
       wrong kind/group (e.g. Issuer instead of the GoogleCASIssuer that actually exists). */}}
{{- $issuerName := include "armonik.fullname" . | printf "%s-issuer" }}
{{- $provider := $certManager.provider | default "selfSigned" }}
{{- $localRequested := hasKey $certManager "provider" }}
{{- $issuer := list $ $certManager.existingIssuer $issuerName $provider $localRequested | include "armonik.certManager.getIssuer" | fromYaml }}
{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- if and (not $ops.certManager.available) $issuer.needsLocalIssuer }}
{{- fail "mtls.enabled requires a client CA and cert-manager is not available to issue a throwaway one: set mtls.certificationAuthority.pem, set mtls.certificationAuthority.existingSecret, set tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or set global.armonik.operators.certManager.available=true." }}
{{- end }}
{{- if $issuer.needsLocalIssuer }}
{{- if not $certManager.enabled }}
{{- /* certificate.yaml creates this exact fallback Issuer (same issuerName, same provider) whenever
       tls.certManager.enabled is true; only create it here too when that will not happen, so this
       component ends up with one local Issuer, never a redundant second one. */}}
{{- include "armonik.certManager.issuerManifest" (dict
      "root" $
      "name" $issuer.name
      "namespace" (include "armonik.namespace" .)
      "provider" $provider
      "kind" $issuer.kind
      "group" $issuer.group
      "spec" (index $certManager $provider | default dict)
      "labels" (include "armonik.labels" .)
      "specValuesPath" "tls.certManager") }}
{{- end }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "armonik.fullname" . }}-mtls-ca
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "armonik.fullname" . }}-mtls-ca
  secretName: {{ include "armonik.fullname" . }}-mtls-ca
  usages:
    - cert sign
    - crl sign
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ $issuer.name | quote }}
    kind: {{ $issuer.kind | quote }}
    group: {{ $issuer.group | quote }}
{{- end }}
{{- end }}
