{{- if .Values.HorizontalPodAutoscaler.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
  {{- with .Values.service.labels -}}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    name: {{ include "armonik.fullname" . }}
    kind: Deployment
    apiVersion: apps/v1
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
#   metrics:
#   - type: Object
#     object:
#       metric:
#         name: requests_per_second
#       describedObject:
#         apiVersion: v1
#         kind: Service
#         name: {{ include "armonik.fullname" . }}
#       target:
#         type: Value
#         value: 1000
{{- end -}}
