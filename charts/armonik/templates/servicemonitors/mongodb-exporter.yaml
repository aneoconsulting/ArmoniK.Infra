{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- with index .Subcharts.dependencies.Subcharts "mongodb-exporter" -}}
{{- $namespace := include "armonik.mongodbExporter.namespace" . -}}
{{- if $ops.prometheusOperator.available }}
{{/* mongodb-exporter's metrics, on its chart's default "metrics" Service port. The chart's own
     serviceMonitor.enabled is static and cannot follow prometheusOperator.available, hence this one
     (see dependencies.mongodb-exporter in values.yaml). */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "armonik.fullname" $ | printf "%s-mongodb-exporter" | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    app.kubernetes.io/component: mongodb-exporter
    {{- include "armonik.labels" $ | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ $namespace | quote }}
  selector:
    matchLabels:
      {{/* Alias-derived name label: see armonik.netpol.rule.mongodbExporterFrom. */}}
      app.kubernetes.io/name: mongodb-exporter
      app.kubernetes.io/instance: {{ $.Release.Name | quote }}
  targetLabels:
    - app.kubernetes.io/instance
  endpoints:
    - port: metrics
      path: /metrics
      relabelings:
        - targetLabel: job
          replacement: mongodb-exporter
{{- end }}
{{- end }}
