{{- $issuer := dig "armonik" "certManager" "issuer" dict .Values.global -}}
{{- if and $issuer.enabled $issuer.create -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- if eq $issuer.provider "googleCas" -}}
{{- $gcas := $issuer.googleCas | default dict -}}

apiVersion: cas-issuer.jetstack.io/v1beta1
kind: GoogleCASIssuer
metadata:
  name: {{ $issuer.name }}
  namespace: {{ include "armonik.namespace" . }}
  {{- if $ops.googleCasIssuer.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  project: {{ required "global.armonik.certManager.issuer.googleCas.project is required" $gcas.project | quote }}
  location: {{ required "global.armonik.certManager.issuer.googleCas.location is required" $gcas.location | quote }}
  caPoolId: {{ required "global.armonik.certManager.issuer.googleCas.caPoolId is required" $gcas.caPoolId | quote }}
  {{- with $gcas.certificateAuthorityId }}
  certificateAuthorityId: {{ . | quote }}
  {{- end }}
  {{- with $gcas.credentials }}
  {{- if .name }}
  credentials:
    name: {{ .name | quote }}
    key: {{ .key | default "credentials.json" | quote }}
  {{- end }}
  {{- end }}
{{- else if eq $issuer.provider "venafi" -}}
{{- $venafi := $issuer.venafi | default dict -}}
{{- $tpp := $venafi.tpp | default dict -}}
{{- $cloud := $venafi.cloud | default dict -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuer.name }}
  namespace: {{ include "armonik.namespace" . }}
  {{- if $ops.certManager.deploy }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  venafi:
    zone: {{ required "global.armonik.certManager.issuer.venafi.zone is required" $venafi.zone | quote }}
    {{- if $tpp.url }}
    tpp:
      url: {{ $tpp.url | quote }}
      credentialsRef:
        name: {{ required "global.armonik.certManager.issuer.venafi.tpp.credentialsRef.name is required" $tpp.credentialsRef.name | quote }}
      {{- with $tpp.caBundle }}
      caBundle: {{ . | b64enc | quote }}
      {{- end }}
    {{- else }}
    cloud:
      apiTokenSecretRef:
        name: {{ required "global.armonik.certManager.issuer.venafi.cloud.apiTokenSecretRef.name is required" $cloud.apiTokenSecretRef.name | quote }}
        key: {{ $cloud.apiTokenSecretRef.key | default "apikey" | quote }}
    {{- end }}
{{- end }}
{{- end }}