{{- $ops := include "armonik.operators" $ | fromYaml }}
{{- $redis := .Values.dependencies.redis | default dict }}
{{- $tls := $redis.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- if and $redis.enabled $tls.enabled $certManager.enabled }}
{{- /* Real valkey Service name: charts/armonik-dependencies/charts/redis is the valkey chart, aliased
       "redis" (so its own .Chart.Name resolves to "redis" there, not "valkey"). Call its own fullname
       helper through the live subchart scope, the same pattern armonik.redis.host in
       storage/_redis.tpl already uses for the connection string, rather than hardcoding
       "<release>-redis": a hardcoded guess silently diverges from nameOverride/fullnameOverride. */}}
{{- $svcName := include "valkey.fullname" .Subcharts.dependencies.Subcharts.redis }}
{{- $ns := include "armonik.namespace" . }}
{{- /* Same three-tier fallback as activemq/armonik-ingress: local existingIssuer, else the shared
       issuer, else a throwaway local selfSigned Issuer - redis is a single server with one
       client-facing cert, so unlike mongodb it has no common-CA constraint against that. */}}
{{- $issuerName := printf "%s-issuer" $svcName }}
{{- $issuer := list $ $certManager.existingIssuer $issuerName | include "armonik.certManager.getIssuer" | fromYaml }}
{{- if and (not $ops.certManager.available) $issuer.needsLocalIssuer }}
{{- fail "dependencies.redis.tls.certManager.enabled requires it: set global.armonik.operators.certManager.available=true, set dependencies.redis.tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or disable certManager.enabled and bring your own TLS Secret via tls.existingSecret." }}
{{- end }}
{{- if empty $issuer.name }}
{{- fail "the cert-manager issuer has no name: set dependencies.redis.tls.certManager.existingIssuer.name when existingIssuer.enabled=true, else global.armonik.certManager.issuer.name must not be empty." }}
{{- end }}
{{- if $issuer.needsLocalIssuer }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
  {{- end }}
  name: {{ $issuer.name | quote }}
  namespace: {{ $ns }}
spec:
  selfSigned: {}
---
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $svcName }}-tls
  namespace: {{ $ns }}
  {{- if $ops.certManager.deploy }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
spec:
  commonName: {{ $svcName }}
  dnsNames:
  - {{ $svcName }}
  - {{ $svcName }}.{{ $ns }}
  - {{ $svcName }}.{{ $ns }}.svc
  - {{ $svcName }}.{{ $ns }}.svc.{{ include "armonik.clusterDomain" . }}
  secretName: {{ required "dependencies.redis.tls.existingSecret is required when certManager.enabled=true" $tls.existingSecret }}
  {{- include "armonik.certManager.certificateSpec" (dict "certManager" $certManager "issuer" $issuer) | nindent 2 }}
{{- end }}
