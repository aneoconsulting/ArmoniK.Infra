{{- $mtls := .Values.mtls | default dict }}
{{- $tls := .Values.tls | default dict }}
{{- $ca := $mtls.certificationAuthority | default dict }}
{{- if $mtls.enabled }}
{{- if not $tls.enabled }}
{{- fail "mtls.enabled requires tls.enabled: mTLS requires TLS to be enabled. Set tls.enabled=true when mtls.enabled=true." }}
{{- end }}
{{- if not $ca.existingSecret }}
{{- if not $ca.pem }}
{{- fail "mtls.enabled requires the client CA: set mtls.certificationAuthority.pem to a PEM-encoded CA certificate, or mtls.certificationAuthority.existingSecret to the name of an existing Secret (key \"ca.pem\") that already holds it." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "armonik.fullname" . }}-mtls-ca
  namespace: {{ include "armonik.namespace" . | quote }}
  labels:
    {{- include "armonik.labels" . | nindent 4 }}
type: Opaque
data:
  ca.pem: {{ $ca.pem | b64enc }}
{{- end }}
{{- end }}
