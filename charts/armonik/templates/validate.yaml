{{- /* Grafana's public path depends on the ingress mode; a mismatch breaks the UI with no error
       anywhere. nginx (armonik.grafana.locations in armonik-ingress) injects the /grafana prefix
       itself and needs an empty appSubUrl; a Gateway passes /grafana through, so Grafana must serve
       that sub-path, and its /metrics moves under it. */ -}}
{{- $grafanaEnabled := list .Values "dependencies" "grafana" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- $ingressEnabled := list .Values "ingress" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- if and $grafanaEnabled $ingressEnabled -}}
  {{- $server := list .Values "dependencies" "grafana" "grafana.ini" "server" | include "armonik.utils.index" | fromYaml | default dict -}}
  {{- $rootUrl := $server.root_url | default "" | toString -}}
  {{- /* appSubUrl is root_url's path. */ -}}
  {{- $parts := splitList "://" $rootUrl | last | splitn "/" 2 -}}
  {{- $path := $parts._1 | default "" | trimSuffix "/" -}}
  {{- if include "armonik.ingress.gatewayMode" . -}}
    {{- if ne $path "grafana" -}}
      {{- printf `ingress.mode=gateway routes /grafana to Grafana as is: set dependencies.grafana."grafana.ini".server.root_url to its public URL ending in /grafana/ (or "%%(protocol)s://%%(domain)s:%%(http_port)s/grafana/"), got %q.` $rootUrl | fail -}}
    {{- end -}}
    {{- if not $server.serve_from_sub_path -}}
      {{- fail `ingress.mode=gateway routes /grafana to Grafana as is: set dependencies.grafana."grafana.ini".server.serve_from_sub_path=true.` -}}
    {{- end -}}
    {{- $monitor := list .Values "dependencies" "grafana" "serviceMonitor" | include "armonik.utils.index" | fromYaml | default dict -}}
    {{- if and $monitor.enabled (ne ($monitor.path | default "/metrics") "/grafana/metrics") -}}
      {{- fail `ingress.mode=gateway: Grafana serves /metrics under its sub-path, set dependencies.grafana.serviceMonitor.path=/grafana/metrics.` -}}
    {{- end -}}
  {{- else -}}
    {{- if $path -}}
      {{- printf `dependencies.grafana."grafana.ini".server.root_url must not carry a path, got %q: armonik-ingress injects Grafana's public prefix itself and needs an empty appSubUrl. Drop the %q segment, or set ingress.enabled=false to proxy Grafana yourself.` $rootUrl $path | fail -}}
    {{- end -}}
    {{- if $server.serve_from_sub_path -}}
      {{- fail `dependencies.grafana."grafana.ini".server.serve_from_sub_path must stay false: armonik-ingress strips the prefix before proxying, so Grafana keeps serving at "/".` -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* One backend per Core storage slot: the fragment listed last in _core.tpl would silently win the
       slot's Components__ keys while the other backend still deploys. */ -}}
{{- $slots := dict
      "table storage" (list "mongodb" "postgresql" "externalPostgresql")
      "object storage" (list "redis" "gcs" "s3")
      "queue" (list "activemq" "rabbitmq" "pubsub" "sqs") -}}
{{- range $slot, $deps := $slots -}}
  {{- $on := list -}}
  {{- range $dep := $deps -}}
    {{- if list $.Values "dependencies" $dep "enabled" | include "armonik.utils.index" -}}
      {{- $on = append $on $dep -}}
    {{- end -}}
  {{- end -}}
  {{- if gt (len $on) 1 -}}
    {{- printf "dependencies %s back the same %s slot: enable only one." (join ", " $on) $slot | fail -}}
  {{- end -}}
{{- end -}}

{{- /* The Cluster CR has no CRD without the CloudNativePG operator: fail at render. */ -}}
{{- $ops := include "armonik.operators" $ | fromYaml -}}
{{- $postgresqlEnabled := list .Values "dependencies" "postgresql" "enabled" | include "armonik.utils.index" | empty | not -}}
{{- if and $postgresqlEnabled (not $ops.postgresqlOperator.available) -}}
  {{- fail "dependencies.postgresql.enabled=true requires global.armonik.operators.postgresqlOperator.available=true: the Cluster CR needs the CloudNativePG CRDs." -}}
{{- end -}}
