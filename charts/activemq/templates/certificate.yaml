{{- $tls := .Values.tls | default dict }}
{{- $certManager := $tls.certManager | default dict }}
{{- if and $tls.enabled (eq $tls.type "cert-manager") }}
{{- $issuerName := printf "%s-issuer" (include "armonik.fullname" .) }}
{{- $provider := $certManager.provider | default "selfSigned" }}
{{- $localRequested := hasKey $certManager "provider" }}
{{- $issuer := list $ $certManager.existingIssuer $issuerName $provider $localRequested | include "armonik.certManager.getIssuer" | fromYaml }}
{{- if and (not (dig "armonik" "operators" "certManager" "available" true .Values.global)) $issuer.needsLocalIssuer }}
{{- fail "activemq TLS via cert-manager requires it: set global.armonik.operators.certManager.available=true, set tls.certManager.existingIssuer.enabled=true, set global.armonik.certManager.issuer.enabled=true, or use a tls.type other than cert-manager." }}
{{- end }}
{{- if $issuer.needsLocalIssuer }}
{{- $extraAnnotations := "" }}
{{- with .Values.additionalAnnotations }}{{- $extraAnnotations = toYaml . }}{{- end }}
{{- /* CRD-ordering hook only when THIS release installs cert-manager; external/absent -> no hook.
       Weight 0 keeps the Issuer ahead of the Certificate below, hooked at weight 10. */}}
{{- include "armonik.certManager.issuerManifest" (dict
      "root" $
      "name" $issuer.name
      "namespace" (include "armonik.namespace" .)
      "provider" $provider
      "kind" $issuer.kind
      "group" $issuer.group
      "spec" (index $certManager $provider | default dict)
      "extraAnnotations" $extraAnnotations
      "specValuesPath" "tls.certManager") }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "armonik.fullname" . }}
  namespace: {{ include "armonik.namespace" . | quote }}
  {{- if dig "armonik" "operators" "certManager" "deploy" false .Values.global }}
  {{- /* Hooked only when this release installs the CRDs; otherwise a plain resource. */}}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
  {{- end }}
spec:
  commonName: {{ include "armonik.fullname" . }}
  dnsNames:
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc
  - {{ include "armonik.fullname" . }}.{{ include "armonik.namespace" . }}.svc.{{ $tls.clusterDomain }}
  secretName: {{ include "armonik.fullname" . }}
  {{- include "armonik.certManager.certificateSpec" (dict "certManager" $certManager "issuer" $issuer) | nindent 2 }}
  additionalOutputFormats:
    - type: CombinedPEM
{{- end }}
