# Layered install, the target layout: the operators release goes in first and this release only
# consumes it. deploy=false drops the operator subcharts; available=true still emits the CRs
# (ExternalSecret, SecretStore, ScaledObject, Service/PodMonitor), unhooked since this release owns
# no CRD.
#
# Unlike minimal-values.yaml, the third-party dependencies stay at their defaults, so the real CRs
# get rendered.
global:
  armonik:
    # kube-prometheus-stack is in the operators release: its URL is stated, as the armonik-operators
    # NOTES print it.
    monitoring:
      prometheusUrl: http://ops-kube-prometheus-prometheus.monitoring.svc:9090
    # Only prometheusOperator.namespace is read here: the Grafana dashboard sidecar derives its
    # watched namespaces from it and fails on an empty one. keda's feeds the NetworkPolicies, off in
    # this profile; the others are stated for symmetry.
    operators:
      externalSecrets:
        deploy: false
        available: true
        namespace: external-secrets
      keda:
        deploy: false
        available: true
        namespace: keda
      certManager:
        deploy: false
        available: true
        namespace: cert-manager
      mongodbOperator:
        deploy: false
        available: true
        namespace: mongodb-operator
      prometheusOperator:
        deploy: false
        available: true
        namespace: monitoring
